$kind: http-request
name: "[Instructor] A client-supplied actor_id is rejected"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  Attribution is server-side.
url: "{{BASE_URL}}/api/batches"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "upload_key": "{{BATCH_UPLOAD_KEY}}",
      "actor_id": "{{TA_USER_ID}}",
      "file_name": "postman-answers.csv"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
      pm.test("names actor_id", () => pm.expect(pm.response.json().message).to.include("actor_id"));
    language: text/javascript
order: 5000
