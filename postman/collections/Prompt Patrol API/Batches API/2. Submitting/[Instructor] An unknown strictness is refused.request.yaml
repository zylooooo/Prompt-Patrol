$kind: http-request
name: "[Instructor] An unknown strictness is refused"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)
url: "{{BASE_URL}}/api/batches"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "upload_key": "{{BATCH_UPLOAD_KEY}}",
      "strictness": "0.3",
      "file_name": "postman-answers.csv"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("strictness must be one of ['lenient', 'standard', 'strict']."));
    language: text/javascript
order: 4000
