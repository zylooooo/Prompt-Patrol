$kind: http-request
name: "[Instructor] Cancelling again changes nothing"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)
url: "{{BASE_URL}}/api/batches/{{BATCH_ID}}/cancel"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("same cancellation time", () => pm.expect(pm.response.json().batch.cancelled_at).to.eql(pm.globals.get("BATCH_CANCELLED_AT")));
    language: text/javascript
order: 2000
