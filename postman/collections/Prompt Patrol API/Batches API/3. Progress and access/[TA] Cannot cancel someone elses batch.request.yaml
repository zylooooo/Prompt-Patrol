$kind: http-request
name: "[TA] Cannot cancel someone elses batch"
description: |-
  Runs as: teaching_assistant (TA_SESSION)

  Same 404.
url: "{{BASE_URL}}/api/batches/{{BATCH_ID}}/cancel"
method: POST
headers:
  Cookie: __Host-session={{TA_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Batch not found"));
    language: text/javascript
order: 4000
