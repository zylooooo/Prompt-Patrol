$kind: http-request
name: "[Instructor] Read the progress"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)
url: "{{BASE_URL}}/api/batches/{{BATCH_ID}}"
method: GET
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("my batch", () => pm.expect(body.batch.batch_id).to.eql(pm.globals.get("BATCH_ID")));
      pm.test("every row is accounted for", () => {
        pm.expect(body.row_total).to.eql(3);
        pm.expect(body.completed + body.failed + body.pending).to.eql(body.row_total);
      });
      pm.test("the short row failed validation", () => pm.expect(body.failures).to.deep.include(
        { row_number: 4, external_ref: "postman-3", reason: "answer_text is under 10 characters." }));
    language: text/javascript
order: 1000
