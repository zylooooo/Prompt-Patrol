$kind: http-request
name: "[Instructor] Ending it again is 404"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  There is no active link left to end.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors/{{INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("detail explains why", () => pm.expect(pm.response.json().detail).to.eql("Not found"));
    language: text/javascript
order: 4000
