$kind: http-request
name: "[Instructor] Ending it again is 404"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  There is no active link left to end.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors/{{INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Not found"));
    language: text/javascript
order: 4000
