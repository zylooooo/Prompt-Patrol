$kind: http-request
name: "[TA] TAs cannot end links"
description: |-
  Runs as: teaching_assistant (TA_SESSION)

  Refused by the route's role gate.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors/{{INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{TA_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Insufficient role"));
    language: text/javascript
order: 1000
