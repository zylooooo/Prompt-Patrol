$kind: http-request
name: "[Admin] Link the TA back to the instructor"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Restores the link. Ended links are history, not blockers, so re-linking the same pair works.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("both supervisors again", () => pm.expect(body.supervisor_ids).to.have.lengthOf(2));
    language: text/javascript
order: 6000
