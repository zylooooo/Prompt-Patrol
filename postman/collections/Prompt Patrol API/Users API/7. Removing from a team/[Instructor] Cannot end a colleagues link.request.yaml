$kind: http-request
name: "[Instructor] Cannot end a colleague's link"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  404, not 403, so the endpoint cannot be used to map another instructor's team.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors/{{NEW_INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Not found"));
    language: text/javascript
order: 2000
