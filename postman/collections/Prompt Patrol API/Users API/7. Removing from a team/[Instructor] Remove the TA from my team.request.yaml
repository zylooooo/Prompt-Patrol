$kind: http-request
name: "[Instructor] Remove the TA from my team"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  Ends only this instructor's link; the other supervisor is kept.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors/{{INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("only the other instructor remains", () =>
        pm.expect(body.supervisor_ids).to.eql([pm.globals.get("NEW_INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 3000
