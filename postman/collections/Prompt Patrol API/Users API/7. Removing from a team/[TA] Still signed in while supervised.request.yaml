$kind: http-request
name: "[TA] Still signed in while supervised"
description: |-
  Runs as: teaching_assistant (TA_SESSION)

  Losing one of two supervisors does not sign the TA out.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session={{TA_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("the other instructor still supervises", () =>
        pm.expect(body.supervisor_ids).to.eql([pm.globals.get("NEW_INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 5000
