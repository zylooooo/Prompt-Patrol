$kind: http-request
name: "[Admin] Can rename anyone"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

url: "{{BASE_URL}}/api/users/{{ADDED_TA_USER_ID}}"
method: PATCH
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "display_name": "Renamed by admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("renamed", () => pm.expect(pm.response.json().display_name).to.eql("Renamed by admin"));
    language: text/javascript
order: 6000
