$kind: http-request
name: "[TA] Name myself - markup and control characters are removed"
description: |-
  Environment: Prompt Patrol Dev - TA

  The name is shown to others, so it is cleaned like a status reason.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: PATCH
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "display_name": "  <b>Wei</b> Lin\n "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("cleaned", () => pm.expect(pm.response.json().display_name).to.eql("bWei/b Lin"));
    language: text/javascript
order: 2000
