$kind: http-request
name: "[Instructor] Cannot rename their own TA"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  404, same as GET on someone you cannot see.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: PATCH
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "display_name": "Nickname"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 5000
