$kind: http-request
name: "[TA] Put my name back"
description: |-
  Environment: Prompt Patrol Dev - TA

  Restores TA_ORIGINAL_NAME.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: PATCH
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "display_name": "{{TA_ORIGINAL_NAME}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("restored", () => pm.expect(pm.response.json().display_name).to.eql(pm.globals.get("TA_ORIGINAL_NAME")));
    language: text/javascript
order: 8000
