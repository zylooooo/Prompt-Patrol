$kind: http-request
name: "[TA] A blank name is rejected"
description: |-
  Environment: Prompt Patrol Dev - TA

  A name, once set, cannot be cleared.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: PATCH
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "display_name": "   "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("422", () => pm.response.to.have.status(422));
    language: text/javascript
order: 3000
