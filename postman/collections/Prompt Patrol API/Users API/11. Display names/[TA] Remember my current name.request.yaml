$kind: http-request
name: "[TA] Remember my current name"
description: |-
  Environment: Prompt Patrol Dev - TA

  Stores TA_ORIGINAL_NAME for the last request.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("200", () => pm.response.to.have.status(200));
      pm.globals.set("TA_ORIGINAL_NAME", pm.response.json().display_name || "Postman TA");
    language: text/javascript
order: 1000
