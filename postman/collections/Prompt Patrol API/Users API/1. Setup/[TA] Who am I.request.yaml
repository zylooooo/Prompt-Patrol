$kind: http-request
name: "[TA] Who am I"
description: |-
  Runs as: teaching_assistant (TA_SESSION)

  Reads the TA session and stores its id as TA_USER_ID.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session={{TA_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("session payload shape", () => {
        pm.expect(body).to.include.keys("id", "email", "display_name", "role", "supervisor_ids", "session");
        pm.expect(body.supervisor_ids).to.be.an("array");
        pm.expect(body).to.not.have.property("provisioned_by");
      });
      pm.test("is a teaching assistant", () => pm.expect(body.role).to.eql("teaching_assistant"));
      pm.globals.set("TA_USER_ID", body.id);
    language: text/javascript
order: 3000
