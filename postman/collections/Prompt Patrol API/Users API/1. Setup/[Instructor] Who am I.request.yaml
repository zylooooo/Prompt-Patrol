$kind: http-request
name: "[Instructor] Who am I"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  Reads the instructor session and stores its id as INSTRUCTOR_USER_ID.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("session payload shape (0.21.0)", () => {
        pm.expect(body).to.include.keys("id", "email", "display_name", "role", "supervisor_ids", "session");
        pm.expect(body.supervisor_ids).to.be.an("array");
        pm.expect(body).to.not.have.property("provisioned_by");
      });
      pm.test("is an instructor with no supervisors", () => {
        pm.expect(body.role).to.eql("instructor");
        pm.expect(body.supervisor_ids).to.eql([]);
      });
      pm.globals.set("INSTRUCTOR_USER_ID", body.id);
    language: text/javascript
order: 2000
