$kind: http-request
name: "[Instructor] Remove the TA's last supervisor"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  Ending a TA's last counting link revokes their sessions in the same commit. After this folder you must sign in as the TA again and paste the new cookie into the TA environment.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors/{{INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("unsupervised", () => pm.expect(body.supervisor_ids).to.eql([]));
    language: text/javascript
order: 1000
