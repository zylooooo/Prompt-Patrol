$kind: http-request
name: "[Admin] Deactivating twice is a conflict"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  deactivated -> deactivated is not a valid transition.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}/deactivate"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
