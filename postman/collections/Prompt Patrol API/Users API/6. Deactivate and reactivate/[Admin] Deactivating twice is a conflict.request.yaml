$kind: http-request
name: "[Admin] Deactivating twice is a conflict"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  deactivated -> deactivated is not a valid transition.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}/deactivate"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("409", () => pm.response.to.have.status(409));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("cannot move a deactivated user to deactivated"));
    language: text/javascript
order: 4000
