$kind: http-request
name: "[Admin] Deactivate the second instructor"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Deactivation keeps their links, but a deactivated instructor stops counting as a supervisor.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}/deactivate"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "reason": "Postman: supervision survives deactivation"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("now deactivated", () => pm.expect(body.status).to.eql("deactivated"));
    language: text/javascript
order: 2000
