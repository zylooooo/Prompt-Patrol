$kind: http-request
name: "[Admin] Reactivate the second instructor"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Their links were kept, so the team comes back.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}/reactivate"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "reason": "Postman: restore"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("active again", () => pm.expect(body.status).to.eql("active"));
    language: text/javascript
order: 6000
