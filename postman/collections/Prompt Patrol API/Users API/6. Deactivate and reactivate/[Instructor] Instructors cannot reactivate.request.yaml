$kind: http-request
name: "[Instructor] Instructors cannot reactivate"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  root_admin only since 0.21.0.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}/reactivate"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Insufficient role"));
    language: text/javascript
order: 5000
