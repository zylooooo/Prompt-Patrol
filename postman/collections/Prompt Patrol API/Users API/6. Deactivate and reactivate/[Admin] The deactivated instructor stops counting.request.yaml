$kind: http-request
name: "[Admin] The deactivated instructor stops counting"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  The TA keeps only the active instructor.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: GET
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("only the active instructor counts", () =>
        pm.expect(body.supervisor_ids).to.eql([pm.globals.get("INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 3000
