$kind: http-request
name: "[Admin] The team is restored"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  The TA is supervised by both instructors again.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("both supervisors are back", () => pm.expect(body.supervisor_ids).to.have.members(
        [pm.globals.get("INSTRUCTOR_USER_ID"), pm.globals.get("NEW_INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 7000
