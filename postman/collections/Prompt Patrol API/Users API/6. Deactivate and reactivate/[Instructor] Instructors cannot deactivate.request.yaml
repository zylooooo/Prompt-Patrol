$kind: http-request
name: "[Instructor] Instructors cannot deactivate"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  root_admin only since 0.21.0: one instructor must not lock a shared TA out of every team.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/deactivate"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "reason": "Postman: should be refused"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Insufficient role"));
    language: text/javascript
order: 1000
