$kind: http-request
name: "[Instructor] Instructors cannot deactivate"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  root_admin only since 0.21.0: one instructor must not lock a shared TA out of every team.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/deactivate"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "reason": "Postman: should be refused"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("detail explains why", () => pm.expect(pm.response.json().detail).to.eql("Insufficient role"));
    language: text/javascript
order: 1000
