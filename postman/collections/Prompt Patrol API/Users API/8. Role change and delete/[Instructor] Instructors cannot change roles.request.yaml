$kind: http-request
name: "[Instructor] Instructors cannot change roles"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  root_admin only.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}/role"
method: PATCH
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "role": "teaching_assistant"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Insufficient role"));
    language: text/javascript
order: 5000
