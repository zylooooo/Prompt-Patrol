$kind: http-request
name: "[Admin] root_admin cannot be assigned"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  The request schema only allows instructor or teaching_assistant.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}/role"
method: PATCH
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "role": "root_admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
    language: text/javascript
order: 3000
