$kind: http-request
name: "[Admin] A deleted user cannot be reactivated"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  There is no restore: deleted is terminal.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}/reactivate"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("409", () => pm.response.to.have.status(409));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("cannot move a deleted user to active"));
    language: text/javascript
order: 8000
