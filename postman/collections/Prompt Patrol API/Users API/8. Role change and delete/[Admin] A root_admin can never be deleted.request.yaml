$kind: http-request
name: "[Admin] A root_admin can never be deleted"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Deleting one used to lock the system out.
url: "{{BASE_URL}}/api/users/{{ADMIN_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("You are not authorized to change this user's status."));
    language: text/javascript
order: 9000
