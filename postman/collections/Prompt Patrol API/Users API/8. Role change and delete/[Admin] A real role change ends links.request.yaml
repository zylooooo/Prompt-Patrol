$kind: http-request
name: "[Admin] A real role change ends links"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  TA -> instructor: the supervision link is ended (kept as history).
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}/role"
method: PATCH
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "role": "instructor"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("now an unsupervised instructor", () => {
        pm.expect(body.role).to.eql("instructor");
        pm.expect(body.supervisor_ids).to.eql([]);
      });
    language: text/javascript
order: 2000
