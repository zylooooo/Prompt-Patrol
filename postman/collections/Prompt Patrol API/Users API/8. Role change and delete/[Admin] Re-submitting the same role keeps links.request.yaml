$kind: http-request
name: "[Admin] Re-submitting the same role keeps links"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  No role change, so the newly created TA keeps its link.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}/role"
method: PATCH
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "role": "teaching_assistant"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("still supervised", () => pm.expect(body.supervisor_ids).to.eql([pm.globals.get("INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 1000
