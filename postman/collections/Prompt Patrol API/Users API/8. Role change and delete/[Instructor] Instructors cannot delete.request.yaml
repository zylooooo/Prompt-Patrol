$kind: http-request
name: "[Instructor] Instructors cannot delete"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  Deletion is terminal and root_admin only.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Insufficient role"));
    language: text/javascript
order: 6000
