$kind: http-request
name: "[Admin] Only a TA can be given a supervisor"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  A supervisor_id on an instructor account is refused.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "email": "ashloozhiyi5+pp-refused-{{$timestamp}}@gmail.com",
      "role": "instructor",
      "supervisor_id": "{{INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Only a teaching assistant can be given a supervisor."));
    language: text/javascript
order: 4000
