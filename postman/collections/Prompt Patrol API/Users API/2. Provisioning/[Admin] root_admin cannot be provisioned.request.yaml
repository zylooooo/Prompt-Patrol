$kind: http-request
name: "[Admin] root_admin cannot be provisioned"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  The role is valid in the schema but always refused by the service.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "email": "ashloozhiyi5+pp-refused-{{$timestamp}}@gmail.com",
      "role": "root_admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("detail explains why", () => pm.expect(pm.response.json().detail).to.eql("You are not authorized to create a user with this role."));
    language: text/javascript
order: 7000
