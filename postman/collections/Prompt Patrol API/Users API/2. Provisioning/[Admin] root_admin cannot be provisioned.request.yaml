$kind: http-request
name: "[Admin] root_admin cannot be provisioned"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  The role is valid in the schema but always refused by the service.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "email": "ashloozhiyi5+pp-refused-{{$timestamp}}@gmail.com",
      "role": "root_admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("You are not authorized to create a user with this role."));
    language: text/javascript
order: 7000
