$kind: http-request
name: "[Admin] A supervisor who is not an instructor is refused"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  supervisor_id names a TA. Validation runs before Auth0 is called, so no account and no invite email should appear.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "email": "ashloozhiyi5+pp-refused-{{$timestamp}}@gmail.com",
      "role": "teaching_assistant",
      "supervisor_id": "{{TA_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("That supervisor is not an instructor."));
    language: text/javascript
order: 3000
