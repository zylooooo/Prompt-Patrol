$kind: http-request
name: "[Admin] A live email cannot be provisioned twice"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  Re-uses the email from "Create an instructor".
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "email": "{{NEW_INSTRUCTOR_EMAIL}}",
      "role": "instructor"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("409", () => pm.response.to.have.status(409));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("A user with this email already exists."));
    language: text/javascript
order: 6000
