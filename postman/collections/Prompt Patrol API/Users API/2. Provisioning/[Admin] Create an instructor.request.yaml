$kind: http-request
name: "[Admin] Create an instructor"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  Sends a real Auth0 invite to a +alias address. The new instructor never signs in; later steps use them as a second supervisor, and Cleanup deletes them. Stores NEW_INSTRUCTOR_USER_ID and NEW_INSTRUCTOR_EMAIL.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "email": "ashloozhiyi5+pp-instructor-{{$timestamp}}@gmail.com",
      "role": "instructor"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("a fresh account: active, unnamed, pending, unsupervised", () => {
        pm.expect(body.role).to.eql("instructor");
        pm.expect(body.status).to.eql("active");
        pm.expect(body.display_name).to.eql(null);
        pm.expect(body.first_login_at).to.eql(null);
        pm.expect(body.supervisor_ids).to.eql([]);
      });
      pm.test("provisioned_by records the admin who invited", () => pm.expect(body.provisioned_by).to.eql(pm.globals.get("ADMIN_USER_ID")));
      pm.globals.set("NEW_INSTRUCTOR_USER_ID", body.id);
      pm.globals.set("NEW_INSTRUCTOR_EMAIL", body.email);
    language: text/javascript
order: 1000
