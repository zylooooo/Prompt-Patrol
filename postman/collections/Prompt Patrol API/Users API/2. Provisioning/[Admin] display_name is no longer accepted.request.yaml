$kind: http-request
name: "[Admin] display_name is no longer accepted"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Removed in 0.21.0: people choose their own name. extra=forbid makes the field a loud 400.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "email": "ashloozhiyi5+pp-refused-{{$timestamp}}@gmail.com",
      "role": "instructor",
      "display_name": "Amirah"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
      const body = pm.response.json();
      pm.test("names the forbidden field", () => pm.expect(body.message).to.include("display_name"));
    language: text/javascript
order: 5000
