$kind: http-request
name: "[Instructor] Instructors cannot use POST /api/users"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  root_admin only since 0.21.0. Instructors add TAs through POST /api/users/teaching-assistants (folder 10).
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "email": "ashloozhiyi5+pp-refused-{{$timestamp}}@gmail.com",
      "role": "teaching_assistant"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Insufficient role"));
    language: text/javascript
order: 8000
