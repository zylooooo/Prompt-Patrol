$kind: http-request
name: "[Instructor] No resend to a TA who has already signed in"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  TA_USER_ID has a live session, so first_login_at is set.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/resend-invite"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 11000
