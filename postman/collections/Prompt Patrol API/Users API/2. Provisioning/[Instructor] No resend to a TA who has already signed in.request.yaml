$kind: http-request
name: "[Instructor] No resend to a TA who has already signed in"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  TA_USER_ID has a live session, so first_login_at is set.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/resend-invite"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("409", () => pm.response.to.have.status(409));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Only an active account that has never signed in can be re-invited."));
    language: text/javascript
order: 11000
