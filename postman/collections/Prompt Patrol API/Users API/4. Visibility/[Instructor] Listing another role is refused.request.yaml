$kind: http-request
name: "[Instructor] Listing another role is refused"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  Asking for instructors is outside an instructor's scope.
url: "{{BASE_URL}}/api/users/?role=instructor"
method: GET
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("403", () => pm.response.to.have.status(403));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("You are not authorized to list users with that role."));
    language: text/javascript
order: 3000
