$kind: http-request
name: "[TA] Another TA is hidden"
description: |-
  Environment: Prompt Patrol Dev - TA

  No sibling visibility, even under the same instructor.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("User not found"));
    language: text/javascript
order: 9000
