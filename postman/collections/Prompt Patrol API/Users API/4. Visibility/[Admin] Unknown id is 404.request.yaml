$kind: http-request
name: "[Admin] Unknown id is 404"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  Nonexistent and not-visible look the same.
url: "{{BASE_URL}}/api/users/00000000-0000-0000-0000-000000000000"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("User not found"));
    language: text/javascript
order: 10000
