$kind: http-request
name: "[TA] TAs cannot list users"
description: |-
  Environment: Prompt Patrol Dev - TA

  Refused by the service.
url: "{{BASE_URL}}/api/users/"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 7000
