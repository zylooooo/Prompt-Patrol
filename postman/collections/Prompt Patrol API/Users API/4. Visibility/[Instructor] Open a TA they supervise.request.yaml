$kind: http-request
name: "[Instructor] Open a TA they supervise"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  Same rule as the list.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("supervised by me", () => pm.expect(body.supervisor_ids).to.include(pm.globals.get("INSTRUCTOR_USER_ID")));
    language: text/javascript
order: 4000
