$kind: http-request
name: "[Instructor] Open a TA they supervise"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  Same rule as the list.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: GET
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("supervised by me", () => pm.expect(body.supervisor_ids).to.include(pm.globals.get("INSTRUCTOR_USER_ID")));
    language: text/javascript
order: 4000
