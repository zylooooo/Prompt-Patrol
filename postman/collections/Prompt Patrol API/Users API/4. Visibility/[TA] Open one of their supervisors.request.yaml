$kind: http-request
name: "[TA] Open one of their supervisors"
description: |-
  Runs as: teaching_assistant (TA_SESSION)

  A TA may view their own active supervisors.
url: "{{BASE_URL}}/api/users/{{INSTRUCTOR_USER_ID}}"
method: GET
headers:
  Cookie: __Host-session={{TA_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("is the instructor", () => pm.expect(body.role).to.eql("instructor"));
    language: text/javascript
order: 8000
