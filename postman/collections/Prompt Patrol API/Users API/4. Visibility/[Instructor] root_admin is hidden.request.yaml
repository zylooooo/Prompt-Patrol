$kind: http-request
name: "[Instructor] root_admin is hidden"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  404, not 403.
url: "{{BASE_URL}}/api/users/{{ADMIN_USER_ID}}"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("detail explains why", () => pm.expect(pm.response.json().detail).to.eql("User not found"));
    language: text/javascript
order: 6000
