$kind: http-request
name: "[Admin] The next page continues"
description: |-
  Runs as: root_admin (ADMIN_SESSION)
url: "{{BASE_URL}}/api/users/?limit=1&cursor={{USERS_CURSOR}}"
method: GET
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("a different user", () => pm.expect(pm.response.json().items[0].id).to.not.eql(pm.globals.get("USERS_FIRST_ID")));
    language: text/javascript
order: 12000
