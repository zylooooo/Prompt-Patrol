$kind: http-request
name: "[Instructor] List users"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  An instructor's directory is exactly the TAs they currently supervise.
url: "{{BASE_URL}}/api/users/"
method: GET
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const me = pm.globals.get("INSTRUCTOR_USER_ID");
      pm.test("only active TAs this instructor supervises", () => body.items.forEach(u => {
        pm.expect(u.role).to.eql("teaching_assistant");
        pm.expect(u.status).to.eql("active");
        pm.expect(u.supervisor_ids).to.include(me);
      }));
      pm.test("includes the shared TA and the newly created TA", () =>
        pm.expect(body.items.map(u => u.id)).to.include.members([pm.globals.get("TA_USER_ID"), pm.globals.get("NEW_TA_USER_ID")]));
    language: text/javascript
order: 2000
