$kind: http-request
name: "[Instructor] An instructors email is refused"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  Every refusal (instructor, root_admin, deactivated, deleted) is this same 409; the reason is only logged.
url: "{{BASE_URL}}/api/users/teaching-assistants"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "email": "{{NEW_INSTRUCTOR_EMAIL}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("409", () => pm.response.to.have.status(409));
      pm.test("the one fixed message", () => pm.expect(pm.response.json().message).to.eql("This email can't be added. Contact the root administrator."));
    language: text/javascript
order: 5000
