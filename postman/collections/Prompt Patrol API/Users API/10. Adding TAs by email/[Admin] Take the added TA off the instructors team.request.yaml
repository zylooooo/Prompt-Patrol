$kind: http-request
name: "[Admin] Take the added TA off the instructors team"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  Sets up the link path: the TA stays active with no supervisors.
url: "{{BASE_URL}}/api/users/{{ADDED_TA_USER_ID}}/supervisors/{{INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("no supervisors left", () => pm.expect(pm.response.json().supervisor_ids).to.eql([]));
    language: text/javascript
order: 3000
