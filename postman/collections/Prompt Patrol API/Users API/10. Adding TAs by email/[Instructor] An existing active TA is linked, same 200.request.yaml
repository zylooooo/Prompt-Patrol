$kind: http-request
name: "[Instructor] An existing active TA is linked, same 200"
description: |-
  Environment: Prompt Patrol Dev - Instructor

  Links without an Auth0 call and without touching the account.
url: "{{BASE_URL}}/api/users/teaching-assistants"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "email": "{{ADDED_TA_EMAIL}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Instructor environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Instructor"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("same account, back on my team", () => {
        pm.expect(body.id).to.eql(pm.globals.get("ADDED_TA_USER_ID"));
        pm.expect(body.supervisor_ids).to.eql([pm.globals.get("INSTRUCTOR_USER_ID")]);
      });
    language: text/javascript
order: 4000
