$kind: http-request
name: "[Admin] Restore the TA's supervisor"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Puts the TA back on the instructor's team.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("supervised again", () => pm.expect(body.supervisor_ids).to.eql([pm.globals.get("INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 3000
