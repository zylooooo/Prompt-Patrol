$kind: collection
description: |-
  Ending a TA's last supervision link revokes their sessions (DECISION LOG [0.22.0]).

  Skipped unless RUN_SIGN_OUT_TEST is "true": it revokes TA_SESSION, which
  every later folder needs. Run it on its own, after everything else:

    postman collection run "postman/collections/Prompt Patrol API"       -i "Users API/12. Optional - last supervisor signs the TA out"       -e <your local environment file> --env-var RUN_SIGN_OUT_TEST=true --no-report-events

  Afterwards sign in as the TA again and put the new cookie in TA_SESSION.
scripts:
  - type: http:beforeRequest
    code: |-
      if (pm.variables.get("RUN_SIGN_OUT_TEST") !== "true") pm.execution.skipRequest();
    language: text/javascript
order: 12000
