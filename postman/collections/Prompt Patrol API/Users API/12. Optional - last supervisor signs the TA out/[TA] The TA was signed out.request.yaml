$kind: http-request
name: "[TA] The TA was signed out"
description: |-
  Runs as: teaching_assistant (TA_SESSION)

  The session cookie from before the previous request is revoked.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session={{TA_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("revoked, not expired", () => pm.expect(pm.response.json().error).to.eql("session_revoked"));
    language: text/javascript
order: 2000
