$kind: http-request
name: "[Admin] Only a TA can be supervised"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  The target is an instructor.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Only a teaching assistant can be given a supervisor."));
    language: text/javascript
order: 3000
