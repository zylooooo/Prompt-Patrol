$kind: http-request
name: "[Admin] Only a TA can be supervised"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  The target is an instructor.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Only a teaching assistant can be given a supervisor."));
    language: text/javascript
order: 3000
