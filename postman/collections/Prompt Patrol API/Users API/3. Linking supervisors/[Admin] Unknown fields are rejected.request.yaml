$kind: http-request
name: "[Admin] Unknown fields are rejected"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  extra=forbid: a smuggled field is a 400, never ignored.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{INSTRUCTOR_USER_ID}}",
      "role": "root_admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
    language: text/javascript
order: 6000
