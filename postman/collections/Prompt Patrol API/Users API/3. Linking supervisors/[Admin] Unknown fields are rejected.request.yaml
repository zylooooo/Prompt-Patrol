$kind: http-request
name: "[Admin] Unknown fields are rejected"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  extra=forbid: a smuggled field is a 422, never ignored.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{INSTRUCTOR_USER_ID}}",
      "role": "root_admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("422", () => pm.response.to.have.status(422));
    language: text/javascript
order: 6000
