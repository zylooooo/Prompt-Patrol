$kind: http-request
name: "[Admin] Linking an existing pair is a no-op"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Same request as "Share the TA with a second instructor": no duplicate link, same result.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{NEW_INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("still exactly two supervisors", () => pm.expect(body.supervisor_ids).to.have.lengthOf(2));
    language: text/javascript
order: 2000
