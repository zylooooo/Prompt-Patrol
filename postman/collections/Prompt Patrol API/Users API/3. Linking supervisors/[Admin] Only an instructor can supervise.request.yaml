$kind: http-request
name: "[Admin] Only an instructor can supervise"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  instructor_id names a TA.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{TA_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("detail explains why", () => pm.expect(pm.response.json().detail).to.eql("Only an active instructor can supervise, and only a teaching assistant can be supervised."));
    language: text/javascript
order: 4000
