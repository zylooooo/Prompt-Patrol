$kind: http-request
name: "[Admin] Only an instructor can supervise"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  instructor_id names a TA.
url: "{{BASE_URL}}/api/users/{{NEW_TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{TA_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("That supervisor is not an instructor."));
    language: text/javascript
order: 4000
