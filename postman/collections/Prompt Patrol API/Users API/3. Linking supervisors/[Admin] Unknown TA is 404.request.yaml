$kind: http-request
name: "[Admin] Unknown TA is 404"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  The target id does not exist.
url: "{{BASE_URL}}/api/users/00000000-0000-0000-0000-000000000000/supervisors"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("User not found"));
    language: text/javascript
order: 5000
