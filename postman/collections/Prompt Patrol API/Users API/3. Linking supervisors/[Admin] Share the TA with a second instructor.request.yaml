$kind: http-request
name: "[Admin] Share the TA with a second instructor"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  Additive: the existing supervisor is kept (many-to-many, DECISION LOG [0.21.0]).
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisors"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "instructor_id": "{{NEW_INSTRUCTOR_USER_ID}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("both instructors supervise the TA", () =>
        pm.expect(body.supervisor_ids).to.have.members([pm.globals.get("INSTRUCTOR_USER_ID"), pm.globals.get("NEW_INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 1000
