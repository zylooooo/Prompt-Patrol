$kind: http-request
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/reactivate"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: "pm.test(\"200 and status flips\", () => {\r

      \  pm.response.to.have.status(200);\r

      \  pm.expect(pm.response.json().status).to.eql(\"active\");\r

      });"
    language: text/javascript
order: 8000
