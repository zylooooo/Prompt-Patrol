$kind: collection
description: |-
  Users module walkthrough, contract 0.25.0 (many-to-many TA supervision).
  Runs first: "1. Setup" stores the user ids every other folder uses.

  Each request name says whose session it uses: [Admin] = ADMIN_SESSION,
  [Instructor] = INSTRUCTOR_SESSION, [TA] = TA_SESSION. The instructor must
  be an instructor, and the TA a teaching assistant who has signed in at
  least once. See the collection description for how to set them up.

  Run the folders in numbered order, and the requests in each folder top to
  bottom; each folder builds on the state the previous one left.

  SIDE EFFECTS
  - Real Auth0 invites go to +aliases of ashloozhiyi5@gmail.com: two in
    "2. Provisioning" plus one resend, one in "9. Adding TAs by email".
  - Only accounts the run creates are deactivated, re-roled or deleted;
    "8. Role change and delete" and "11. Cleanup" remove them, leaving the TA
    supervised by the instructor.
  - "10. Display names" renames the TA and then restores the name (a TA with
    no name ends up as "Postman TA").
  - "12. Optional" is skipped unless RUN_SIGN_OUT_TEST is "true"; it signs
    the TA out. See its description.
