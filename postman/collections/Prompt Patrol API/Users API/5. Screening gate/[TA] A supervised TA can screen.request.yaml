$kind: http-request
name: "[TA] A supervised TA can screen"
description: |-
  Environment: Prompt Patrol Dev - TA

  The screening gate reads supervisor_ids: at least one active link to an active instructor.
url: "{{BASE_URL}}/api/checks"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "answer_text": "idk it just kinda works because we set the pointer to null before freeing it"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("attributed to the TA, with a machine verdict", () => {
        pm.expect(body.actor_id).to.eql(pm.globals.get("TA_USER_ID"));
        pm.expect(["ai_generated", "human_written", "uncertain"]).to.include(body.verdict);
      });
    language: text/javascript
order: 1000
