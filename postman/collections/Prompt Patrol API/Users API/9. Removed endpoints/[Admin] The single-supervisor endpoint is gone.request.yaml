$kind: http-request
name: "[Admin] The single-supervisor endpoint is gone"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  POST /api/users/{id}/supervisor was replaced by /supervisors in 0.21.0.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}/supervisor"
method: POST
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "supervisor_id": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("no such route", () => pm.expect(pm.response.code).to.be.oneOf([404, 405]));
    language: text/javascript
order: 1000
