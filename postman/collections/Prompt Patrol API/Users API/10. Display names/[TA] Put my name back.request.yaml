$kind: http-request
name: "[TA] Put my name back"
description: |-
  Runs as: teaching_assistant (TA_SESSION)

  Restores TA_ORIGINAL_NAME.
url: "{{BASE_URL}}/api/users/{{TA_USER_ID}}"
method: PATCH
headers:
  Cookie: __Host-session={{TA_SESSION}}
body:
  type: json
  content: |-
    {
      "display_name": "{{TA_ORIGINAL_NAME}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("restored", () => pm.expect(pm.response.json().display_name).to.eql(pm.globals.get("TA_ORIGINAL_NAME")));
    language: text/javascript
order: 8000
