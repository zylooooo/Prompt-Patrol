$kind: http-request
name: "[TA] Supervised by the instructor after cleanup"
description: |-
  Environment: Prompt Patrol Dev - TA

  The deleted instructor's link is ended; the TA can still screen.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("only the instructor remains", () =>
        pm.expect(body.supervisor_ids).to.eql([pm.globals.get("INSTRUCTOR_USER_ID")]));
    language: text/javascript
order: 2000
