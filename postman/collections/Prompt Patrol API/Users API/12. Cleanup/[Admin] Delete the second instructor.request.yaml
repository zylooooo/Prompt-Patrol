$kind: http-request
name: "[Admin] Delete the second instructor"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  Cleanup. Deleting an instructor ends their links; the TA keeps the Instructor-environment supervisor.
url: "{{BASE_URL}}/api/users/{{NEW_INSTRUCTOR_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "reason": "Postman cleanup"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("deleted", () => pm.expect(body.status).to.eql("deleted"));
    language: text/javascript
order: 1000
