$kind: http-request
name: "[Admin] Delete the TA added by email"
description: |-
  Environment: Prompt Patrol Dev - Root Admin

  Cleanup. Also removes its Auth0 credential.
url: "{{BASE_URL}}/api/users/{{ADDED_TA_USER_ID}}"
method: DELETE
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
body:
  type: json
  content: |-
    {
      "reason": "Postman cleanup"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - Root Admin environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - Root Admin"));
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("deleted", () => pm.expect(pm.response.json().status).to.eql("deleted"));
    language: text/javascript
order: 1500
