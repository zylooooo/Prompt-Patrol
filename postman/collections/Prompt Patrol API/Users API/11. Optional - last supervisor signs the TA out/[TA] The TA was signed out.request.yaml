$kind: http-request
name: "[TA] The TA was signed out"
description: |-
  Environment: Prompt Patrol Dev - TA

  The session cookie from before the previous request is revoked.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session={{SESSION_COOKIE}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("run with the Prompt Patrol Dev - TA environment", () =>
        pm.expect(pm.environment.name).to.eql("Prompt Patrol Dev - TA"));
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("revoked, not expired", () => pm.expect(pm.response.json().detail.code).to.eql("session_revoked"));
    language: text/javascript
order: 2000
