$kind: http-request
name: "[Instructor] Adding a TA already on my team is the same 200"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  No-op, but indistinguishable from a create.
url: "{{BASE_URL}}/api/users/teaching-assistants"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "email": "{{ADDED_TA_EMAIL}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("same account, still one link", () => {
        pm.expect(body.id).to.eql(pm.globals.get("ADDED_TA_USER_ID"));
        pm.expect(body.supervisor_ids).to.eql([pm.globals.get("INSTRUCTOR_USER_ID")]);
      });
    language: text/javascript
order: 2000
