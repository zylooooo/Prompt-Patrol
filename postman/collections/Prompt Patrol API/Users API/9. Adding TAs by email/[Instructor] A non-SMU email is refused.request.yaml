$kind: http-request
name: "[Instructor] A non-SMU email is refused"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  Only SMU addresses can be added (DECISION LOG [0.31.0]). The check runs before the email is looked up, so the 400 is the same whether or not the address has an account (the service tests cover the existing-account case), and nothing is sent to Auth0.
url: "{{BASE_URL}}/api/users/teaching-assistants"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "email": "pp-outsider-{{$timestamp}}@gmail.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400, not the add-TA 409", () => pm.response.to.have.status(400));
      pm.test("invalid_request", () => pm.expect(pm.response.json().error).to.eql("invalid_request"));
      pm.test("message explains the SMU-only rule", () => pm.expect(pm.response.json().message).to.include("Only SMU email addresses can be added."));
    language: text/javascript
order: 5500
