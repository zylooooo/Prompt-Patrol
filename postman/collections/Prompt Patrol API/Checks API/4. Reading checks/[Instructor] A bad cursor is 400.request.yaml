$kind: http-request
name: "[Instructor] A bad cursor is 400"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)
url: "{{BASE_URL}}/api/checks?cursor=not-a-cursor"
method: GET
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("Invalid cursor"));
    language: text/javascript
order: 5000
