$kind: http-request
name: "[Instructor] An answer under 10 characters is rejected"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)
url: "{{BASE_URL}}/api/checks"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "answer_text": "too short"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("answer_text must be at least 10 characters."));
    language: text/javascript
order: 5000
