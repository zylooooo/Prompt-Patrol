$kind: http-request
name: "[Instructor] An answer over 10,000 characters is 413"
description: |-
  Runs as: instructor (INSTRUCTOR_SESSION)

  The body is built in the pre-request script.
url: "{{BASE_URL}}/api/checks"
method: POST
headers:
  Cookie: __Host-session={{INSTRUCTOR_SESSION}}
body:
  type: json
  content: |-
    {
      "answer_text": "{{LONG_ANSWER}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set("LONG_ANSWER", "a".repeat(10001));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("413", () => pm.response.to.have.status(413));
      pm.test("error code", () => pm.expect(pm.response.json().error).to.eql("payload_too_large"));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("answer_text exceeds 10,000 characters."));
    language: text/javascript
order: 6000
