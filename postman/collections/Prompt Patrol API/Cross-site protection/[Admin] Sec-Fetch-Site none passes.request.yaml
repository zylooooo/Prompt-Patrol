$kind: http-request
name: "[Admin] Sec-Fetch-Site none passes"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  What a browser sends for a typed URL; also how non-browser clients opt in.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({ key: "Sec-Fetch-Site", value: "none" });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
      pm.test("got past the middleware", () => pm.expect(pm.response.code).to.not.eql(403));
    language: text/javascript
order: 6000
