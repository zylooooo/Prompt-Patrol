$kind: http-request
name: "[Admin] Our own Origin passes without Sec-Fetch-Site"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  The fallback for browsers that predate Sec-Fetch-Site.
url: "{{BASE_URL}}/api/users/"
method: POST
headers:
  Cookie: __Host-session={{ADMIN_SESSION}}
  Origin: http://localhost:5173
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.remove("Sec-Fetch-Site");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("400 invalid_request", () => { pm.response.to.have.status(400); pm.expect(pm.response.json().error).to.eql("invalid_request"); });
      pm.test("got past the middleware", () => pm.expect(pm.response.code).to.not.eql(403));
    language: text/javascript
order: 4000
