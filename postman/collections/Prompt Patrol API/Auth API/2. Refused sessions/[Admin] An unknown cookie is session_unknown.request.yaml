$kind: http-request
name: "[Admin] An unknown cookie is session_unknown"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  A cookie that matches no session.
url: "{{BASE_URL}}/api/auth/me"
method: GET
headers:
  Cookie: __Host-session=postman-not-a-real-session
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("error code", () => pm.expect(pm.response.json().error).to.eql("session_unknown"));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("The session cookie matches no session."));
    language: text/javascript
order: 2000
