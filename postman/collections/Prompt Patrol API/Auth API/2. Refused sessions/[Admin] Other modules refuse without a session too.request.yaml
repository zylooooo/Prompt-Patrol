$kind: http-request
name: "[Admin] Other modules refuse without a session too"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Every module shares the same session gate.
url: "{{BASE_URL}}/api/checks"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("error code", () => pm.expect(pm.response.json().error).to.eql("not_signed_in"));
    language: text/javascript
order: 3000
