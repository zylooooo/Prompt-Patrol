$kind: http-request
name: "[Admin] No cookie is not_signed_in"
description: |-
  Runs as: root_admin (ADMIN_SESSION)

  Sends no Cookie header.
url: "{{BASE_URL}}/api/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("error code", () => pm.expect(pm.response.json().error).to.eql("not_signed_in"));
      pm.test("message explains why", () => pm.expect(pm.response.json().message).to.eql("No session cookie was sent."));
    language: text/javascript
order: 1000
