name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# main and cd-pipeline can deploy: one group per commit there, so a run whose
# deploy awaits approval never blocks the next push, and nothing cancels a
# deploy mid-migration (the deploy job's own group serializes deploys). Other
# branches share a group and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cd-pipeline') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/cd-pipeline' }}

# Read-only by default; jobs that need more say so.
permissions:
  contents: read

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

  lint-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint API contract
        run: npx --yes @redocly/cli@2.63.0 lint docs/openapi.yaml

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.x"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      # -backend=false keeps this job credential-free; it never touches the state bucket.
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      # Mock provider: offline, no credentials.
      - name: Test
        run: terraform -chdir=infra test

      - name: Test deploy script
        run: bash .github/scripts/deploy_test.sh

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Node version declarations agree
        working-directory: ${{ github.workspace }}
        run: |
          root="$(tr -d '[:space:]' < .nvmrc)"
          engines="$(sed -n 's/.*"node"[[:space:]]*:[[:space:]]*">=\([0-9]*\).*/\1/p' apps/web/package.json)"
          docker="$(sed -n 's/^ARG NODE_VERSION=\([0-9]*\).*/\1/p' apps/web/Dockerfile)"
          types="$(sed -n 's/.*"@types\/node"[[:space:]]*:[[:space:]]*"[^0-9]*\([0-9]*\).*/\1/p' apps/web/package.json)"
          echo ".nvmrc:$root  engines:>=$engines  Dockerfile ARG:$docker  @types/node:^$types"
          fail=0
          for v in "$engines" "$docker" "$types"; do
            { [ -n "$v" ] && [ "$v" = "$root" ]; } || fail=1
          done
          if [ "$fail" != 0 ]; then
            echo "::error::Node version declarations must all derive from .nvmrc ($root)"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Separate from lint-frontend so a failing assertion and a failing lint rule
  # report as different checks, matching the lint-backend/unit-tests split.
  unit-tests-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Full stack in compose, torn down after - there is no staging environment
  # (docs/superpowers/specs/2026-10-01-playwright-smoke-suite-design.md). Runs
  # on main only, where it gates the deploy.
  # TEMPORARY: e2e-test is allowed too, to prove the job on a real runner before
  # merging. Remove that clause before merging into main.
  e2e-frontend:
    runs-on: ubuntu-latest
    needs: [unit-tests-frontend, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/e2e-test')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Builds api/worker/frontend under the compose `image:` tags, which
      # global-setup then starts without --build when CI is set. workdir matters:
      # bake resolves env_file and build contexts against the cwd, not the
      # compose file's directory, and refuses contexts outside the cwd (../api,
      # the worker's repo-root ../..) without the fs.read grant. api/web reuse
      # docker-build's cache scopes; nothing else builds the worker, so it
      # writes its own.
      - name: Build stack images
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        with:
          workdir: apps/e2e
          source: .
          allow: fs.read=../..
          files: docker-compose.yml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            frontend.cache-from=type=gha,scope=web
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,mode=max,scope=worker

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run test:e2e
        env:
          CI: "true"
          # Leave the stack for the log dump below; the last step tears it down.
          E2E_KEEP_STACK: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Dump stack logs
        if: failure()
        working-directory: apps/e2e
        run: docker compose logs --no-color

      - name: Tear down stack
        if: always()
        working-directory: apps/e2e
        run: docker compose down -v

  # The detector is a separate service with its own requirements and its own
  # conftest, so it needs its own job - `pytest` in apps/api never sees it.
  unit-tests-detector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/detector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/detector/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  # Its own job for the same reason as unit-tests-detector: own requirements,
  # own conftest, not picked up by `pytest` in apps/api.
  unit-tests-data-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/data-pipeline/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: dev
      LOG_LEVEL: info
      DB_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
      TEST_DB_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
      AUTH0_DOMAIN: ci-dummy-tenant.auth0.com
      AUTH0_CLIENT_ID: ci-dummy-client
      AUTH0_CLIENT_SECRET: ci-dummy-secret
      AUTH0_REDIRECT_URI: http://localhost:8000/api/auth/callback
      AUTH0_M2M_CLIENT_ID: ci-dummy-m2m-client
      AUTH0_M2M_CLIENT_SECRET: ci-dummy-m2m-secret
      SESSION_SECRET: ci-dummy-session-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs:
      [
        lint-backend,
        lint-frontend,
        unit-tests,
        unit-tests-frontend,
        unit-tests-detector,
      ]
    # TEMPORARY: cd-pipeline publishes too, to test the approved deploy end to
    # end. Remove it here, in `build-web`, in `deploy`, and from the production environment's
    # deployment-branch rule before merging into main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cd-pipeline'
    permissions:
      contents: read
      packages: write
    # The deploy copies these exact images (a GHCR tag can be repointed).
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
      worker-digest: ${{ steps.worker.outputs.digest }}
      detector-digest: ${{ steps.detector.outputs.digest }}
    env:
      # Pushes keep every build in GHCR, tagged with the commit SHA. PRs only build.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cd-pipeline') }}
      IMAGE_PREFIX: ghcr.io/zylooooo/prompt-patrol
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./apps/api
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Repo-root context: the Dockerfile copies from apps/api and apps/worker.
      # Shares e2e-frontend's cache scope.
      - name: Build worker image
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./apps/worker/Dockerfile
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # The served detector is desklib (2026-10-18). When the ML team settles on
      # one model, point `file` at its Dockerfile. Own cache scope: the torch
      # install and baked base-model download dominate build time.
      - name: Build detector image
        id: detector
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./apps/detector
          file: ./apps/detector/Dockerfile.desklib
          tags: ${{ env.IMAGE_PREFIX }}-detector:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=detector-desklib
          cache-to: type=gha,mode=max,scope=detector-desklib

      - name: Read Node version from .nvmrc
        id: node
        run: |
          NODE_VERSION="$(tr -d '[:space:]' < .nvmrc)"
          case "$NODE_VERSION" in
            '' | *[!0-9.]*)
              echo "::error file=.nvmrc::Expected a numeric Node version, got '$NODE_VERSION'"
              exit 1
              ;;
          esac
          echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./apps/web
          tags: prompt-patrol-web:ci
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # The SPA the deploy publishes. Its own job, without AWS credentials: npm ci
  # runs third-party install scripts, which must never share a job with the
  # deploy role. Kept 30 days, the same as the re-run (rollback) window.
  build-web:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cd-pipeline')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web
        run: npm ci && npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Order: approve -> check -> copy -> migrate -> roll out -> record ->
  # publish -> smoke. The SPA comes prebuilt from build-web; nothing in this
  # job runs npm.
  # Nothing reaches AWS until a reviewer approves the production environment.
  # Then: fail if the stack is paused; copy this commit's images GHCR -> ECR
  # by the digest docker-build pushed (AWS runs exactly what CI built); run
  # migrations on the new api revision; roll out api/worker/detector; record
  # the SHA in SSM as soon as the services run it (an un-pause then brings back
  # this image, never the previous one on a migrated schema); publish the SPA
  # to S3 and invalidate CloudFront; smoke-test the SPA and /api through
  # CloudFront.
  # Rollback = re-run the deploy job of an earlier run made after step 7. A
  # re-run across a migration fails by design (DB ahead of the image).
  # The cd-pipeline branch may deploy until the user prunes it. Logic lives in
  # .github/scripts/deploy.sh (tested by lint-infra, which must pass, as must
  # lint-openapi and the data-pipeline tests). On main, e2e must pass.
  deploy:
    runs-on: ubuntu-latest
    needs:
      [
        docker-build,
        build-web,
        e2e-frontend,
        lint-infra,
        lint-openapi,
        unit-tests-data-pipeline,
      ]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.docker-build.result == 'success'
      && needs.build-web.result == 'success'
      && needs.lint-infra.result == 'success'
      && needs.lint-openapi.result == 'success'
      && needs.unit-tests-data-pipeline.result == 'success'
      && (github.ref == 'refs/heads/main' && needs.e2e-frontend.result == 'success'
          || github.ref == 'refs/heads/cd-pipeline')
    environment: production
    # A newer pending deploy replaces an older one; a running one finishes.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: apps/web/dist

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::420974348257:role/prompt-patrol-deploy
          aws-region: ap-southeast-1

      - name: Fail if the stack is paused
        run: bash .github/scripts/deploy.sh check-running

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Copied by the digest docker-build pushed, never the GHCR tag (it can be
      # repointed while the run waits for approval). A re-run reuses the
      # original run's digests. ECR tags are immutable, so an image already
      # copied (a re-run) is skipped.
      - name: Copy images to ECR
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
          DIGEST_api: ${{ needs.docker-build.outputs.api-digest }}
          DIGEST_worker: ${{ needs.docker-build.outputs.worker-digest }}
          DIGEST_detector: ${{ needs.docker-build.outputs.detector-digest }}
        run: |
          for svc in api worker detector; do
            if aws ecr describe-images --repository-name "prompt-patrol/$svc" --image-ids "imageTag=$SHA" >/dev/null 2>&1; then
              echo "prompt-patrol/$svc:$SHA already in ECR, skipping"
              continue
            fi
            digest_var="DIGEST_$svc"
            digest="${!digest_var}"
            if [ -z "$digest" ]; then
              echo "::error::docker-build reported no digest for $svc"
              exit 1
            fi
            docker buildx imagetools create \
              --tag "$ECR/prompt-patrol/$svc:$SHA" \
              "ghcr.io/zylooooo/prompt-patrol-$svc@$digest"
          done

      - name: Migrate and roll out
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy.sh release

      # Right after the rollout: SSM must name the image the services run,
      # even if the SPA publish below fails.
      - name: Record deployed tag
        env:
          SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy.sh record

      - name: Publish web
        run: bash .github/scripts/deploy.sh publish-web apps/web/dist

      # Terraform output frontend_url. Hardcoded: reading it from AWS would
      # need a new SSM parameter or cloudfront:GetDistribution on the role.
      - name: Smoke test through CloudFront
        env:
          FRONTEND_URL: https://d27u3j75sp5oz1.cloudfront.net
        run: bash .github/scripts/deploy.sh smoke apps/web/dist
