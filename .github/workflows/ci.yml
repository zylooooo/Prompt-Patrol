name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: apps/api
    env:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: dev
      LOG_LEVEL: info
      DB_URL: "sqlite+aiosqlite:///:memory:"
      ENTRA_TENANT_ID: ci-dummy-tenant
      ENTRA_CLIENT_ID: ci-dummy-client
      ENTRA_CLIENT_SECRET: ci-dummy-secret
      ENTRA_REDIRECT_URI: http://localhost:8000/api/auth/callback
      SESSION_SECRET: ci-dummy-session-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t prompt-patrol-api:ci ./apps/api

      - name: Build detector image
        run: docker build -t prompt-patrol-detector:ci ./apps/detector

      - name: Build web image
        run: |
          NODE_VERSION="$(tr -d '[:space:]' < apps/web/.nvmrc)"
          case "$NODE_VERSION" in
            '' | *[!0-9.]*)
              echo "::error file=apps/web/.nvmrc::Expected a numeric Node version, got '$NODE_VERSION'"
              exit 1
              ;;
          esac
          echo "Building web image on Node $NODE_VERSION (from apps/web/.nvmrc)"
          docker build --build-arg NODE_VERSION="$NODE_VERSION" -t prompt-patrol-web:ci ./apps/web
