name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Check Node version declarations agree
        working-directory: ${{ github.workspace }}
        run: |
          root="$(tr -d '[:space:]' < .nvmrc)"
          engines="$(sed -n 's/.*"node"[[:space:]]*:[[:space:]]*">=\([0-9]*\).*/\1/p' apps/web/package.json)"
          docker="$(sed -n 's/^ARG NODE_VERSION=\([0-9]*\).*/\1/p' apps/web/Dockerfile)"
          types="$(sed -n 's/.*"@types\/node"[[:space:]]*:[[:space:]]*"[^0-9]*\([0-9]*\).*/\1/p' apps/web/package.json)"
          echo ".nvmrc:$root  engines:>=$engines  Dockerfile ARG:$docker  @types/node:^$types"
          fail=0
          for v in "$engines" "$docker" "$types"; do
            { [ -n "$v" ] && [ "$v" = "$root" ]; } || fail=1
          done
          if [ "$fail" != 0 ]; then
            echo "::error::Node version declarations must all derive from .nvmrc ($root)"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Separate from lint-frontend so a failing assertion and a failing lint rule
  # report as different checks, matching the lint-backend/unit-tests split.
  unit-tests-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # The detector is a separate service with its own requirements and its own
  # conftest, so it needs its own job - `pytest` in apps/api never sees it.
  unit-tests-detector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/detector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/detector/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  # Its own job for the same reason as unit-tests-detector: own requirements,
  # own conftest, not picked up by `pytest` in apps/api.
  unit-tests-data-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/data-pipeline/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: dev
      LOG_LEVEL: info
      DB_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
      TEST_DB_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
      AUTH0_DOMAIN: ci-dummy-tenant.auth0.com
      AUTH0_CLIENT_ID: ci-dummy-client
      AUTH0_CLIENT_SECRET: ci-dummy-secret
      AUTH0_REDIRECT_URI: http://localhost:8000/api/auth/callback
      AUTH0_M2M_CLIENT_ID: ci-dummy-m2m-client
      AUTH0_M2M_CLIENT_SECRET: ci-dummy-m2m-secret
      SESSION_SECRET: ci-dummy-session-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs:
      [
        lint-backend,
        lint-frontend,
        unit-tests,
        unit-tests-frontend,
        unit-tests-detector,
      ]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          tags: prompt-patrol-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Cached separately (own scope) since its layers - the baked-in torch
      # model download - are what actually dominates build time.
      - name: Build detector image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/detector
          tags: prompt-patrol-detector:ci
          cache-from: type=gha,scope=detector
          cache-to: type=gha,mode=max,scope=detector

      - name: Read Node version from .nvmrc
        run: |
          NODE_VERSION="$(tr -d '[:space:]' < .nvmrc)"
          case "$NODE_VERSION" in
            '' | *[!0-9.]*)
              echo "::error file=.nvmrc::Expected a numeric Node version, got '$NODE_VERSION'"
              exit 1
              ;;
          esac
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          tags: prompt-patrol-web:ci
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
