[tool.ruff]
line-length = 120
target-version = "py313"
# `src` matters here: conftest.py puts `app/` on sys.path, so `routes`/`baseline`
# import as top-level names and ruff would otherwise sort them as third-party.
src = ["app"]

[tool.ruff.lint]
# Mirrors apps/api so both services lint under the same rules.
select = ["E4", "E7", "E9", "F", "I", "UP"]
