# Ephemeral stack for the Playwright smoke suite
#
# Standalone rather than an override of apps/docker-compose.yml: the dev file pins
# container_names, a persistent postgres volume and env_file apps/api/.env (gitignored,
# real Auth0 secrets, absent in CI). Undoing all three in an override costs more
# lines than this file and breaks silently when the dev file changes.
#
# Binds the same host ports as the dev stack , so stop the dev stack first.
#
#   docker compose -f apps/e2e/docker-compose.yml up -d --build --wait
name: prompt-patrol-e2e

services:
  localstack:
    image: localstack/localstack:3.8
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - 127.0.0.1:4566:4566
    volumes:
      - ../api/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    networks:
      - prompt-patrol-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # tmpfs, so every run starts from an empty database.
  postgres:
    image: postgres:18-alpine
    env_file:
      - ./.env
    tmpfs:
      - /var/lib/postgresql
    networks:
      - prompt-patrol-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stdlib stub in place of the real model (./detector-stub.py). Same service
  # name, so DETECTOR_URL=http://detector:8001 is unchanged. No curl in this image.
  detector:
    image: python:3.13-slim
    command: ["python", "/stub.py"]
    volumes:
      - ./detector-stub.py:/stub.py:ro
    networks:
      - prompt-patrol-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: prompt-patrol-e2e-api:local
    env_file:
      - ./.env
    networks:
      - prompt-patrol-network
    depends_on:
      postgres:
        condition: service_healthy
      detector:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      # Repo root, not apps/ - the worker Dockerfile's COPYs are repo-root-relative.
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: prompt-patrol-e2e-worker:local
    env_file:
      - ./.env
    networks:
      - prompt-patrol-network
    depends_on:
      postgres:
        condition: service_healthy
      detector:
        condition: service_healthy
      localstack:
        condition: service_healthy

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: prompt-patrol-e2e-frontend:local
    ports:
      - 127.0.0.1:5173:80
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - prompt-patrol-network

networks:
  prompt-patrol-network:
