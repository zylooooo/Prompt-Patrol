services:
  # Provision the PostgreSQL database for local development
  postgres:
    image: postgres:18-alpine
    container_name: prompt-patrol-postgres
    restart: unless-stopped
    env_file:
      - ./api/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - prompt-patrol-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Start FastAPI Application
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: prompt-patrol-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    ports:
      # Loopback only. Nothing needs this on other interfaces - the frontend
      # container reaches the API over the compose network and the Vite dev
      # proxy reaches it via localhost - while DEV_AUTH_ENABLED would
      # otherwise let anyone on the same network sign in as a provisioned
      # user. Drop the 127.0.0.1 prefix only for deliberate LAN testing.
      - 127.0.0.1:8000:8000
    networks:
      - prompt-patrol-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  # Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: prompt-patrol-frontend
    restart: unless-stopped
    ports:
      - 5173:80
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - prompt-patrol-network

networks:
  prompt-patrol-network:

volumes:
  postgres_data:
