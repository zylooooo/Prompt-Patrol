services:
  localstack:
    image: localstack/localstack:3.8
    container_name: prompt-patrol-localstack
    restart: unless-stopped
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - 127.0.0.1:4566:4566
    volumes:
      - ./api/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    networks:
      - prompt-patrol-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Provision the PostgreSQL database for local development
  postgres:
    image: postgres:18-alpine
    container_name: prompt-patrol-postgres
    restart: unless-stopped
    env_file:
      - ./api/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - prompt-patrol-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: prompt-patrol-detector
    restart: unless-stopped
    # No model cache volume any more: the Dockerfile bakes the model into the
    # image, and a volume mounted over that path would shadow it with whatever
    # an older build happened to leave behind.
    networks:
      - prompt-patrol-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Start FastAPI Application
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: prompt-patrol-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    ports:
      # Loopback only. Nothing needs this on other interfaces - the frontend
      # container reaches the API over the compose network and the Vite dev
      # proxy reaches it via localhost. Keep it even though the password-less
      # dev login (the original reason for this line) is gone: the API still
      # terminates sessions over plain HTTP locally, so it should not be
      # exposed to the LAN. Drop the prefix only for deliberate LAN testing.
      - 127.0.0.1:8000:8000
    networks:
      - prompt-patrol-network
    depends_on:
      postgres:
        condition: service_healthy
      detector:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SQS poll loop that calls checks_service.create_check() per batch row -
  # see docs/superpowers/specs/2026-09-09-batches-module-design.md.
  worker:
    build:
      # Repo root, not apps/ - the Dockerfile's COPY instructions are written
      # repo-root-relative (apps/api/..., apps/worker/...) per Decision 6, so
      # the context has to be one level up from this compose file.
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: prompt-patrol-worker
    restart: unless-stopped
    env_file:
      - ./api/.env
    networks:
      - prompt-patrol-network
    depends_on:
      postgres:
        condition: service_healthy
      detector:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: prompt-patrol-frontend
    restart: unless-stopped
    ports:
      - 5173:80
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - prompt-patrol-network

networks:
  prompt-patrol-network:

volumes:
  postgres_data:
