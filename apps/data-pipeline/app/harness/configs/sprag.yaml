# Harness config for sprag, API keys live in .env. The three dataset
# configs differ only in questions_file and dataset
questions_file: data/cleaned/sprag_cleaned.parquet
dataset: sprag        # id namespace
samples_per_question:
  correct: 1
  weak: 1
  partial: 1
  wrong: 1
  # rewrite: N polishes N student answers per question per generator,
  # a different one each call while the question has enough
decoding:
  temperature: 0.8
  max_tokens: 400
generators:
  - name: claude-sonnet-5
    provider: anthropic
    model: claude-sonnet-5
  - name: gpt-5.5
    provider: openai
    model: gpt-5.5-2026-04-23
  - name: gemini-3-5
    provider: google
    model: gemini-3.5-flash
  - name: deepseek-v4-pro
    provider: deepseek
    model: deepseek-v4-pro
    # thinking is on by default and can spend the whole answer budget
    extra_body:
      thinking: {type: disabled}
  # local generators via Ollama
  - name: llama3.1-8b
    provider: ollama
    model: llama3.1:8b
  - name: qwen3-8b
    provider: ollama
    model: qwen3:8b
    extra_body:
      reasoning_effort: "none"  # the string none maps to think=false on the OpenAI endpoint
