# Splicer config, pairs the human corpus with harness output
human_corpus: data/cleaned/mohler_cleaned.parquet
dataset: mohler        # id namespace, run once per dataset
ai_answers: data/generated/pilot/answers.jsonl
out_dir: data/spliced
seed: 480
target_fractions: [0.25, 0.5, 0.75]
docs_per_fraction: 100
min_sentences: 2
