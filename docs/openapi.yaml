info:
  title: Prompt Patrol API
  version: 0.25.0
  description: |
    Instructor-facing decision-support API for flagging potentially AI-generated
    short answers in software engineering courses.

    ## Authentication model

    Prompt Patrol is an **OpenID Connect Relying Party**, not an OAuth client.
    It has no third-party resource server and requests no delegated authority.
    Auth0 answers exactly one question, once per login: *who is this
    person?*

    Consequence: **no access token, no refresh token, and no JWT is stored
    anywhere.** The ID token is validated, its claims extracted, and the token
    discarded. See IETF `draft-ietf-oauth-browser-based-apps` §7.1
    ("Single-Domain Browser-Based Applications").

    Session state is server-side. The browser holds an opaque 256-bit random
    identifier in a cookie; that value is a database lookup key, meaningless
    outside this system.

    The Auth0 application is configured with **exactly one connection
    enabled: a Database (email/password) connection**, with **Disable Sign
    Ups** turned on. There is no self-service account-creation surface at
    all — Auth0's hosted login page accepts only credentials that already
    exist, and credentials are created for an instructor only after their
    `users` row is provisioned (see "Provisioning" below), never by the
    instructor themselves. Disable Sign Ups is Auth0's own documented pattern
    for an invite-only Database connection, but Auth0's docs also note it is
    not sufficient hardening on its own (it narrows but does not close an
    enumeration surface) — so **Attack Protection** (Bot Detection,
    Suspicious IP Throttling, Brute-force Protection) is enabled tenant-wide
    as a second layer. This replaces the tenant-scoping guarantee the
    previous Entra ID integration provided a different way (Entra: restrict
    the authority to the university's own tenant so no arbitrary Microsoft
    account could complete the flow; Auth0: restrict the application's
    enabled connections and close self-registration instead — same property,
    enforced at a different layer). See "Provisioning" below.

    ## Authentication vs authorization — module boundary

    Separate concerns, separate modules. The split is by **granularity**,
    not preference: the dividing question is whether a decision needs data
    beyond the session itself.

    | Decision                            | Depends on      | Layer                     | Owns  | Failure |
    |-------------------------------------|-----------------|---------------------------|-------|---------|
    | Is there a valid session?           | credential only | App (`Depends()`), every request | auth  | `401`   |
    | May this user call this function?   | user attributes | Service                   | users | `403`   |
    | May this user act on *this record*? | domain data     | Service                   | users | `403`   |

    Authentication resolves **identity only**: a live session and the user
    it belongs to, with no opinion on what that user may do. It runs in the
    app on every protected request, whatever sits in front of it — there is
    no gateway today, and the app trusts no identity a proxy or gateway
    passes along (see `x-gateway-configuration` and DECISION LOG [0.25.0]).

    An unauthenticated request to a protected route gets a `401` before any
    route code runs. *Authenticated-yet-unauthorized* traffic receives a
    `403` from the users module — "forbidden" is an application-domain
    judgement. See DECISION LOG [0.3.0] for the full rationale.

    ### In-app identity resolution: dependency injection, not middleware

    Inside the FastAPI app, identity resolution (`get_current_session` ->
    `get_current_user` -> `require_role` / `require_screening_access`) is a
    **`Depends()` chain**, not ASGI middleware. `get_current_session` reads
    the `__Host-session` cookie, hashes it, and checks the session row
    (revoked, idle, absolute cap) and the user's `status` — one query on
    the same request-scoped `AsyncSession` as the route handler, cached
    per-request by FastAPI. A missing or failed session is a `401` whose
    `error` names the reason (`not_signed_in`, `session_unknown`, …). The
    users router applies `require_role` at the router level
    (`APIRouter(dependencies=[...])`) so a new users route is protected by
    default; the checks, detector and batches routes declare theirs per
    endpoint. `/api/auth/login`, `/api/auth/callback`, `/api/auth/logout`
    and `/health` are the only routes without one. See DECISION LOG
    [0.5.3].

    ### Session lifetime
    | Rule              | Value  | Behaviour                                |
    |-------------------|--------|------------------------------------------|
    | Sliding idle      | 30 min | `last_active_at` bumped by an authenticated request, at most once a minute; not by `GET /api/auth/me?probe=1` |
    | Absolute cap      | 4 h    | Set at creation, **never extended**      |

    A session dies when either clock fires. The absolute cap bounds the window
    during which a disabled upstream account retains access — this
    integration has no push-based revocation configured (no OIDC back-channel
    logout). Inside that window, a `root_admin` ends someone's access by
    deactivating or deleting the account or changing its role, each of which
    revokes that user's live sessions in the same commit; the session check
    also refuses any account that is no longer `active`. Signing out
    (`POST /api/auth/logout`) ends every session the user holds, not just the
    calling browser's.

    ### CSRF

    Every state-changing request (`POST`, `PUT`, `PATCH`, `DELETE`) must
    prove it came from this application's own origin. App middleware checks,
    before any route runs:

    1. If `Sec-Fetch-Site` is present, it must be `same-origin` or `none`
       (a user-initiated navigation). `same-site` is **refused**:
       `SameSite` cookies treat every `*.smu.edu.sg` host as the same site,
       so a takeover of any university subdomain could otherwise forge
       requests that carry the session cookie.
    2. If it is absent, `Origin` must exactly equal the SPA's origin
       (`FRONTEND_URL`).
    3. If neither header is present, the request is refused — fail closed.

    A refusal is `403 forbidden` with the message "Cross-site request
    refused." `GET`, `HEAD` and `OPTIONS` are not checked, so **a `GET`
    must never change state.** The one state-changing `GET`,
    `/api/auth/callback`, is protected by the OIDC `state` and PKCE
    verifier instead.

    Non-browser clients (Postman, scripts) send `Sec-Fetch-Site:
    same-origin`. That is harmless: they cannot carry a victim's cookie,
    which is the whole of what CSRF abuses. `SameSite=Strict` and the
    `__Host-` cookie prefix remain as defence in depth. See DECISION LOG
    [0.25.0].

    ## Errors

    Every non-2xx response produced by application code is an `Error`.
    Branch on `error`, display `message`, quote `request_id` in bug reports.
    All input-validation failures are `400 invalid_request` — this API never
    returns `422`. See DECISION LOG [0.23.0].

    ## Provisioning — invite-first

    **There is no default role and no self-service registration.** A user
    record exists because someone with authority created it. Authentication
    against Auth0 is necessary but not sufficient for access.

    Delegation chain:

    ```
    root_admin  (seeded with the `scripts.provision_user` CLI, keyed on Auth0 `sub`)
        └── provisions ──> instructor
                              └── provisions ──> teaching_assistant
    ```

    `users.provisioned_by` records who granted each account access. For a tool
    that produces integrity accusations, "who authorised this person" is a
    question worth being able to answer.

    Records are created **before** first login, keyed on email. Provisioning
    also creates the Auth0 credential and stores its id (Auth0's `sub`) in
    `users.auth0_sub` in the same step, so the row is bound to exactly one
    Auth0 identity before anyone signs in. Login matches on `auth0_sub`, and
    the email in the ID token is never used to admit anyone.

    ## Detection — service boundary

    **This API is not the detector's API.** The backend owns persistence,
    instructor identity, authorization, and calibration policy. The
    detector service owns exactly one thing: text in, normalised score out.

    ```
    SPA ──> POST /api/checks ──> backend ──> detector service
                                    │           (stateless, no DB,
                                    │            no user identity,
                                    │            no threshold policy)
                                    └──> checks table   (result, unconditional;
                                                         answer_text optional)
    ```

    There is no separate audit table. Checks rows are immutable and never
    soft-deleted — `actor_id`, `model_version`, `verdict`, and `created_at`
    are written unconditionally on every row and survive even when
    `retain_answer` is false. See DECISION LOG [0.11.0].

    The detector never sees a `user_id`, never writes to Postgres, and never
    decides a verdict — it returns a score. Thresholding, abstention, and
    labelling are backend policy, because they depend on calibration artefacts
    and on the instructor's strictness setting, neither of which is a model
    concern.

    ### The score contract

    Every detector adapter — fine-tuned RoBERTa/DeBERTa, RADAR, Fast-DetectGPT,
    Binoculars — MUST emit `raw_score` normalised to `[0, 1]`, **monotonically
    increasing in AI-likelihood**.

    This is a hard requirement, not a convention. Zero-shot detectors do not
    natively produce probabilities: Binoculars emits a cross-perplexity ratio
    where *lower* means more AI-like. Without normalisation at the adapter
    boundary, swapping the served detector silently inverts the frontend.

    `raw_score` is **not a probability** and MUST NOT be rendered as a
    percentage. `0.87` displayed as "87% likely AI-generated" is precisely the
    wrongful-accusation failure mode this project exists to avoid. The
    display-safe fields are `verdict` and the nullable calibrated `confidence`.

    ### Strictness, not thresholds

    The client sends a named strictness level. The server maps it to a
    threshold calibrated for the *currently served model* at a target false
    positive rate on the Mohler validation split.

    | `strictness` | Target FPR | Instructor-facing meaning              |
    |--------------|-----------|-----------------------------------------|
    | `lenient`    | 5%        | Flag more, accept more false alarms     |
    | `standard`   | 1%        | Default                                 |
    | `strict`     | 0.1%      | Flag only high-confidence cases         |

    Target FPRs are provisional pending E2/E3 calibration results — the enum
    is stable, the numbers behind it are not.

    A raw threshold from the client would defeat this entirely: score scales
    are model-specific, so a stored `0.5` means something different after every
    model swap, and the fixed-FPR guarantee reported in the evaluation report
    would no longer describe what the deployed application does.

    ### Third-party detectors are evaluation-only

    GPTZero is a commercial API baseline for the comparative study. It MUST NOT
    appear in the serving path. Calling it at request time would transmit
    student answers to an overseas third-party processor on every check — a
    PDPA exposure with no compensating benefit, since it is a benchmark
    reference and not a deployment candidate.

