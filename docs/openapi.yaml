#          failure mode to report. Detector reachability is already
#          GET /api/detector/status's job, and that endpoint is deliberately
#          always 200. See DECISION LOG [0.5.9].
#   0.5.8  CheckSummary (the GET /api/checks list row) widened: added
#          raw_score, strictness_applied (flattened out of detector, same as
