# =============================================================================
# Prompt Patrol — API Contract
# =============================================================================
# STATUS: v0.25.0 — DRAFT. Auth + users + checks + batches modules.
#
# This is a living document. Modules are added incrementally:
#   [x] auth      — authentication & session lifecycle
#   [x] users     — provisioning, roles, RBAC primitives
#   [x] checks    — single-answer detection + history   (this draft)
#   [x] batches   — async batch submission + polling
#   [~] history   — FOLDED INTO checks. See DECISION LOG [0.5.0].
#
# There is no standalone `audit` module and none is planned. See DECISION LOG
# [0.11.0] — checks rows are already self-auditing, and per-domain event
# tables (`UserStatusEvent`, `UserRoleEvent`) cover identity lifecycle
# history. A generic audit log would be a second, redundant store.
#
# CHANGELOG
#   0.25.0 BREAKING (CSRF) — every POST/PUT/PATCH/DELETE must come from this
#          application's own origin: `Sec-Fetch-Site: same-origin` (or
#          `none`), else an `Origin` equal to the SPA's; anything else is
#          `403 forbidden`. Replaces the `X-PP-Client` header scheme, which
#          was never enforced. Non-browser clients send
#          `Sec-Fetch-Site: same-origin`. The rest is the auth, detector and
#          batches sections catching up with the code: the app checks the
#          session cookie itself on every request and never trusts a
#          gateway header (`x-gateway-configuration` is now marked as a
#          target design); GET /api/auth/session is replaced by the
#          GET /api/auth/me the SPA actually calls, with its `probe`
#          parameter; the cookie is `__Host-session`; /api/auth/login's
#          `login_hint` and `force_account_chooser` are documented;
#          GET /api/detector/status is defined; /api/admin/sessions is
#          removed (never built); `auth0_sub` is set at provisioning; the
#          served abstention rule is documented as provisional; batch
#          cancel purges queued messages; `row_total` counts rejected rows;
#          the CSV row rules are listed; the stale data-model block is
#          replaced by a pointer to the models. See DECISION LOG [0.25.0].
#   0.24.0 Three sections brought in line with the code, which is right in
#          each case. GET /api/users: an instructor asking for a `role`
#          outside their scope gets `403`, not an empty page, and a bad
#          `cursor` is `400`. POST /api/batches: a file whose every row
#          fails validation is still `202` with one `batch_row_failures` row
#          per row; `no_valid_rows` is removed from `Error.error`, since no
#          route returned it. /api/auth/callback: every outcome is a `303`
#          redirect (`/login?error=<code>` on failure), never a `403`/`502`
#          body, and an unreachable Auth0 now redirects too instead of
#          failing `500`; `returnTo` is removed from /api/auth/login, which never
#          implemented it. See DECISION LOG [0.24.0].
#   0.23.0 Every error response is now the `Error` schema, from every route.
#          Previously only POST /api/checks returned it; other routes returned
#          FastAPI's `{"detail": ...}`, and 401s `{"detail": {code, message}}`.
#          Request-validation failures (unknown field, wrong type, missing
#          field, out-of-range query parameter) are `400 invalid_request`, not
#          FastAPI's default `422`, so all input errors share one status.
#          `Error.error` gains the session failure codes the 401 path already
#          emitted, and drops codes no response body ever carried. See
#          DECISION LOG [0.23.0].
#   0.22.0 A teaching assistant left with no active supervisor is signed
#          out: deleting, deactivating or changing the role of their last
#          active instructor now revokes the TA's live sessions in the same
#          commit, as ending their last link already did. No wire-format
#          change. See DECISION LOG [0.22.0].
#   0.21.0 BREAKING — teaching-assistant supervision is many-to-many. A new
#          `supervisions` table replaces `provisioned_by` as the supervision
#          edge; `provisioned_by` is now provenance only (who invited) and
#          grants nothing. `User` gains `supervisor_ids`. Added
#          `POST /api/users/teaching-assistants` (instructor add-by-email:
#          creates or links, one generalised response), `POST` and `DELETE
#          /api/users/{id}/supervisors[/{instructor_id}]`, and
#          `PATCH /api/users/{id}` (display name). REMOVED
#          `POST /api/users/{id}/supervisor` and `SupervisorChangeRequest`.
#          `POST /api/users` is now `root_admin` only and takes `{email,
#          role, supervisor_id?}` — `display_name` is removed (people choose
#          their own after first sign-in); `supervisor_id` now creates a
#          `supervisions` link in the same commit as the account.
#          `/deactivate` and `/reactivate` are now `root_admin` only.
#          See DECISION LOG [0.21.0].
#   0.20.0 `StatusChangeRequest.reason` is now normalised server-side
#          (trimmed, control characters and `<`/`>` removed, blank -> null).
#          Clarification, no behaviour change: a pending account (`status =
#          active`, `first_login_at` null) may be deactivated by whoever may
#          manage it (`instructor` for their own TAs, `root_admin` for
#          anyone) and deleted by `root_admin`. No field or endpoint added
#          or removed. See DECISION LOG [0.20.0].
#   0.19.0 `User` gains nullable `first_login_at` (null until the person's
#          first successful sign-in, i.e. "invite pending"), and
#          `POST /api/users/{id}/resend-invite` re-sends the Auth0
#          password-set email for an account that has never signed in.
#          Purely additive: no field or endpoint removed. See DECISION LOG
#          [0.19.0].
#   0.18.0 Users module catch-up: the contract described a `deleted_at`
#          soft-delete and `POST /api/users/{id}/restore`; the shipped API
#          uses a three-state `status` (`active` / `deactivated` /
#          `deleted`). `User` drops `deleted_at` and `first_login_at` and
#          gains `status`; `GET /api/users` swaps `include_deleted` for a
#          repeatable `status` filter (default `active`); added
#          `POST /api/users/{id}/deactivate` and `.../reactivate`; removed
#          `/restore`; `DELETE` is root_admin-only, returns `200 User`, and
#          `409`s on an already-deleted target instead of `204`; login
#          rejection gains a distinct `deleted` code. No behaviour change:
#          this brings the document in line with the code. See DECISION LOG
#          [0.18.0].
#   0.17.0 POST /api/users now replaces an Auth0 Database credential that
#          already exists for the email (deleting it, then inviting afresh)
#          instead of failing `502`. No wire-format change. See DECISION LOG
#          [0.17.0].
#   0.16.0 BatchProgress gains `failures` (array of BatchRowFailure) — the
#          schema was defined in [0.13.0] but never referenced by any
#          endpoint, so instructors only ever saw a `failed` count with no
#          way to see why a row failed. No field removed; existing
#          `failed`/`pending` semantics unchanged. See DECISION LOG [0.16.0].
#   0.15.0 POST /api/batches/{id}/cancel now actively drains the cancelled
#          batch's own messages out of SQS (best-effort, bounded), leaving
#          every other batch's queued messages untouched, instead of
#          relying solely on the Worker reaching them one at a time. No
#          wire-format change — same request/response shape as [0.14.0].
#          See DECISION LOG [0.15.0].
#   0.14.0 Added POST /api/batches/{id}/cancel. `Batch` gains `cancelled_at`
#          (nullable); `BatchProgress` gains `cancelled` (derived, not
#          stored twice). The Worker checks `cancelled_at` per-message and
#          records a `batch_row_failures` row instead of scoring once it's
#          set, rather than trying to purge messages already sitting in
#          SQS. See DECISION LOG [0.14.0].
#   0.13.0 Implemented the `batches` module: POST /api/batches/upload-url,
#          POST /api/batches, GET /api/batches/{id}. `batch_id`/
#          `batch_file_name` removed from CheckCreateRequest — they were
#          implemented (undocumented) as client-settable fields for the old
#          client-orchestrated fan-out, which this module replaces. Only the
#          Worker may set a Check's batch_id now, consistent with actor_id
#          never being client-supplied. See DECISION LOG [0.13.0].
#   0.12.0 PATCH /api/users/{id}/role is now implemented: `user_role_events`
#          table (alembic 0009), `change_user_role` service function,
#          `UserRolePatchRequest` schema. Closes the gap [0.11.0] identified.
#          No wire-format change. See DECISION LOG [0.12.0].
#   0.11.0 Dropped the `audit` module from the TODO list and removed the
#          "audit table" / "audit entry" references in the checks module
#          (info.description's service-boundary diagram, the `checks` tag
#          description, `POST /api/checks`, and `CheckCreateRequest.
#          retain_answer`) — none of them described a real, separately
#          written store; checks rows already carry every field the text
#          claimed the audit entry recorded. See DECISION LOG [0.11.0].
#   0.10.0 Invite email copy fixed via an Auth0 app_metadata flag + Liquid
#          branch on the Change Password template, instead of a second
#          endpoint. No wire-format change. See DECISION LOG [0.10.0].
#   0.9.0  BREAKING. POST /api/users no longer returns `activation_url` -
#          `UserProvisionResponse` is retired and the endpoint returns a
#          plain `User`. Auth0 now emails the invitee their own
#          password-set link directly instead of handing one back for the
#          admin to relay by hand. See DECISION LOG [0.9.0].
#   0.8.0  BREAKING. POST /api/users now also creates the invitee's Auth0
#          credential and returns a one-time activation link
#          (`UserProvisionResponse.activation_url`, new `502` response).
#          [0.7.0]'s Database connection + Disable Sign Ups closed
#          self-service signup, which also silently closed the only path
#          that used to create an Auth0 identity: the invitee's own first
#          login (auto-created by whichever social IdP they already had an
#          account with). A `users` row alone is no longer enough to get
#          someone in - discovered when a real provisioned user could not
#          sign in despite a correct `users` row. `scripts.provision_user`
#          gets the same fix, printing the activation link to stdout
#          instead of returning it in a response body. See DECISION LOG
#          [0.8.0].
#   0.7.0  BREAKING. Auth0 connection swapped from the Microsoft social
#          connection to a Database (email/password) connection. The social
#          connection kept reproducing the exact bug class this app cannot
#          afford mid-capstone: a second IdP hop (Auth0 -> Microsoft) with
#          its own redirect-chain/CSP interactions and account-type
#          inconsistency (personal vs. work Microsoft accounts behaving
#          differently). A Database connection removes that hop entirely —
#          Auth0's own hosted login page, no federation. Invite-first
#          provisioning is unchanged: `users` row must exist before a login
#          can bind, same as before. Self-service signup is closed at the
#          connection level (**Disable Sign Ups**, Auth0's documented
#          invite-only pattern for Database connections) plus Attack
#          Protection (Bot Detection, Suspicious IP Throttling, Brute-force
#          Protection) enabled tenant-wide, per Auth0's own guidance that
#          Disable Sign Ups alone is not sufficient hardening. No backend
#          code changes — the app already speaks to Auth0 generically
#          (`server_metadata_url` discovery, no Microsoft-specific claims
#          handling). See DECISION LOG [0.7.0].
#   0.6.0  BREAKING. Identity provider swapped from Microsoft Entra ID to
#          Auth0 (Microsoft social connection). The sponsor could not get the
#          app whitelisted (app registration + admin consent) in the
#          university's own Entra tenant — registering against Auth0's tenant
#          instead removes that dependency on university IT while instructors
#          keep signing in with the same Microsoft account. Nothing else in
#          the auth architecture changes: still an OIDC Relying Party, still
#          no access/refresh token stored, still the BFF pattern, still the
#          opaque `__Host-` session cookie, still invite-first provisioning
#          keyed on email before first login. `users.entra_oid` renamed to
#          `users.auth0_sub` (root_admin now seeded on Auth0's `sub` claim,
#          not Entra's `oid`/`tid`). The Entra-specific `logout_hint`
#          claim-replay mechanism is dropped — Auth0's logout endpoint
#          (`/v2/logout?client_id=...&returnTo=...`) takes no per-user hint,
#          unlike Entra's `end_session_endpoint`. See DECISION LOG [0.6.0].
#   0.5.9  Removed the 503 response from GET /api/detector. It answers with
#          static server-declared config (requires_question_text, length
