#          answer_preview truncation back to full answer_text. All of these
#          exist so the SPA's history table doesn't regress on reload
#          relative to what it shows right after a submission. See DECISION
#          LOG [0.5.8].
#   0.5.7  POST /api/checks refuses a teaching_assistant with no supervisor
#          (`403`). The refusal existed only in the SPA, which decides it from
