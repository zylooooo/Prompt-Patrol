# -----------------------------------------------------------------------------
# Gateway configuration (non-OpenAPI; documents Terraform intent)
# -----------------------------------------------------------------------------
x-gateway-configuration:
  status: |
    TARGET DESIGN, NOT DEPLOYED. There is no API Gateway in front of the app
    today: nginx (local and e2e) serves the SPA and proxies `/api/*` to it
    on the same origin. Nothing below is relied on by the running code —
    every guarantee the app needs (a valid session, CSRF), it enforces
    itself. If a gateway is added, it is an outer filter on top of those
    checks, never a replacement for them. See DECISION LOG [0.25.0].
  authorizer:
    type: REQUEST
    identity_sources:
      - $request.header.Cookie
    result_ttl_seconds:
      0 # MUST be 0. Caching reintroduces a revocation
      # window and defeats the server-side session store.
    responsibilities:
      - Parse the `__Host-session` cookie.
      - Look up the session row; reject if absent, revoked, past absolute
        expiry, or idle beyond 30 minutes.
      - Return an IAM policy. No identity is forwarded to the app (see
        `context_propagation`).
    explicitly_out_of_scope:
      - Role resolution
      - Permission evaluation
      - Profile hydration
      - Any route-to-role mapping
      - CSRF (enforced in the app; see "CSRF" in `info.description`)
  context_propagation:
    note: |
      The app trusts no identity passed along by a gateway or proxy. Every
      protected route resolves the caller from the `__Host-session` cookie
      through the `Depends()` chain (`get_current_session` ->
      `get_current_user` -> `require_role`), with or without a gateway in
      front. An `X-PP-User-Id` header is ignored.

      Trusting a gateway-set `X-PP-User-Id` was the [0.5.3] plan. It shipped
      as a full authentication bypass: whenever `ENVIRONMENT` was not `dev`,
      the header alone was accepted as proof of identity, with no cookie and
      no session lookup, and nginx forwarded it from the client untouched —
      so any user's id was a login as that user. It was removed;
      `test_identity_header_alone_does_not_authenticate` pins that. The
      "it saves a query" argument does not survive: the header is only as
      trustworthy as every hop in front of the app, and the session query is
      one indexed lookup. See DECISION LOG [0.25.0].
  network:
    note: |
      If a gateway is added, the ECS task security group should accept
      ingress only from the API Gateway VPC Link. This is hardening, not the
      authentication boundary — the app checks the session itself either
      way.

tags:
  - name: auth
    description: |
      Authentication and session lifecycle. **This module does not handle
      authorization.** It establishes *who* a caller is; the users module
      decides what they may do, and whether they may be here at all.

      `/auth/login` and `/auth/callback` are **browser redirect endpoints, not
      JSON APIs**. The SPA must reach them via `window.location.href = ...`,
      never `fetch()`. A `fetch()` against an opaque 302 will fail.
  - name: users
    description: |
      Provisioning, profile, and roles. **Owns authorization** for the whole
      system — auth resolves identity and asks this module "does this person
      get in, and as what." See the module boundary table in
      `info.description` and DECISION LOG [0.3.0].

      No self-service registration. Every row exists because someone with
      delegation authority created it (`provisioned_by`). See the
      delegation table on `POST /api/users`.
  - name: checks
    description: |
      Single-answer detection and check history. The instructor-facing core of
      the application (E4).

      Owns the *decision*, not the *score* — see "Detection — service boundary"
      in `info.description`. The detector service is called synchronously and
      returns a normalised score; thresholding, abstention, verdict
      assignment, and persistence all happen here.

      `CheckResult` is shared with the batches module: a batch result row and a
      single check are the same object, so the SPA has one renderer.
  - name: batches
    description: |
      Async batch submission and progress polling for CSV uploads of short
      answers. Two-step create: `POST /api/batches/upload-url` returns a
      presigned S3 URL, the SPA PUTs the raw file directly to S3, then
      `POST /api/batches` submits the already-uploaded object for server-side
      parsing/validation and enqueues one job per valid row.

      `checks` rows produced by a batch are ordinary `Check` rows — write-once,
      never pending. All in-flight lifecycle state (row counts, per-row
      failures) lives on `Batch`/`BatchRowFailure`, not on `checks`. See
      DECISION LOG [0.13.0].

# =============================================================================
# PATHS
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  /api/auth/login:
    get:
      tags: [auth]
      operationId: initiateLogin
      summary: Begin the OIDC Authorization Code flow
      x-auth-enforcement: NONE # API Gateway: authorizationType = NONE
      x-browser-navigation-only: true
      description: |
        Generates `state`, `nonce`, and a PKCE `code_verifier`, keeps them in
        a signed, short-lived `ppauthflow` cookie (10 minutes, `SameSite=Lax`
        so it survives the redirect back from Auth0), and redirects the
        browser to Auth0's `/authorize` endpoint, which serves Auth0's own
        hosted login page (the Database connection is the only connection
        enabled on this Auth0 application — no federation hop to a third
        party).

        **Frontend contract:** `window.location.href = '/api/auth/login'`.
        Do not call this with `fetch()` or Axios.

        Scopes requested: `openid profile email`. Deliberately **not**
        `offline_access` — no refresh token is wanted or stored.

        There is no `returnTo` deep-link parameter: login always lands on
        `/`. If one is added, it must be validated server-side as a
        site-relative path (one leading `/`, not `//`, no scheme) — unchecked,
        it is an open redirect on an authentication endpoint. See DECISION LOG
        [0.24.0].
      parameters:
        - name: login_hint
          in: query
          required: false
          schema: { type: string }
          description: |
            Pre-fills the email on Auth0's login page. The SPA sends the
            address typed into its own login form (itself pre-filled with
            the last address that signed in on this browser). Forwarded to Auth0 as
            `login_hint`; never used to decide anything here.
        - name: force_account_chooser
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Sends `prompt=login` to Auth0, so Auth0 asks for the password
            again instead of silently reusing its own session. The SPA sets
            it on the first login after our own sign-out, so a second person
            on the same browser is not signed in as the first. `login_hint`
            is still forwarded alongside it.
      responses:
        "302":
          description: Redirect to the Auth0 authorization endpoint.
          headers:
            Location:
              schema:
                type: string
                format: uri
                example: https://ci-dummy-tenant.auth0.com/authorize?client_id=abc123&response_type=code&code_challenge=xyz
        "400":
          $ref: "#/components/responses/BadRequest"

  # ---------------------------------------------------------------------------
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: handleCallback
      summary: OIDC redirect URI — called by Auth0, not by the SPA
      x-auth-enforcement: NONE
      x-called-by: Auth0 (browser redirect)
      description: |
        Registered in the Auth0 application as a **Regular Web Application**.
        Not `SPA` — that application type disables client secrets, and this is
        a confidential client.

        Server-side sequence:
        1. Validate `state` against the stored transaction. Mismatch →
           `/login?error=sign_in_failed` (see responses).
        2. Exchange `code` + `code_verifier` + client secret at Auth0's
           `/oauth/token` endpoint. *(egress required)*
        3. Fetch JWKS on cache miss or `kid` rotation. *(egress required)*
        4. Validate the ID token: signature, `iss`, `aud`, `exp`, `nonce`.
        5. Extract `sub`, `email`, `name`.
        6. **Delegate to the users module** —
           `users.resolve_or_reject(sub, email)`. See below.
        7. Insert a fresh `sessions` row — a **new** session id on every login,
           which defeats session fixation.
        8. **Discard the ID token.** It is not persisted.

        Steps 2 and 3 are the *only* backend-to-Auth0 traffic in the entire
        system, and the sole justification for the NAT Gateway.

        ### Step 6 — provisioning resolution
        Auth cannot decide whether a person may use this system; that is a
        users-module policy. But auth needs a `users.id` before it can insert a
        session row. It therefore **asks**:

        ```python
        user = await users.resolve_or_reject(sub=..., email=...)
        ```

        The users module resolves in this order:

        | Case | Match | Action |
        |------|-------|--------|
        | Allowed | `auth0_sub` matches a row whose `status` is `active` (the `sub` is stored when the credential is created at provisioning) | Return the row |
        | Deactivated | no active match, but the newest row for the token's `email` has `status = deactivated` | **Reject** — `deactivated` |
        | Deleted | same, with `status = deleted` | **Reject** — `deleted` |
        | Unprovisioned | no row for the email at all | **Reject** — `not_provisioned` |

        On rejection: **no user row is created/modified and no session is
        issued.** Redirect to `/login?error=not_provisioned`, `deactivated` or
        `deleted` accordingly — these are deliberately distinguishable
        in the response and in the audit log (never had access, vs. access
        was paused, vs. the account was removed), even if you choose to show
        the end user the same generic front-end copy for all. Repeated
        rejected login attempts against this endpoint are a signal worth
        retaining.

        Auth never names a role, never writes `users.role`, and never decides
        eligibility. It delegates and acts on the answer.
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: Authorization code. Present on success.
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
          description: Present instead of `code` when Auth0 rejects the request.
          example: access_denied
        - name: error_description
          in: query
          schema: { type: string }
      responses:
        "303":
          description: |
            Every outcome is a redirect, never an error body: this is a
            top-level browser navigation, so a JSON `403`/`502` would strand
            the user on a raw error page instead of the login screen that can
            explain it. `Location` by outcome:

            | Outcome | Cookie | `Location` |
            |---------|--------|------------|
            | Success | set | the SPA root, `/` |
            | User cancelled at Auth0 (`error=access_denied`) | none | `/login?error=sign_in_cancelled` |
            | Any other Auth0 error, a `state` mismatch/missing/expired, a failed code exchange, or Auth0 unreachable / answering `5xx` | none | `/login?error=sign_in_failed` |
            | Rejected provisioning (Step 6) | none | Auth0's `/v2/logout`, with `returnTo` = `/login?error=not_provisioned`, `deactivated` or `deleted` |

            A rejected login goes through Auth0's logout so the next attempt
            is not silently re-admitted on Auth0's own session. The `error`
            values are fixed codes, never reflected from Auth0: Auth0's
            `error_description` is logged, never sent to the browser.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Strict
              description: |
                No `Max-Age`: a browser-session cookie. Expiry is enforced
                server-side by the idle and absolute clocks, not by the
                browser.
            Location:
              schema: { type: string, format: uri }

  # ---------------------------------------------------------------------------
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Return the caller's identity, role and session state
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "any provisioned user — require_role('teaching_assistant')"
      description: |
        The SPA's route guard and bootstrap call: one request answers "am I
        signed in, as whom, and until when". A `401` means "navigate to
        login", and its `error` code (`session_expired`, `session_revoked`,
        …) picks the message the login page shows.

        `supervisor_ids` drives the SPA's screening gate: a
        `teaching_assistant` with none cannot submit checks or batches.
        `display_name` is null until the person picks one; the SPA prompts
        for it.

        > Replaces `GET /api/auth/session`, a session-only endpoint the code
        > does not serve: the SPA would have had to pair it with
        > `GET /api/users/me` on every bootstrap. `GET /api/users/me` still
        > exists and returns the full `User` record. See DECISION LOG
        > [0.25.0].
      parameters:
        - name: probe
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Answer without counting the request as activity: the idle timer
            is not bumped. The SPA sets it when its own countdown reaches
            zero and it asks whether the session is really gone — asking the
            ordinary way would renew the session it is checking, so an
            abandoned tab would never time out. Accepted on every
            session-checked route, documented here because this is the only
            one that uses it.
      responses:
        "200":
          description: Active session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke all sessions for the current user
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      description: |
        Global logout. Revokes **every** active session for this `user_id`,
        not just the calling browser's — the chosen semantics for an academic
        integrity tool.

        Requires no role check: a user may always terminate their own sessions.

        Sessions are soft-deleted (`deleted_at = now()`), never hard-deleted,
        preserving referential integrity with audit entries.

        Idempotent: repeating it with a token whose session is already revoked
        revokes nothing further and still completes. The caller is resolved
        through a **live** session only — otherwise a copied cookie would stay
        usable indefinitely as a "sign this person out everywhere" primitive.

        ### Two-step logout — the server completes it
        Revoking the local sessions is not sufficient. The Auth0 SSO session
        survives, so the user can click "log in" and be silently readmitted.
        This looks like a logout bug and is not.

        **Implemented as a redirect, not a header.** This endpoint answers
        `303` straight to the Auth0 sign-out URL, and `SignOutForm.tsx`
        submits a native form POST rather than an XHR. The full document
        navigation is what discards the in-memory query cache, and the
        redirect works with no JavaScript at all.

        Either way the URL is built server-side, so Auth0 domain/client
        configuration never enters the frontend bundle and does not vary
        between environments.

        ### Auth0's `/v2/logout` — no per-user hint needed
        Unlike Entra's `end_session_endpoint` (RP-Initiated Logout,
        `id_token_hint`/`logout_hint`), Auth0 does not implement that OIDC
        spec for its own session. It exposes a proprietary
        `/v2/logout?client_id=...&returnTo=...` endpoint instead, which needs
        no per-user hint to determine whose Auth0 session to end — it reads
        that from Auth0's own session cookie on the browser making the
        request. This endpoint is built directly from static config
        (`AUTH0_DOMAIN`, `AUTH0_CLIENT_ID`, `FRONTEND_URL`), with no discovery
        document lookup and nothing stored per-user for it — the
        Entra-specific `logout_hint` capture-at-callback-and-replay-at-logout
        mechanism (`users.logout_hint`) is gone along with it.
      responses:
        "303":
          description: |
            All live sessions for this user revoked; cookie cleared; browser
            redirected onward to Auth0 sign-out.

            Returned even when the cookie is absent or already revoked — the
            endpoint never reports whether a session existed, and the user ends
            up signed out of Auth0 either way.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
                example: https://ci-dummy-tenant.auth0.com/v2/logout?client_id=abc123&returnTo=https%3A%2F%2Fpromptpatrol.smu.edu.sg
              description: |
                `returnTo` must be registered in the Auth0 application's
                "Allowed Logout URLs", or Auth0 rejects the redirect and
                strands the user on an Auth0 error page. Register production
                and `http://localhost:5173` for development.
            Set-Cookie:
              schema:
                type: string
                example: __Host-session=; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=0

  # ---------------------------------------------------------------------------
  # USERS — provisioning, roles, RBAC primitives
  # ---------------------------------------------------------------------------
  /api/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Return the current user's profile and role
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      description: |
        The caller's own `User` record, resolved from their session cookie.
        The SPA bootstraps from `GET /api/auth/me` instead, which adds the
        session state and `supervisor_ids`; this endpoint is the plain
        `User` view of the same person.
      responses:
        "200":
          description: Current user's profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users:
    post:
      tags: [users]
      operationId: provisionUser
      summary: Provision a new user record (invite-first)
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY # authentication only
      x-authorization: "users module — require_role('root_admin'), see DECISION LOG [0.21.0]"
      description: |
        Creates a `users` row keyed on `email`, with `auth0_sub` set to the
        id of the Auth0 credential this call creates — login later matches on
        it (see `/api/auth/callback`). No session is created here; this is
        invitation, not authentication.

        Also creates the matching Auth0 Database-connection credential via
        the Management API, then has Auth0 email the invitee a one-time
        password-set link directly — see DECISION LOG [0.9.0]. Disable Sign
        Ups means the invitee has no way to create that credential
        themselves, so this call must do both halves or the invitee is
        provisioned with no way to ever sign in. The Auth0 call happens
        **before** the local row is committed: if it fails, nothing is
        saved, rather than leaving a `users` row for an email that can
        never log in.

        **`root_admin` only** (`403` for anyone else). Instructors add
        teaching assistants through `POST /api/users/teaching-assistants`,
        which can also link an existing account — see DECISION LOG [0.21.0].
        `role` may be `instructor` or `teaching_assistant`; `root_admin` is
        always `403` (a root_admin is only ever seeded with the
        `scripts.provision_user` CLI).

        `provisioned_by` is set to the caller and never changes afterwards.
        It records who issued the invite and **grants nothing**: supervision
        lives in the `supervisions` table.

        Optional `supervisor_id` (`teaching_assistant` only, must be an
        `active` `instructor`, otherwise `400`) links the new TA in the same
        commit as the account and the Auth0 invite — all or nothing: if any
        part fails, no row, no link and no credential are left behind.
        Without it the TA starts unassigned (`supervisor_ids: []`) and cannot
        screen until `POST /api/users/{id}/supervisors` links one.

        No display name is taken: the new user chooses their own after first
        sign-in (`PATCH /api/users/{id}`), so `display_name` starts null.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "201":
          description: |
            User provisioned, `status: active`.
            Auth0 has already emailed the invitee a one-time link to set
            their own password (replacing any stale credential for that
            email — see DECISION LOG [0.17.0]) — there is nothing further
            for this response to hand back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller is not `root_admin`, or the request named `root_admin`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `email` already belongs to a row whose `status` is `active` or
            `deactivated` (use `POST /api/users/{id}/reactivate` for the
            latter). A `deleted` row does not block provisioning: the new
            account reuses that row, with a fresh Auth0 credential and a
            `deleted → active` entry in the status history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            Could not create the Auth0-side credential (Management API call
            failed). Nothing was saved locally — retry the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      tags: [users]
      operationId: listUsers
      summary: List / filter users
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — delegation-scoped, see DECISION LOG [0.5.5]"
      description: |
        Administrative directory view. Delegation-scoped, not a flat
        `root_admin` gate — see DECISION LOG [0.5.5] for why this reverses
        [0.4.0]'s original root_admin-only text:
          - `root_admin` sees every row, any role, including other
            `root_admin` rows.
          - `instructor` sees only `teaching_assistant` rows they currently
            supervise (an active `supervisions` link, [0.21.0]) — whoever
            provisioned them. Never other instructors, never `root_admin`,
            never TAs they do not supervise.
          - `teaching_assistant` gets `403` — this is a role-level floor
            gate for TAs, not an object-level scoping question.

        `role` narrows an already-scoped result set. For an `instructor`
        caller the scope is always `role=teaching_assistant AND supervised
        by <caller>`; `role=teaching_assistant` or no `role` returns it, and
        any other `role` value is `403`. This is **not** the silent-override
        rule that `actor_id` follows on `GET /api/checks`: that rule exists
        because an id names a record, and refusing it would confirm the
        record exists. A `role` value names no record — the `403` depends
        only on the caller's role and the value asked for, never on what is
        in the table, so it reveals nothing. An empty page would instead
        read as "you have no such users" when the truth is "you may not ask
        that". See DECISION LOG [0.24.0].
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [root_admin, instructor, teaching_assistant]
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/UserStatus" }
            default: [active]
          description: |
            Repeat to widen, e.g. `?status=active&status=deactivated`.
            Defaults to `active` only, so `deleted` rows are returned only
            when asked for by name and an ordinary screen cannot show them
            by accident.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
          description: |
            Opaque. Base64 encoding of the last `id` from the previous
            page. Keyset-paginated ordered by `id` ascending.
      responses:
        "200":
          description: Paginated users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  next_cursor:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            A `teaching_assistant` caller, or an `instructor` passing a
            `role` other than `teaching_assistant`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/teaching-assistants:
    post:
      tags: [users]
      operationId: addTeachingAssistant
      summary: Add a teaching assistant to the caller's team by email (creates or links)
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — require_role('instructor') exactly (not root_admin), see DECISION LOG [0.21.0]"
      description: |
        The instructor's single "add a teaching assistant" action. The caller
        types an email; the server works out what that means:

        | `email` belongs to                              | Effect                                                   |
        |-------------------------------------------------|----------------------------------------------------------|
        | no live account                                  | provision a `teaching_assistant` + Auth0 invite (as `POST /api/users`), link to caller |
        | an `active` `teaching_assistant`, any supervisors | add an active link to the caller; **no** Auth0 call      |
        | a TA the caller already supervises               | no-op                                                    |
        | a `deactivated` or `deleted` account, any role   | refuse (`409`)                                           |
        | an `active` `instructor` or `root_admin`         | refuse (`409`)                                           |

        **The response does not say which row applied.** Every success is
        the same `200` with the resulting `User`; every refusal is the same
        `409` with a fixed message. The reason for a refusal is written to
        the application log only, so the root administrator can look it up
        when the instructor gets in touch. What still leaks — "this email is
        an existing account that cannot be added" versus "addable", and a
        pending vs. active row appearing on the caller's team — is accepted
        and documented in DECISION LOG [0.21.0].

        Unlike `POST /api/users`, a `deleted` email is **not** re-provisioned
        here. Reusing a deleted account is a `root_admin` decision.

        Linking never touches the existing account's `display_name`,
        `provisioned_by`, credential or status. A new account's
        `provisioned_by` is the caller; its `display_name` starts null.

        Linking to a TA someone else already supervises SHOULD notify that
        instructor and `root_admin`. There is no notification system yet;
        until there is, nothing is sent and the link is visible only in the
        TA's `supervisor_ids`. Recorded in DECISION LOG [0.21.0] as deferred.

        No confirmation token — the SPA asks the caller to confirm the email
        they typed before sending, which shows nothing the caller did not
        already enter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingAssistantAddRequest" }
      responses:
        "200":
          description: |
            The TA is now on the caller's team (created, linked, or already
            there — indistinguishable by design). If the account is new, Auth0
            has emailed a password-set link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            This email cannot be added. Always the same `detail`, whatever the
            reason: "This email can't be added. Contact the root administrator."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            Auth0 could not create the credential for a new account. Nothing
            was saved; retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{id}:
    patch:
      tags: [users]
      operationId: updateUserDisplayName
      summary: Set a user's display name
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — self or root_admin, see DECISION LOG [0.21.0]"
      description: |
        The only field it changes is `display_name`. Anyone may set their
        own, at any time; `root_admin` may set anyone's. Everyone else gets
        `404` (object-level, same as `GET`) — an instructor cannot rename
        their teaching assistants.

        The SPA asks for a name on the first sign-in where `display_name`
        is null, before showing anything else. That step is a courtesy: the
        server does not gate other endpoints on a missing name, since an
        unnamed account is shown by its email and nothing breaks.

        Not audited beyond the application log: a name grants no access.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatchRequest" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is `deleted`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      tags: [users]
      operationId: getUser
      summary: Get a single user
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — object-level, see DECISION LOG [0.5.2]"
      description: |
        Object-scoped, not role-gated — every provisioned caller may hit
        this route, visibility of the *target* is what varies:
          - `root_admin` may view anyone, including other `root_admin` rows.
          - Anyone may view their own record.
          - `instructor` may view the `teaching_assistant` rows they
            currently supervise ([0.21.0]) — the same set `listUsers`
            returns them. Not other instructors, not `root_admin`.
          - `teaching_assistant` may view their own active supervisors
            (`supervisor_ids`), nobody else.
        Out-of-scope targets return `404`, same as a nonexistent id — see
        the `NotFound` schema. There is no `403` path for this endpoint: it
        has no function-level role gate, so every denial is object-level.
        Functionally redundant with `GET /api/users/me` for the self case —
        kept anyway so an admin-UI table and a single-user drill-down can
        hit the same shape via the same route pattern.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user (terminal) and revoke all of their sessions
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — require_role('root_admin'), see DECISION LOG [0.18.0]"
      description: |
        Moves the row to `status = deleted`. The row is never removed — the
        audit trail's referential integrity depends on it surviving, same
        rationale as soft-deleted sessions. Optional `{reason}` body (max 500
        characters) is stored on the `UserStatusEvent`.

        **`root_admin` only**, and never another `root_admin`. `403` for
        anyone else. Nobody may delete their own account.

        Ends every active `supervisions` link the user is on, in either
        direction (a deleted TA has no supervisors; a deleted instructor
        supervises no one), in the same commit — [0.21.0].

        Any teaching assistant left with no active supervisor is signed
        out in the same commit ([0.22.0]).

        **Immediately revokes every active session belonging to this user.**
        It takes effect on their very next request: the app checks the
        session row on every request and caches nothing between requests.
        (A gateway, if one is added, must keep `result_ttl_seconds = 0` for
        the same reason — see `x-gateway-configuration`.)

        Removes the Auth0 credential after the local change commits. If that
        call fails the row is still `deleted` and the failure is logged;
        re-provisioning the email replaces the stale credential (see
        DECISION LOG [0.17.0]).

        A deleted user hitting `/api/auth/callback` afterward is rejected
        with the distinct `deleted` code.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChangeRequest" }
      responses:
        "200":
          description: |
            The row, now `deleted`. Returned rather than `204` so the caller
            sees the resulting status without a second read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already deleted. Deletion is terminal, not idempotent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{id}/deactivate:
    post:
      tags: [users]
      operationId: deactivateUser
      summary: Pause an account (reversible) and revoke its sessions
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — require_role('root_admin'), see DECISION LOG [0.21.0]"
      description: |
        `active → deactivated`. **`root_admin` only**, on anyone but
        themselves (a lone root admin would lock the system out); `403` for
        everyone else. Instructors used to hold this over their own TAs; with
        shared TAs one instructor could lock a TA out of every team, so they
        now only end their own link (`DELETE .../supervisors/{instructor_id}`)
        — [0.21.0]. `supervisions` links are kept, so reactivating restores
        the same teams. A deactivated instructor's links stop counting
        toward a TA's `supervisor_ids` until they are reactivated.
        Any teaching assistant left with no active supervisor is signed
        out in the same commit ([0.22.0]).
        Revokes every live session in the same commit. Optional `{reason}`
        body, stored on the `UserStatusEvent` and never shown to the user.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChangeRequest" }
      responses:
        "200":
          description: The row, now `deactivated`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not a legal transition (e.g. the target is already deactivated or deleted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{id}/reactivate:
    post:
      tags: [users]
      operationId: reactivateUser
      summary: Return a deactivated account to active
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — require_role('root_admin'), see DECISION LOG [0.21.0]"
      description: |
        `deactivated → active`, same `root_admin`-only scope and body as
        `/deactivate`. Cannot revive a `deleted` account (`409`) — that takes
        a fresh `POST /api/users`. Old sessions stay revoked: the person
        signs in again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChangeRequest" }
      responses:
        "200":
          description: The row, now `active`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not a legal transition (the target is not currently deactivated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{id}/resend-invite:
    post:
      tags: [users]
      operationId: resendUserInvite
      summary: Re-send the password-set email to an invitee who has never signed in
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — delegation-scoped, see DECISION LOG [0.19.0]"
      description: |
        Asks Auth0 to email the invitee the same password-set link again for
        the credential created at provisioning. Creates nothing and changes
        no local state. Only valid for an `active` account whose
        `first_login_at` is null; anything else is `409`.

        Delegation-scoped: `root_admin` may act on anyone but themselves;
        `instructor` only on `teaching_assistant` rows they currently
        supervise, whoever provisioned them ([0.21.0]); `teaching_assistant`
        on no one (`403`).

        Not audited beyond the application log — it changes no access. No
        rate limit of its own: Auth0's per-tenant limits apply, and a
        refused send surfaces as `502`. The link's lifetime is an Auth0
        tenant setting and is deliberately not stated here.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The unchanged row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is not active, or has already signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Auth0 could not send the email. Nothing changed; retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{id}/role:
    patch:
      tags: [users]
      operationId: changeUserRole
      summary: Change a user's role
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: users module — require_role('root_admin')
      description: |
        Isolated from `POST /api/users` and from a general profile update so
        a role change is always its own distinct, audited action —
        `actor_id`, `old_role`, `new_role`, `timestamp` — independent of
        whatever fields a future general-update endpoint might cover.

        Restricted to `root_admin` regardless of the delegation table on
        `POST /api/users`: delegated provisioning (instructor →
        teaching_assistant) grants authority to *create* an account at a
        role, not to *reassign* role after the fact. Keeps every
        role-escalation path in exactly one place for audit purposes —
        see DECISION LOG [0.3.0] on why authorization stays centralised in
        code rather than split across delegation paths.

        Cannot target `root_admin`, in either direction — it is not
        reassigned via API in or out.

        Ends every active `supervisions` link the user is on, in the same
        commit ([0.21.0]): a link is only meaningful between an instructor
        and a teaching assistant, and neither end survives a role swap.

        Any teaching assistant left with no active supervisor is signed
        out in the same commit ([0.22.0]).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRolePatchRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/{id}/supervisors:
    post:
      tags: [users]
      operationId: addUserSupervisor
      summary: Link an instructor as a supervisor of a teaching assistant
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — require_role('root_admin'), see DECISION LOG [0.21.0]"
      description: |
        Adds an active `supervisions` link between the teaching assistant
        `{id}` and `instructor_id`. **`root_admin` only**: this is how the
        admin places a TA it created, or re-places one. Instructors add
        themselves by email through `POST /api/users/teaching-assistants`
        instead, so they never need a TA's id.

        Replaces v0.20.0's `POST /api/users/{id}/supervisor`, which set a
        single value and so overwrote the previous supervisor. Links are
        additive: a TA may have any number of active supervisors. Linking a
        pair that is already active is a no-op `200`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupervisorLinkRequest" }
      responses:
        "200":
          description: The TA, with the updated `supervisor_ids`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: |
            The target is not a `teaching_assistant`, or `instructor_id` is
            not an `active` `instructor`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is not `active` (deactivated or deleted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{id}/supervisors/{instructor_id}:
    delete:
      tags: [users]
      operationId: removeUserSupervisor
      summary: End one instructor's supervision of a teaching assistant ("Remove from team")
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "users module — root_admin, or the instructor named in the path, see DECISION LOG [0.21.0]"
      description: |
        Ends the active link (sets `ended_at`/`ended_by`; the row is kept as
        history). `root_admin` may end any link. An `instructor` may end only
        their own — `instructor_id` must be the caller; naming anyone else,
        or a link the caller does not hold, is `404`. This is the
        instructor's "Remove from team": it affects only their team, never
        the TA's account or other supervisors.

        If this was the TA's **last** active link, the TA's live sessions are
        revoked in the same commit, for the reason v0.5.6 gave for
        unassigning: the SPA decides "may this person screen?" from the
        session payload it already holds. The TA can sign in again and sees
        the unassigned notice until someone links them; any instructor can
        do that by email (`POST /api/users/teaching-assistants`).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: instructor_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The TA, with the updated `supervisor_ids`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # CHECKS — single-answer detection
  # ---------------------------------------------------------------------------
  /api/detector:
    get:
      tags: [checks]
      operationId: getDetectorCapabilities
      summary: Declare the served detector's runtime input contract
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      description: |
        Fetched once on SPA bootstrap, alongside `GET /api/auth/me`.

        Exists so that facts about the served model which are **not yet known**
        — and which will change as E2 progresses — do not have to be encoded in
        the schema and revised. The schema stays fixed; the server declares its
        current requirements; the SPA and the batch validator adapt.

        This is the mechanism that keeps `question_text` reversible. See
        DECISION LOG [0.5.1].

        Cache for the session. A model swap mid-session is not a scenario worth
        engineering for — the values change on deploy, and the 4-hour absolute
        session cap bounds staleness.

        Answers with static, server-declared config — nothing here depends on
        the detector being reachable, so there is no 503 to give. Detector
        reachability is `GET /api/detector/status`'s job, which is
        deliberately always `200` (a down detector is a state to render, not
        a failed request). See DECISION LOG [0.5.9].
      responses:
        "200":
          description: Current detector capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectorCapabilities" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/detector/status:
    get:
      tags: [checks]
      operationId: getDetectorStatus
      summary: Whether the detector can score right now
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: "any provisioned user — require_role('teaching_assistant')"
      description: |
        Backs the SPA's detector status badge, which polls it. **Always
        `200`**: a down detector is a state to render, not a failed request —
        an error would leave the badge with nothing to show at the exact
        moment it has something worth saying. See DECISION LOG [0.5.9].

        The backend asks the detector's own `/health` with a 2-second budget
        (short on purpose, so a hung detector reads as `unavailable` quickly;
        scoring keeps its own 10-second budget):

        | Detector `/health` answers | `status` |
        |----------------------------|----------|
        | `200` | `ready` |
        | non-200 with body `{"status": "loading"}` (model still loading) | `loading` |
        | anything else, including no answer within 2 s | `unavailable` |

        `loading` is told apart because it resolves itself in a minute;
        `unavailable` needs someone to go and look.
      responses:
        "200":
          description: Current detector state.
          content:
            application/json:
              schema:
                type: object
                required: [status, model_version]
                properties:
                  status:
                    type: string
                    enum: [ready, loading, unavailable]
                  model_version:
                    type: string
                    description: The served model, same as `GET /api/detector`'s.
                    example: roberta-base-openai-detector-v0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/checks:
    post:
      tags: [checks]
      operationId: createCheck
      summary: Run a detection on one short answer
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: |
        users module — any provisioned, non-deleted user, except a
        `teaching_assistant` with no supervisor. No role gate beyond that:
        detection is the product. Attribution is the control, not restriction.
      description: |
        Synchronous. Submits one short answer, returns a verdict.

        A `teaching_assistant` whose `provisioned_by` is NULL is refused with
        `403` — they belong to no course, so there is nothing for them to
        screen. See DECISION LOG [0.5.6]. The SPA refuses them too, but it
        decides that from the session payload it is holding and can be skipped
        entirely; this is the check that counts. The rule names assistants
        specifically rather than "must have a supervisor", which would lock out
        every instructor and admin.

        `actor_id` on the persisted row is the caller resolved from the
        session cookie. **There is no `instructor_id` field in this request body,
        and one supplied will be rejected with 400** (`additionalProperties:
        false`). A client-settable attribution field on a tool that produces
        academic-integrity accusations is a forgery primitive; whoever ran the
        check is whoever's session ran it.

        > Note the deliberate asymmetry with `GET /api/checks`, where an
        > instructor-supplied `actor_id` *filter* is silently overridden rather
        > than rejected. That override prevents existence enumeration. Here
        > there is nothing to enumerate, so failing loudly on a client bug is
        > the better behaviour.

        ### Why 201 and not 200
        A check is a persisted resource with an identifier, retrievable at
        `GET /api/checks/{id}` and listed in history. The row is written
        unconditionally even when `retain_answer` is false. This is a creation,
        not an RPC call.

        ### Why synchronous — and the condition under which this changes
        A fine-tuned encoder classifier (RoBERTa/DeBERTa, 256 tokens) is
        order-of-hundreds-of-milliseconds. Synchronous is the right shape and
        avoids inflicting the batch polling flow on the single-answer path.

        **This assumption does not survive every outcome of E2.** Fast-DetectGPT
        and Binoculars require full LLM forward passes — seconds on GPU, far
        worse on CPU. If a zero-shot detector wins the comparison, this endpoint
        migrates to the `202 + job_id + polling` pattern already used by
        `/api/batches`, and `CheckResult` is unchanged by that migration —
        only the delivery mechanism moves. Flagged so the decision is made
        deliberately rather than discovered at integration.

        Hard server-side timeout: 10s, returning `504` with
        `detector_timeout`. No partial results.

        ### Retention
        `retain_answer` governs **only** whether `answer_text` is persisted on
        the checks row. `actor_id`, `created_at`, `model_version`, and
        `verdict` are written unconditionally and are not client-controllable
        — see DECISION LOG [0.11.0].

        > **OPEN — PDPA / retention policy.** Storing student answers requires a
        > documented retention period and a purge job, and sponsor sign-off.
        > Currently unassigned in the proposal. Until it lands, treat
        > `retain_answer: true` as provisional. The contract is written so that
        > defaulting it to `false` later is a config change, not a schema change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckCreateRequest" }
      responses:
        "201":
          description: |
            Detection complete. A `201` does **not** mean the answer is
            AI-generated, nor that the detector was confident — check `verdict`,
            which may be `uncertain`.
          headers:
            Location:
              schema:
                type: string
                example: "/api/checks/3f9a1c20-5b8e-4a11-9d3c-7e2f6b0a4c88"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "400":
          description: |
            Malformed body, unknown field (notably `instructor_id`,
            `threshold`, or `model_version` — all removed in 0.5.0), or
            `answer_text` below the hard floor of 10 characters.

            Note: an answer that is *short but non-trivial* is NOT a 400. It is
            a successful check with `verdict: uncertain` and
            `abstain_reason: answer_too_short`. The instructor still needs a
            recorded, auditable outcome for that submission. Only unusable
            input is a validation error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            A `teaching_assistant` with no supervisor. The message names what
            is missing, since it is something an administrator can fix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "`answer_text` exceeds 10,000 characters."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: |
            Detector service unavailable. Distinct from `500` — this is
            retryable by the client and should render as "try again shortly",
            not as a failed check. Nothing is persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Detector exceeded the 10s budget. Nothing is persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      tags: [checks]
      operationId: listChecks
      summary: List past checks (history)
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: |
        users module — object-level. Instructors and teaching assistants see
        only their own checks; root_admin sees all.
      description: |
        This **is** the history feature. There is no `/api/history` — see
        DECISION LOG [0.5.0].

        Object-level scoping is applied server-side from the authorizer context.
        An `actor_id` filter from a non-`root_admin` caller is **silently
        overridden** to the caller's own `user_id`, never rejected — a `403`
        on someone else's id would confirm that id exists, which is an
        enumeration oracle. Silent scoping leaks nothing.

        This is OWASP API1 territory and cannot be enforced at the gateway,
        which has no idea which rows belong to whom. See DECISION LOG [0.3.0].

        Returns `CheckSummary`, not `CheckResult` — history is a table view and
        does not need explanations, spans, or full answer text. Drill down via
        `GET /api/checks/{id}`.
      parameters:
        - name: actor_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Honoured only for `root_admin`. Silently overridden to the caller's
            own `user_id` for every other role. Do not rely on it in the SPA.
        - name: verdict
          in: query
          schema: { $ref: "#/components/schemas/Verdict" }
        - name: batch_id
          in: query
          schema: { type: string, format: uuid }
          description: |
            Filter to checks produced by one batch. This is how the batches
            module exposes its results — batch rows are ordinary checks.
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated checks, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CheckSummary" }
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/checks/{id}:
    get:
      tags: [checks]
      operationId: getCheck
      summary: Retrieve one past check
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: |
        users module — object-level. `root_admin`, or the check's own
        `actor_id`.
      description: |
        Returns the full `CheckResult`, including `answer_text` if it was
        retained.

        A check belonging to another instructor returns **404, not 403** — see
        the `NotFound` response description. Distinguishing "exists but not
        yours" from "does not exist" turns this endpoint into a probe for
        whether a colleague has checked a particular submission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  /api/batches/upload-url:
    post:
      tags: [batches]
      operationId: createBatchUploadUrl
      summary: Get a presigned URL to upload a batch CSV
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: |
        Same gate as `POST /api/checks` — any provisioned, non-deleted user,
        except a `teaching_assistant` with no supervisor.
      description: |
        Step 1 of 2. The SPA PUTs the raw file to `upload_url` directly (never
        through this API), then calls `POST /api/batches` with `upload_key` to
        submit it. Nothing is parsed or persisted at this step — a URL
        requested and never used costs nothing server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A `teaching_assistant` with no supervisor. Same rule as `POST /api/checks`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/batches:
    post:
      tags: [batches]
      operationId: createBatch
      summary: Submit a batch job from an already-uploaded CSV
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: |
        Same gate as `POST /api/checks` — any provisioned, non-deleted user,
        except a `teaching_assistant` with no supervisor.
      description: |
        Step 2 of 2. Fetches `upload_key` from S3, parses it as CSV (applying
        `column_mapping` if supplied), validates each row against the same
        field limits as `CheckCreateRequest`, and writes a `batches` row plus
        one `batch_row_failures` row per invalid row (spec Decision 4 — bad
        rows are skipped, never a reason to reject the whole upload). One SQS
        message is enqueued per valid row; the Worker calls the same
        `create_check()` used by the synchronous path.

        `strictness` and `retain_answer` are batch-level — one value applies
        to every row in the file, never a per-row CSV column (spec
        Decision 3).

        ### Row rules
        Checked per row after trimming whitespace; a row failing any rule
        becomes one `batch_row_failures` row with the first reason found:

        | Field | Rule |
        |-------|------|
        | `external_ref` | required (unlike on a single check), at most 128 characters |
        | `answer_text` | required, 10–10,000 characters |
        | `question_text` | optional, at most 2,000 characters; required when the batch's `requires_question_text` is true |

        The file must have `external_ref` and `answer_text` columns (after
        `column_mapping`). At most **500 data rows** are processed: every
        later row becomes a failure ("row not processed") rather than the
        file being rejected. `row_number` is the line in the file, so the
        first data row is `2` (the header is line 1). `row_number` `0` means
        the failure is not tied to a line: a whole-file problem (empty file,
        missing column, with `external_ref` null), or a valid row that could
        not be enqueued to SQS (with its `external_ref` set) — recorded as a
        failure so it never sits as `pending` forever.

        Returns `202` immediately; `Batch.row_total` counts valid plus
        rejected rows (a whole-file problem counts as one), not yet how many
        have been scored.
        Poll `GET /api/batches/{id}` for progress.

        A file in which no row is valid is still `202`, not `400`: the batch
        is created with every row in `batch_row_failures` and nothing
        enqueued, so the instructor sees the reason for each row. An empty
        file or a missing required column is recorded the same way, as a
        single failure with `row_number` 0. See DECISION LOG [0.24.0].
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchCreateRequest" }
      responses:
        "202":
          description: Batch accepted; processing has started asynchronously.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400":
          description: |
            Malformed body, unknown field, an unknown `strictness`, an
            `upload_key` not issued to this caller, or nothing uploaded to
            `upload_key` (the browser's PUT to S3 failed or expired). Never
            for the file's contents — see the description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A `teaching_assistant` with no supervisor. Same rule as `POST /api/checks`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/batches/{id}:
    get:
      tags: [batches]
      operationId: getBatchProgress
      summary: Poll batch progress
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: |
        users module — object-level, same convention as `GET /api/checks/{id}`.
        `root_admin`, or the batch's own `actor_id`.
      description: |
        `completed + failed + pending == row_total` always holds.
        `completed`/`failed` are `COUNT(checks)`/`COUNT(batch_row_failures)`
        for this `batch_id` — computed on read, not a stored counter (spec
        Decision 2/7: no separate progress-write path to keep in sync).

        A batch belonging to another instructor returns **404, not 403** —
        same existence-hiding convention as `GET /api/checks/{id}`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchProgress" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/batches/{id}/cancel:
    post:
      tags: [batches]
      operationId: cancelBatch
      summary: Stop an in-flight batch
      security:
        - sessionCookie: []
      x-auth-enforcement: GATEWAY
      x-authorization: |
        Same object-level gate as `GET /api/batches/{id}` — `root_admin`, or
        the batch's own `actor_id`. 404, not 403, for someone else's batch.
      description: |
        Sets `Batch.cancelled_at`. Idempotent — cancelling an
        already-cancelled or already-finished batch just returns current
        progress rather than erroring.

        On the first cancel, also purges this batch's rows still queued in
        SQS (`purge_batch_messages`): best effort, since SQS has no "delete
        where batch = X" — it reads up to 2,000 messages and deletes only
        this batch's, leaving every other message untouched. The Worker's
        own per-message `cancelled_at` check is the backstop for anything
        the purge misses: such a row is recorded in `batch_row_failures`
        instead of scored.

        A purged row never becomes a check or a failure, so **`pending` can
        stay above 0 on a cancelled batch for good.** Clients must treat
        `cancelled: true` as terminal and stop polling — the SPA does. See
        DECISION LOG [0.14.0] and [0.25.0].
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current progress, with `cancelled` now true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchProgress" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        Opaque 256-bit CSPRNG session identifier. Carries no claims and is not
        a token — the server stores only its SHA-256 hash, as the lookup key
        into the `sessions` table, so a leaked table row cannot be replayed
        as a cookie. Meaningless outside this system.

        Attributes (per `draft-ietf-oauth-browser-based-apps` Â§6.1.3.2):
        `Secure` and `HttpOnly` are MUST; `SameSite=Strict`, `Path=/`, absent
        `Domain`, and the `__Host-` prefix are SHOULD and all applied.

        Establishes identity only. Authorization is evaluated separately by the
        users module.

  schemas:
    Me:
      type: object
      required: [id, email, display_name, role, supervisor_ids, session]
      description: |
        `GET /api/auth/me`. The caller's identity, role and session state in
        one body, so the SPA bootstraps in one request.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Internal identifier. Never sent to Auth0. The SPA uses it to
            `PATCH /api/users/{id}` its own display name.
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
          description: Null until the person picks one; the SPA prompts for it.
        role:
          type: string
          enum: [root_admin, instructor, teaching_assistant]
        supervisor_ids:
          type: array
          items: { type: string, format: uuid }
          description: Same as `User.supervisor_ids` — the SPA's screening gate.
        session:
          $ref: "#/components/schemas/SessionInfo"

    SessionInfo:
      type: object
      required:
        [expires_at, idle_expires_at, absolute_expires_at, expires_in_seconds, capped, idle_timeout_seconds]
      description: |
        When the caller's session ends, by either clock. The SPA uses it to
        warn before a forced sign-out. Times are as of this request: a
        normal request may have just pushed `idle_expires_at` forward; a
        `?probe=1` request never does.
      properties:
        expires_at:
          type: string
          format: date-time
          description: The earlier of `idle_expires_at` and `absolute_expires_at`.
        idle_expires_at:
          type: string
          format: date-time
          description: Last activity + 30 minutes.
        absolute_expires_at:
          type: string
          format: date-time
          description: Creation + 4 hours. Never extended.
        expires_in_seconds:
          type: integer
          minimum: 0
          description: Seconds from now until `expires_at`, never negative.
        capped:
          type: boolean
          description: |
            True when the absolute cap is what ends the session — further
            activity can no longer extend it.
        idle_timeout_seconds:
          type: integer
          description: The idle window itself (1800), so the SPA need not hard-code it.

    User:
      type: object
      required: [id, email, role, status, created_at, supervisor_ids]
      description: |
        Profile and authorization state. Owned entirely by the users module —
        the auth module never reads or writes `role` or `provisioned_by`; see
        the module boundary table in `info.description`.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: |
            Provisioning key (CITEXT, case-insensitive). Authoritative before
            first login; display data only afterward — see "Provisioning" in
            `info.description`.
        display_name:
          type: string
          nullable: true
          description: |
            Chosen by the user after first sign-in (`PATCH /api/users/{id}`);
            null until then — render the email instead. Never taken from the
            Auth0 `name` claim and never typed by whoever provisioned the
            account ([0.21.0]). Plain text: render as text, never HTML.
        role:
          type: string
          enum: [root_admin, instructor, teaching_assistant]
        provisioned_by:
          type: string
          format: uuid
          nullable: true
          description: |
            Who issued the invite. Provenance only: set once, never changed,
            and grants nothing ([0.21.0]). NULL for the seeded `root_admin`
            and CLI-provisioned rows. Do not read it as "supervisor" — use
            `supervisor_ids`.
        supervisor_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Instructors currently supervising this user: active
            `supervisions` links whose instructor is `active`. Always present;
            `[]` for anyone who is not a `teaching_assistant`. A
            `teaching_assistant` with `[]` is unassigned and cannot screen.
            Ids only — resolving them to names is an instructor/admin concern
            and goes through `GET /api/users/{id}`.
        status:
          $ref: "#/components/schemas/UserStatus"
        first_login_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Stamped once, on the first successful sign-in, and never changed
            after. Null means the invite is still pending: the account was
            provisioned but the person has never signed in. Derive "pending"
            as `status == active && first_login_at == null`; `deactivated`
            and `deleted` take display precedence. Reset to null when a
            deleted email is re-provisioned (a fresh credential). Tier 2
            (nullable) — do not make it required.
        created_at:
          type: string
          format: date-time

    UserStatus:
      type: string
      enum: [active, deactivated, deleted]
      description: |
        `active` may sign in. `deactivated` is a reversible pause: sessions
        are revoked and sign-in is refused until `.../reactivate`.
        `deleted` is terminal: sessions revoked, Auth0 credential removed,
        and the only way back is re-provisioning the email. Allowed
        transitions: `active ⇄ deactivated`, and either → `deleted`.
        Each transition is recorded in `UserStatusEvent`.

    StatusChangeRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: |
            Free-text note stored on the audit event, never shown to the
            affected user. Plain text: the server trims it, drops control
            characters (other than newline/tab) and `<` `>`, and stores a blank
            result as null. Clients must still render it as text, never HTML.

    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      description: |
        `root_admin` only. No `display_name` (the user chooses it; removed
        in [0.21.0], sending it is `400`).
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [instructor, teaching_assistant]
          description: "`root_admin` is rejected (`403`)."
        supervisor_id:
          type: string
          format: uuid
          nullable: true
          description: |
            `teaching_assistant` only: an `active` `instructor` to link in the
            same commit as the account ([0.21.0]). `400` on any other role or
            an unusable instructor. Omit or null for an unassigned TA.

    TeachingAssistantAddRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email

    SupervisorLinkRequest:
      type: object
      additionalProperties: false
      required: [instructor_id]
      properties:
        instructor_id:
          type: string
          format: uuid
          description: An `active` `instructor`.

    UserPatchRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Normalised server-side the same way as `StatusChangeRequest.reason`
            (trimmed; control characters and `<` `>` removed). Blank after
            normalising is `400` — a name, once set, cannot be cleared.

    UserRolePatchRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [instructor, teaching_assistant]
          description: "`root_admin` cannot be assigned or removed via this endpoint."

    # -------------------------------------------------------------------------
    # CHECKS
    # -------------------------------------------------------------------------

    Strictness:
      type: string
      enum: [lenient, standard, strict]
      default: standard
      description: |
        Instructor-facing flagging aggressiveness. Mapped **server-side** to a
        threshold calibrated for the currently served model at a target FPR —
        see the strictness table in `info.description`.

        The client never sends a numeric threshold. Score scales are
        model-specific, so a client-side threshold silently changes meaning on
        every model swap and discards the fixed-FPR calibration that the whole
        E2/E3 evaluation is built on.

    Verdict:
      type: string
      enum: [ai_generated, human_written, uncertain]
      description: |
        Machine-readable. **Display copy is owned by the frontend** — an API
        that returns "Likely AI-generated" forces the SPA to string-match,
        makes wording changes breaking, and blocks i18n.

        `uncertain` is a first-class outcome, not an error. The proposal
        commits to abstention on low-signal input; a two-value label makes that
        impossible and turns a coin flip into a stated verdict.

    AbstainReason:
      type: string
      nullable: true
      # `null` MUST be an explicit enum member in OAS 3.0 when nullable: true —
      # otherwise generated validators reject null against the enum.
      enum: [answer_too_short, low_signal, score_in_abstention_band, null]
      description: |
        Non-null iff `verdict == uncertain`. Drives the instructor-facing
        explanation of *why* the tool declined to call it.

        > **OPEN — abstention rule.** Needs a decision from the ML team before
        > implementation. Candidates, not mutually exclusive:
        >   (a) token-count floor (below N tokens, always abstain);
        >   (b) score band around the threshold, width set by calibration;
        >   (c) calibrated confidence below a floor.
        > (b) requires the calibration work in E2 to be complete, so a v0 stub
        > may ship with (a) only. The enum is written to accommodate all three
        > so adding one later is non-breaking.

        **Currently served — PROVISIONAL, pending the ML team's decision
        above** (`services/checks_service.py`, `_decide`), checked in order:

        | Condition | `verdict` | `abstain_reason` |
        |-----------|-----------|------------------|
        | answer has fewer than 10 words | `uncertain` | `answer_too_short` |
        | `abs(raw_score - threshold) <= 0.08` | `uncertain` | `score_in_abstention_band` |
        | `raw_score > threshold` | `ai_generated` | null |
        | otherwise | `human_written` | null |

        `threshold` is the server-side value for the requested `strictness`:
        `lenient` 0.4, `standard` 0.5, `strict` 0.65. That is a word-count
        floor plus a fixed-width band — candidates (a) and (b), with the band
        width a placeholder, not a calibration output. `low_signal` is
        reserved and never produced today. None of these numbers is part of
        the contract; clients branch on `verdict` and `abstain_reason` only.

    DetectorInfo:
      type: object
      required: [model_version, strictness_applied, used_question_text]
      description: |
        Provenance for the verdict. Reproducing a past decision needs both the
        model *and* the operating point — the model version alone is not enough,
        because recalibration changes the verdict for an unchanged score.

        Present on every result, for audit trail and model swappability.
      properties:
        model_version:
          type: string
          example: roberta-base-detector-v0
          description: |
            Server-selected. **Not** client-settable — model selection is a
            deployment concern, and a client that can pin a version can pin a
            stale or unevaluated one.
        calibration_version:
          type: string
          nullable: true
          example: mohler-val-2026-07-01
          description: |
            Identifier of the calibration artefact (temperature + threshold
            table) applied. NULL before E2 calibration exists. Correlates with
            the MLflow run.
        strictness_applied:
          $ref: "#/components/schemas/Strictness"
        threshold_applied:
          type: number
          format: float
          nullable: true
          description: |
            The numeric threshold the server actually used. Returned for audit
            and reproducibility — **not for display, and not for the SPA to
            re-implement thresholding against.** The verdict is already decided.
        target_fpr:
          type: number
          format: float
          nullable: true
          example: 0.01
          description: |
            False positive rate this threshold was calibrated to on the Mohler
            validation split. This is the number that belongs in an
            instructor-facing explanation of strictness, not `threshold_applied`.
        used_question_text:
          type: boolean
          description: |
            Whether `question_text` was actually fed to the detector for this
            check, as opposed to merely stored.

            Not cosmetic. Two checks carrying the same `model_version` are not
            comparable if one was scored on (question, answer) and the other on
            answer alone. Without this field, a history table silently mixes two
            different input compositions and E3's reliability analysis has no
            way to separate them after the fact.

    CheckCreateRequest:
      type: object
      required: [answer_text]
      additionalProperties:
        false # rejects instructor_id / threshold /
        # model_version with 400. Deliberate.
      properties:
        answer_text:
          type: string
          minLength: 10
          maxLength: 10000
          description: |
            The student answer. `minLength` is a hard usability floor, not the
            abstention boundary — short-but-real answers produce
            `verdict: uncertain`, not a 400. See the 400 response on
            `POST /api/checks`.

            `maxLength` is well above the detector's 128–256 token window;
            truncation policy for over-long input is a detector-adapter
            concern and MUST be reported via `truncated` on the result rather
            than silently applied.
        question_text:
          type: string
          maxLength: 2000
          nullable: true
          description: |
            The question the answer responds to.

            **Permanently optional in this schema, by design.** Whether the
            detector consumes it at inference is not yet decided, and the answer
            is not knowable until fine-tuning is underway. Rather than guess and
            revise, the requirement is expressed at **runtime**, not in the
            schema:

              `GET /api/detector` → `requires_question_text: boolean`

            The SPA reads that flag on bootstrap and renders this input as
            required or optional accordingly; the batch validator applies the
            same flag to the uploaded file's columns. Flipping the server-side
            answer is a config change and a redeploy — **not** a contract
            revision, not a frontend release, not a change to the CSV format
            instructors have already been taught.

            If the flag is true and this field is absent, the request is
            rejected with `400 question_text_required`. If the flag is false and
            the field is supplied, it is stored as display metadata and not sent
            to the detector — `detector.used_question_text` reports which
            actually happened, per result.

            > **To the ML team — the cheaper fix is on your side.** Fine-tuning
            > with *question dropout* (randomly masking the question on some
            > fraction of training examples) produces a model that scores
            > correctly with or without it. That makes `requires_question_text`
            > permanently false and removes the conditional entirely — one
            > training-time decision instead of a runtime branch carried by the
            > frontend, the batch validator, and the CSV format forever.
            > Strongly preferred if the training pipeline can accommodate it.
        external_ref:
          type: string
          maxLength: 128
          nullable: true
          description: |
            Opaque instructor-supplied correlation key — a gradebook row id,
            submission id, or student pseudonym. Stored, echoed back, never
            interpreted.

            Instructors grading in volume need to map results back to their own
            records; without this they are matching on answer text by eye.
            Becomes load-bearing in the batch module.

            MUST NOT be used to carry student names or identifiers the
            instructor would not otherwise store here — documented in the UI,
            not enforceable in the contract.
        strictness:
          $ref: "#/components/schemas/Strictness"
        retain_answer:
          type: boolean
          default: true
          description: |
            Whether `answer_text` is persisted on the checks row and visible in
            history.

            **Does not affect the rest of the row** — `actor_id`, `created_at`,
            `model_version`, and `verdict` are written unconditionally and are
            not client-controllable. See DECISION LOG [0.11.0].

            Renamed from the proposed `save_to_history` to make that boundary
            explicit at the call site.

    CheckResult:
      type: object
      required: [check_id, verdict, raw_score, detector, created_at, actor_id]
      description: |
        **Shared schema.** A single check and a batch result row are the same
        object — the SPA renders both with one component. Requires ML team
        sign-off before implementation begins.

        Field tiers, per the agreed degradation model. The SPA must render
        correctly with every Tier 2/3 field null:
          Tier 1 (always present): check_id, verdict, raw_score, detector,
                                   created_at, actor_id
          Tier 2 (nullable):       confidence, abstain_reason, truncated
          Tier 3 (removable UI):   explanation, spans
      properties:
        check_id:
          type: string
          format: uuid
          description: |
            Resource identifier. Distinct from `Error.request_id`, which is a
            log-correlation value — conflating them (as `inference_id` did)
            gives the system two identifier conventions and one ambiguous field.
        actor_id:
          type: string
          format: uuid
          description: |
            Who ran the check: the caller resolved from the session cookie
            at creation. Never accepted from the client — see `POST /api/checks`.
        batch_id:
          type: string
          format: uuid
          nullable: true
          description: NULL for single checks; set for rows produced by a batch.
        external_ref:
          type: string
          nullable: true
        verdict:
          $ref: "#/components/schemas/Verdict"
        raw_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.87
          description: |
            Normalised detector output. **Monotonically increasing in
            AI-likelihood, and NOT a probability.**

            Every detector adapter must satisfy this normalisation contract —
            without it, swapping in a zero-shot detector whose native score runs
            the other way (Binoculars) silently inverts the frontend.

            **MUST NOT be rendered as a percentage.** "0.87" shown as "87%
            likely AI-generated" is the exact wrongful-accusation failure mode
            in the project motivation. Retained in the response for the audit
            trail and for ML error analysis, not for instructor display.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            Calibrated probability (temperature scaling fitted on the Mohler
            validation split). Unlike `raw_score`, this is display-safe —
            preferably as a band rather than a bare number.

            NULL until E2 calibration lands. The SPA must handle NULL from day
            one; this field is the reason the tier system exists.
        abstain_reason:
          $ref: "#/components/schemas/AbstainReason"
        truncated:
          type: boolean
          nullable: true
          description: |
            True if `answer_text` exceeded the detector's context window and was
            truncated before scoring. Surfacing this matters — a verdict on a
            truncated answer is a verdict on a different text than the
            instructor submitted.
        detector:
          $ref: "#/components/schemas/DetectorInfo"
        answer_text:
          type: string
          nullable: true
          description: |
            NULL if `retain_answer` was false, or if the retention window has
            elapsed. Omitted from `CheckSummary` entirely.
        question_text:
          type: string
          nullable: true
        explanation:
          type: object
          nullable: true
          description: |
            **Tier 3.** NULL until the explanation spike promotes or kills the
            feature. Shape is deliberately unspecified — auxiliary interpretable
            signals (perplexity, length statistics, burstiness), not
            model-internal attribution.

            Present as a nullable field from v0 so that adding it is not a
            breaking revision. The SPA hides the module on NULL.
        spans:
          type: array
          nullable: true
          description: |
            **Tier 3 / E5.** Sentence- or span-level highlighting. NULL until
            E5. Same reasoning as `explanation` — declared now, so shipping it
            later costs the frontend nothing.
          items:
            type: object
            required: [start, end, score]
            properties:
              start:
                type: integer
                description: Character offset into `answer_text`, inclusive.
              end:
                type: integer
                description: Character offset into `answer_text`, exclusive.
              score: { type: number, format: float, minimum: 0, maximum: 1 }
        created_at:
          type: string
          format: date-time
        latency_ms:
          type: integer
          nullable: true
          description: |
            End-to-end detector latency. Operational signal — this is the number
            that tells you whether the synchronous single-check design survives
            the model chosen in E2.

    CheckSummary:
      type: object
      required:
        [check_id, verdict, raw_score, strictness_applied, created_at, actor_id]
      description: |
        History table row. A trimmed `CheckResult` — excludes `question_text`,
        `abstain_reason`, `truncated`, `calibration_version`,
        `threshold_applied`, `target_fpr`, `used_question_text`, `latency_ms`,
        `explanation`, and `spans`, none of which the history table renders.
        Drill down via `GET /api/checks/{id}` for the full record.

        `raw_score` and `strictness_applied` are flattened out of `detector`,
        same convention as `model_version`, rather than nesting a partial
        `DetectorInfo`. `batch_file_name` rides alongside `batch_id` for the
        same reload-survival reason. `answer_text` is intentionally full-text
        here, not a preview. See DECISION LOG [0.5.8] for all three.
      properties:
        check_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid, nullable: true }
        batch_file_name:
          type: string
          nullable: true
          description: |
            NULL for single checks. Carried here for the same reason as
            `raw_score`/`strictness_applied` — the history table names a batch
            from this field, and without it the name falls back to a generic
            placeholder the moment the batch is reloaded rather than freshly
            submitted. See DECISION LOG [0.5.8].
        external_ref: { type: string, nullable: true }
        verdict: { $ref: "#/components/schemas/Verdict" }
        raw_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Same normalisation contract as `CheckResult.raw_score` —
            monotonically increasing in AI-likelihood, NOT a probability, MUST
            NOT be rendered as a percentage.
        confidence: { type: number, format: float, nullable: true }
        strictness_applied:
          $ref: "#/components/schemas/Strictness"
        model_version: { type: string }
        answer_text:
          type: string
          nullable: true
          description: NULL if `retain_answer` was false. See DECISION LOG [0.5.8].
        created_at: { type: string, format: date-time }

    ColumnMapping:
      type: object
      description: |
        Maps the instructor's own CSV header names to our required fields.
        Keys are the instructor's literal header text; values are one of
        `external_ref`, `answer_text`, `question_text`. Omit `question_text`
        from the mapping if the file has no such column and
        `requires_question_text` is false.

        Applied server-side against the untouched original upload — never a
        client-side file rewrite (spec Decision 8), so the S3 object always
        matches what the instructor actually uploaded.
      additionalProperties:
        type: string
        enum: [external_ref, answer_text, question_text]

    UploadUrlRequest:
      type: object
      required: [file_name]
      additionalProperties: false
      properties:
        file_name:
          type: string
          maxLength: 255

    UploadUrlResponse:
      type: object
      required: [upload_url, upload_key]
      properties:
        upload_url:
          type: string
          description: Presigned S3 PUT URL. Expires in 15 minutes.
        upload_key:
          type: string
          description: Opaque S3 object key. Passed back on `POST /api/batches`.

    BatchCreateRequest:
      type: object
      required: [upload_key, file_name]
      additionalProperties: false
      properties:
        upload_key:
          type: string
          description: From `UploadUrlResponse.upload_key`.
        file_name:
          type: string
          maxLength: 255
        strictness:
          $ref: "#/components/schemas/Strictness"
        retain_answer:
          type: boolean
          default: true
          description: Same meaning as `CheckCreateRequest.retain_answer`, applied to every row.
        column_mapping:
          type: object
          nullable: true
          description: |
            Omit or null if the file already uses our column names
            (external_ref, answer_text, question_text).
          allOf:
            - $ref: "#/components/schemas/ColumnMapping"

    Batch:
      type: object
      required: [batch_id, actor_id, batch_file_name, created_at, row_total]
      description: |
        Job lifecycle/settings for one batch upload. See DECISION LOG
        [0.13.0] — a batch is a real row, not "checks sharing an id".
      properties:
        batch_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        batch_file_name: { type: string }
        strictness: { $ref: "#/components/schemas/Strictness" }
        created_at: { type: string, format: date-time }
        row_total:
          type: integer
          description: |
            Valid plus rejected rows at submission time (see `POST
            /api/batches` "Row rules") — not yet how many are scored. So
            `completed + failed + pending == row_total`.
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Null unless `POST /api/batches/{id}/cancel` was called. Set once,
            never cleared. See DECISION LOG [0.14.0].

    BatchProgress:
      type: object
      required: [batch, completed, failed, pending, row_total, cancelled, failures]
      description: |
        `completed + failed + pending == row_total` always holds. Computed on
        read from `checks`/`batch_row_failures`, not a stored counter (spec
        Decision 7 — polling only, no push, no separate write path to drift
        out of sync).
      properties:
        batch: { $ref: "#/components/schemas/Batch" }
        completed:
          type: integer
          description: Rows that produced a `checks` row.
        failed:
          type: integer
          description: |
            Rows in `batch_row_failures` — either failed pre-flight CSV
            validation, or exhausted SQS redelivery and were drained from the
            DLQ. Always equal to `failures.length`.
        pending:
          type: integer
          description: Rows not yet resolved either way.
        row_total: { type: integer }
        cancelled:
          type: boolean
          description: Same as `batch.cancelled_at is not None`, flattened out for the client.
        failures:
          type: array
          items: { $ref: "#/components/schemas/BatchRowFailure" }
          description: |
            The actual `batch_row_failures` rows for this batch, oldest first
            — the reason text an instructor acts on to fix and re-upload.
            `BatchRowFailure` was defined but never referenced by any endpoint
            until this — see DECISION LOG [0.16.0].

    BatchRowFailure:
      type: object
      required: [row_number, reason]
      properties:
        row_number:
          type: integer
          description: |
            Line in the uploaded file (first data row is `2`), or `0` when
            the failure is not tied to a line: a whole-file problem, a row
            that could not be enqueued, or a row skipped because the batch
            was cancelled. See `POST /api/batches`.
        external_ref: { type: string, nullable: true }
        reason: { type: string }

    DetectorCapabilities:
      type: object
      required:
        [
          model_version,
          requires_question_text,
          max_answer_chars,
          min_answer_chars,
          strictness_levels,
          supports_explanation,
          supports_spans,
        ]
      description: |
        What the currently served detector requires and provides. Server-owned,
        read-only, changes on deploy.

        Every field here is something the SPA would otherwise have to hardcode
        against an assumption that E2 has not yet settled. Hardcoded assumptions
        become breaking revisions; declared capabilities become config.
      properties:
        model_version:
          type: string
          example: roberta-base-detector-v0
        requires_question_text:
          type: boolean
          description: |
            When true, `question_text` is mandatory on `POST /api/checks` and
            must be present as a column in batch uploads; omitting it is
            `400 question_text_required`.

            When false, the field is accepted and stored but not scored.

            **The schema does not change either way.** This flag is the entire
            mechanism — see the `question_text` description on
            `CheckCreateRequest`.
        min_answer_chars:
          type: integer
          example: 10
          description: Hard validation floor. Below this is a 400, not an abstention.
        max_answer_chars:
          type: integer
          example: 10000
        max_tokens_scored:
          type: integer
          nullable: true
          example: 256
          description: |
            Detector context window. Input beyond this is truncated and reported
            via `CheckResult.truncated`. Lets the SPA warn *before* submission
            rather than explain after.
        strictness_levels:
          type: array
          description: |
            Available strictness levels and the FPR each is calibrated to.
            Driving the slider from this rather than a hardcoded list means E2's
            calibration results can change the operating points without a
            frontend release — and means the UI can show the instructor what
            "strict" actually costs.
          items:
            type: object
            required: [level]
            properties:
              level: { $ref: "#/components/schemas/Strictness" }
              target_fpr:
                type: number
                format: float
                nullable: true
                description: NULL before E2 calibration exists.
        calibration_version:
          type: string
          nullable: true
        supports_confidence:
          type: boolean
          description: |
            False until temperature scaling lands. When false, the SPA hides
            confidence display entirely rather than rendering a null.
        supports_explanation:
          type: boolean
          description: Tier 3. False until the explanation spike promotes the feature.
        supports_spans:
          type: boolean
          description: Tier 3 / E5.

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code. Safe to branch on.
          # The login-rejection codes (`not_provisioned`, `deactivated`,
          # `deleted`) are not here: they only ever travel as
          # `/login?error=<code>` redirects from `/api/auth/callback`, never
          # in a response body. See DECISION LOG [0.23.0].
          enum:
            - invalid_request # 400 — malformed body, unknown/missing field,
              # wrong type, out-of-range query parameter, bad cursor
            - not_signed_in # 401 — no session cookie sent (auth)
            - session_unknown # 401 — cookie matches no session (auth)
            - session_revoked # 401 — signed out, or revoked by an
              # admin action or status change (auth)
            - session_expired # 401 — 30-minute idle limit passed (auth)
            - session_ended # 401 — 4-hour absolute cap reached (auth)
            - account_deactivated # 401 — account is no longer `active` (auth)
            - forbidden # 403 — valid session, function-level refusal (users),
              # or a cross-site state-changing request (CSRF check)
            - not_found # 404 — absent, or not visible to this caller
            - conflict # 409 — duplicate email, illegal status transition,
              # or a teaching assistant that cannot be added (users)
            - payload_too_large # 413 — answer_text over 10,000 chars (checks)
            - question_text_required # 400 — served detector scores on
              # (question, answer) pairs and question_text
              # was omitted. See GET /api/detector. (checks)
            - upstream_idp_error # 502 — an Auth0 Management API call
              # failed; nothing was saved (users)
            - detector_unavailable # 503 — detector service down (checks)
            - detector_timeout # 504 — detector exceeded 10s budget (checks)
            - internal_error # 500 — unhandled; details only in the logs
        message:
          type: string
          description: |
            Human-readable and safe to show. Never interpolates unsanitised
            upstream input (notably Auth0's `error_description`) or submitted
            values: a validation message names the field and the rule, never
            what was sent, since that may be a student answer.
        request_id:
          type: string
          description: Correlates with CloudWatch logs.

  responses:
    BadRequest:
      description: |
        Malformed or invalid request — `invalid_request`. Includes schema
        validation (unknown field under `additionalProperties: false`,
        missing required field, wrong type, enum mismatch, out-of-range
        query parameter): this API returns `400` for all of them, never
        `422`. See DECISION LOG [0.23.0].
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Unauthorized:
      description: |
        No session, or the session is unknown, revoked, idle-expired, past
        its absolute cap, or belongs to an account that is no longer
        `active`. Emitted by the app's session check (`get_current_session`)
        before the route body runs; `error` names which (`not_signed_in`,
        `session_unknown`, `session_revoked`, `session_expired`,
        `session_ended`, `account_deactivated`) so the login page can say
        why.

        If an API Gateway is ever put in front (see
        `x-gateway-configuration`), its own 401 template MUST emit this same
        `Error` schema, or the SPA receives two differently shaped 401s.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Forbidden:
      description: |
        Valid session, but the user's role does not permit this operation.
        Emitted by the **users module**, inside application code — never by the
        gateway. See DECISION LOG [0.3.0].

        Any `POST`/`PUT`/`PATCH`/`DELETE` can also get `403 forbidden`
        ("Cross-site request refused.") from the CSRF check, before
        authentication — see "CSRF" in `info.description`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotFound:
      description: |
        Resource does not exist, or is not visible to this actor.

        The conflation is deliberate for object-scoped resources (checks):
        returning `403` for "exists but belongs to another instructor" turns
        the endpoint into an oracle for whether a colleague has already checked
        a given submission. Function-level denials still return `403` — the
        caller's role is not secret; other people's records are.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

# =============================================================================
# DECISION LOG
#
# [0.25.0] The app checks every request itself; CSRF is enforced by origin.
#
#   1. SESSION CHECK IN THE APP, ALWAYS.
#   PROBLEM. `x-gateway-configuration` told the app to trust a
#   gateway-set `X-PP-User-Id` header and skip the cookie lookup ([0.5.3]).
#   That shipped as a full authentication bypass: outside `dev`, the header
#   alone was accepted with no cookie and no session lookup, and nginx
#   forwarded it from the client untouched, so any user id was a login as
#   that user. The code removed it
#   (`test_identity_header_alone_does_not_authenticate`); the contract still
#   described it, and anyone building the gateway from that text would
#   have brought the hole back.
#   DECISION. The session cookie is checked on every protected request by
#   the `Depends()` chain (`get_current_session` -> `get_current_user` ->
#   `require_role`), gateway or not, and no identity header is trusted.
#   `x-gateway-configuration` is marked TARGET DESIGN, NOT DEPLOYED; a
#   gateway, if built, is an outer filter only. Cost: one indexed session
#   query per request — accepted.
#   OPTION REJECTED. Trust the header behind a security-group rule — its
#   safety depends on every hop in front of the app being configured
#   right, forever, to save one query.
#
#   2. CSRF: FETCH METADATA + ORIGIN, FAIL CLOSED, IN THE APP.
#   PROBLEM. The contract's CSRF defence was a mandatory `X-PP-Client`
#   header checked by the gateway authorizer. No gateway exists, the SPA
#   never sent it and nothing checked it, so `SameSite=Strict` was the only
#   defence — which the contract itself called insufficient, since every
#   `*.smu.edu.sg` host is same-site and a subdomain takeover anywhere in
#   the university's DNS could forge requests carrying the cookie.
#   DECISION. App middleware checks every POST/PUT/PATCH/DELETE:
#   `Sec-Fetch-Site` must be `same-origin` or `none`; without it, `Origin`
#   must equal `FRONTEND_URL`'s origin; with neither, the request is
#   refused. Refusal is `403 forbidden`. `same-site` is deliberately
#   refused — it is exactly the subdomain threat. Non-browser clients send
#   `Sec-Fetch-Site: same-origin`, harmless since they hold no victim's
#   cookie. The SPA and API share one origin (relative `/api` paths, no
#   CORS), so every legitimate browser request passes unchanged. This is
#   the OWASP CSRF Prevention Cheat Sheet's Fetch Metadata defence, which
#   it lists as a primary defence and for which it recommends failing
#   closed when the headers are absent on sensitive endpoints. Go 1.25's
#   `net/http.CrossOriginProtection` uses the same algorithm but lets
#   header-less requests through; this API does not.
#   OPTIONS REJECTED. (a) The `X-PP-Client` custom header — a native form
#   POST cannot set headers, so it breaks `SignOutForm.tsx`'s logout (a
#   form on purpose: the full navigation discards the query cache); it is
#   only as strong as the CORS policy stays strict; and it was never
#   enforced. (b) Synchronizer or double-submit tokens — server state or a
#   second cookie plus SPA plumbing, for no added protection on a
#   same-origin SPA; FastAPI has no built-in to lean on.
#
#   3. ABSTENTION RULE DOCUMENTED AS PROVISIONAL. `AbstainReason` now
#   states the rule the code serves (fewer than 10 words; score within
#   0.08 of the strictness threshold). The OPEN note stays: the ML team
#   still owns the final rule, and the numbers are not contract.
#
#   4. /api/admin/sessions REMOVED. Specified since 0.4.0, never built.
#   Its case — "the only way to end access inside the 4-hour cap" — no
#   longer holds: deactivating, deleting or changing the role of a user
#   revokes their sessions in the same commit, and the session check
#   refuses any account that is not `active`. A root_admin ends someone's
#   access from the users screen. Per-device revocation has no use case.
#
#   5. CATCH-UP, NO BEHAVIOUR CHANGE. `GET /api/auth/me` (with `probe`)
#   replaces the unserved `GET /api/auth/session`; the cookie is
#   `__Host-session`; /api/auth/login's `login_hint` and
#   `force_account_chooser` are documented; `GET /api/detector/status` is
#   defined; `auth0_sub` is set at provisioning, not first login; root_admin
#   is seeded by the `scripts.provision_user` CLI, not a migration; batch
#   cancel purges queued messages, so `pending` can stay above 0 and
#   `cancelled` is terminal; `row_total` counts rejected rows; the CSV row
#   rules and the 500-row cap are listed; the data-model block, still
#   Entra-era, is replaced by a pointer to the models and migrations.
#
# [0.24.0] Three places where the code was right and the contract was not.
#
#   PROBLEM. An audit of the contract against the code found three
#   sections that described behaviour the code had deliberately not built.
#   In each, the code's behaviour holds up better than the text.
#
#   1. GET /api/users, instructor `role` filter. The contract said a `role`
#      outside an instructor's scope returns an empty page, citing the
#      filter-vs-create asymmetry. The code returns `403`, deliberately
#      (`test_instructor_role_filter_outside_scope_is_refused`). The
#      asymmetry exists to stop a filter confirming that a *record*
#      exists — `actor_id` names one. A `role` value names none: the `403`
#      is a function of the caller's role and the value asked for, so
#      nothing is enumerable. The empty page had a real cost: it reads as
#      "no such users" and hides a scoping mistake.
#      DECISION: document the `403`. The silent override stays the rule
#      for id-valued filters; it is not a rule for every filter.
#
#   2. POST /api/batches with no valid row. The contract said `400
#      no_valid_rows`. The code returns `202` with one `batch_row_failures`
#      row per row; its `no_valid_rows` branch tested `row_total == 0`,
#      which never happens — an empty file or missing column is itself
#      recorded as a row-0 failure. A `400` would replace every per-row
#      reason with one message, which is the information the instructor
#      needs to fix the file. DECISION: document the `202`, delete the dead
#      branch, remove `no_valid_rows` from `Error.error`.
#
#   3. /api/auth/callback. The contract said `302`, `403` on a `state`
#      mismatch and `502` when Auth0 fails, and offered a `returnTo` deep
#      link on /api/auth/login. The code answers every outcome with a
#      `303` to the SPA, `/login?error=<code>` on failure, and has no
#      `returnTo`. A JSON error on a top-level navigation strands the user
#      on a raw page; the login screen can explain the failure. `returnTo`
#      was never implemented and nothing sends it; documenting an
#      unvalidated redirect parameter invites building it carelessly.
#      DECISION: document the redirects and their codes; remove `returnTo`,
#      keeping its validation rule in the login description for whoever
#      adds it.
#
#   OPTIONS REJECTED. Changing the code to match the text in each case —
#   for (1) and (2) it makes the product worse, for (3) it adds an open-
#   redirect surface no screen needs.
#
#   Found while documenting (3), and fixed in the same version: an
#   unreachable Auth0, or one answering a `5xx` page rather than an OAuth
#   error, raised an `httpx.HTTPError` the callback did not catch, so the
#   browser landed on a `500` JSON body. It now gets the
#   `sign_in_failed` redirect like every other failure.
#
# [0.23.0] One error shape; validation is 400, not 422.
#
#   PROBLEM. Three error bodies were in use: `Error` (POST /api/checks only,
#   hand-built in that route), FastAPI's `{"detail": "..."}` everywhere
#   else, and `{"detail": {code, message}}` on 401. The contract documented
#   only `Error`, and the SPA's error parser had to read all three.
#   Separately, schema validation returned FastAPI's default `422` while
#   every hand-written input check returned `400` — two statuses for one
#   class of failure — and the contract's "an unknown field is a hard 400"
#   (`CheckCreateRequest`, [0.5.0]) was not true on the wire.
#
#   DECISION. Exception handlers registered once on the app
#   (`exceptions/handlers.py`) turn every `HTTPException` and
#   `RequestValidationError` into an `Error`; `RequestIdMiddleware` does the
#   same for an unhandled exception (`500 internal_error`), there rather
#   than in a handler so the response still carries its `request_id`. A
#   route that needs a specific code raises `HTTPException` with
#   `detail={"code", "message"}` — the convention the 401 path already
#   used; otherwise the code follows from the status. Validation is
#   `400 invalid_request`. Its `message` lists each failing field and rule
#   and never the submitted value. No per-field array: the SPA validates
#   before sending, so this layer is defence in depth and a readable
#   message is enough.
#
#   Codes no response body ever carried are removed from the enum:
#   `unauthenticated` (replaced by the six specific 401 codes the session
#   check actually returns), `state_mismatch` (the callback redirects on a
#   state failure; see its own section), and the three login-rejection
#   codes, which are redirect parameters, not bodies.
#
#   OPTIONS REJECTED. (a) Document the three shapes — writes an accident
#   into the contract, and the future gateway's 401 template would have to
#   copy it. (b) RFC 9457 Problem Details — the formal standard, but a
#   format change on both sides with one client and no consumer gaining
#   anything; mapping `Error` onto it later is mechanical. (c) `422` for all
#   validation — would move every hand-written check and the contract for
#   no gain over matching what they already did.
#
#   No SPA change was needed: its parser already read `error`/`message`.
#
# [0.22.0] No active supervisor, no session.
#
#   PROBLEM. [0.21.0] revoked a TA's sessions only when their last link was
#   ended directly (`DELETE .../supervisors/{instructor_id}`). Three other
#   writes leave a TA with no active supervisor and revoked nothing:
#   deleting their instructor and changing their instructor's role (both
#   end the links), and deactivating their instructor (links kept, but a
#   deactivated instructor stops counting). The TA kept a live session that
#   `require_screening_access` refused on every screening call.
#
#   DECISION. One rule: whenever a write can remove a TA's last active
#   supervisor (an active link to an `active` instructor), that TA's live
#   sessions are revoked in the same commit. Applies to all four writes,
#   including deactivation — reactivating the instructor restores the links
#   but not the sessions; the TA signs in again. Not a security fix: the
#   screening gate already reads the database per request. It keeps one
#   rule instead of four, and sends the SPA through the existing
#   `session_revoked` sign-in path instead of leaving it on screening
#   screens that 403. Signing in is unchanged: a TA with no supervisor may
#   sign in and sees the unassigned notice.
#
#   OPTION REJECTED. Keep the session and have the SPA refetch
#   `/api/auth/me` on the "not assigned" 403 — frontend work, a special
#   case for one error message, and a second rule next to [0.21.0]'s.
#
#   ACCEPTED EDGES. A link committed concurrently with the revoking write
#   can leave a now-supervised TA signed out (one extra sign-in).
#   The reverse race is accepted too: two removals committed concurrently
#   (e.g. one instructor deleted while the TA's other instructor is
#   deactivated) each still see the other supervisor, so neither signs the
#   TA out. The per-request screening gate still returns 403, so this
#   leaves a stale session, not access. Batches already submitted still
#   finish; they were authorised when submitted.
#   The SPA treats a 401 as signed out only on its session query, so a TA
#   mid-screen sees one inline error until that query refetches (30 s
#   stale time, window focus, or the expiry timer) — the same delay as an
#   admin deactivating them. A global 401 handler is a separate change.
#
# [0.21.0] Supervision is a many-to-many table; instructors add TAs by email.
#
#   PROBLEM. [0.5.6] made `provisioned_by` the only supervision edge, doing
#   two jobs: provenance (who invited) and management right (who
#   supervises). Consequences found while planning the TA workflow: a TA can
#   have exactly one supervisor, so two instructors cannot share one; moving
#   a TA overwrote who invited them; and a TA released by their instructor
#   (`provisioned_by = NULL`) could sign in but not screen, and only the
#   single `root_admin` could ever place them again — no instructor could
#   pick them up. [0.5.6] itself said to revisit "if an assistant genuinely
#   needs to be shared". Not a sponsor requirement; changed to match how
#   instructors, TAs and the course admin actually work.
#
#   OPTIONS CONSIDERED. (a) Keep the column, add an unassigned-pool screen
#   instructors can claim from. Rejected: still one supervisor, and a second
#   surface to build. (b) A `courses` (and term) entity that TAs and
#   instructors join. Rejected for now as too much new surface for one
#   backend engineer; it is the natural next step if end-of-term cleanup
#   becomes a pain. (c) A `supervisions` join table (chosen).
#
#   DECISION.
#     - `supervisions(ta_id, instructor_id, created_at, created_by,
#       ended_at, ended_by)`, unique on the pair while `ended_at IS NULL`.
#       Rows are ended, never deleted, so the table is its own history (same
#       per-domain approach as [0.11.0]). Migration backfills one active link
#       per TA with a non-null `provisioned_by`.
#     - `provisioned_by` becomes provenance only: set once, never changed,
#       grants nothing. Every authorization and list scope that read it now
#       reads "has an active link to an active instructor". This REVERSES
#       [0.5.6]'s "for an assistant the column means supervisor".
#     - `User.supervisor_ids` exposes the active links, so the SPA's
#       screening gate reads `supervisor_ids` instead of `provisioned_by`.
#     - `root_admin` is the course admin. No new role.
#     - `POST /api/users` keeps an optional `supervisor_id`: account,
#       invite and first link commit together, so the admin's one-step
#       "create a TA under X" never leaves an unassigned TA behind a failed
#       second call.
#
#   ADD BY EMAIL (create-or-link). Instructors get one action,
#   `POST /api/users/teaching-assistants {email}`: a new email is
#   provisioned and invited; an active TA is linked (whoever else supervises
#   them); anything else is refused. This replaces instructors' use of
#   `POST /api/users`, which becomes `root_admin` only, and removes the need
#   for an unassigned-pool screen: a released TA is picked up by typing
#   their email. A deleted email is not re-provisioned here — reusing a
#   deleted account stays a `root_admin` decision ([0.18.0]).
#
#   ENUMERATION. The response is generalised: every success is the same
#   `200`, every refusal the same `409` with a fixed message ("contact the
#   root administrator"); the real reason is logged server-side. Residual
#   leaks, accepted: a fresh email always succeeds and an existing
#   non-addable one always fails (one bit: "some account I cannot add"), and
#   the resulting row's pending/active state is visible on the caller's
#   team. Hiding the first needs refusals to become admin-approval requests,
#   which needs the notification system below. Probing is also self-limiting
#   — each fresh email creates a real account and sends a real invite, under
#   the prober's name. The caller is authenticated staff. No server-side
#   confirmation step: showing "this is Sarah Tan, confirm?" would itself be
#   the oracle. The SPA instead asks the caller to re-confirm the email they
#   typed, which catches typos and reveals nothing.
#
#   DEACTIVATION. With shared TAs, an instructor's deactivate would lock a
#   TA out of every team, and anyone can now add themselves to any active
#   TA. So `/deactivate` and `/reactivate` are `root_admin` only;
#   instructors end their own link (`DELETE .../supervisors/{me}`, "Remove
#   from team"). Ending a TA's last link revokes their sessions, as
#   unassigning did in [0.5.6]. Delete and role change end all links;
#   deactivation keeps them (reactivating restores the same teams), and a
#   deactivated instructor's links stop counting until reactivation.
#
#   DISPLAY NAME. Whoever provisions an account no longer types a name; the
#   person chooses it at first sign-in and may change it later
#   (`PATCH /api/users/{id}`, self or `root_admin`). This also removes the
#   risk of a linking instructor overwriting a shared TA's name. The first-
#   sign-in prompt is SPA-only; nothing server-side gates on a null name.
#   Self-rename UI is low priority; the endpoint allows it from day one.
#   The name is shown to other users, so it is normalised like
#   `StatusChangeRequest.reason` ([0.20.0]).
#
#   DEFERRED — NOTIFICATIONS. Linking a TA someone else supervises should
#   notify that instructor and `root_admin`. There is no notification
#   infrastructure; nothing is sent until there is. Wire it in when that
#   system exists (it is also wanted for scan/batch-completion alerts).
#
#   CHECKS UNCHANGED. A TA's checks are still attributed to the TA
#   (`actor_id`) and readable only by the TA (and `root_admin`). Supervisors
#   do not see their TAs' history; that is a separate decision.
#
#   CONTRACT DRIFT NOTED, NOT FIXED HERE. The shipped API serves
#   `GET /api/auth/me`; the auth section still documents
#   `GET /api/auth/session` + `GET /api/users/me`. As of 0.21.0 its body is
#   `{id, email, display_name, role, supervisor_ids, session}` — `id` so the
#   SPA can `PATCH /api/users/{id}` its own name, `display_name` for the
#   first-sign-in prompt, `supervisor_ids` (replacing `provisioned_by`) for
#   the screening gate. The auth-section rewrite is its own entry — done in
#   [0.25.0].
#
# [0.20.0] Status-change reasons are normalised; pending accounts are not special-cased.
#
#   REASON. `reason` is free text that reaches an audit table with no
#   server-side hygiene, relying on every future renderer to escape it. It
#   is now trimmed, stripped of control characters and `<`/`>`, and stored
#   as null if nothing is left. Output encoding at render time remains the
#   actual XSS defence; this only keeps markup out of the audit record.
#   Stripping (rather than rejecting) so a paste never blocks a
#   deactivation.
#
#   PENDING. A guard refusing an instructor's deactivate of a pending TA
#   (409) was added and then removed in the same revision. Deactivation is
#   reversible and leaves the Auth0 credential and invite untouched, so a
#   pending row is no riskier to pause than any other, and an instructor
#   needs it to cancel a mistyped invite. Resend-invite stays alongside it.
#   Pending is display-only ([0.19.0]) and gates only `resend-invite`.
#
# [0.19.0] "Pending" is a stored fact (`first_login_at`), and invites can be re-sent.
#
#   PROBLEM. [0.18.0] recorded that "invite sent, never signed in" was not
#   modelled. An admin could not tell a new invitee from a long-time user,
#   and an invitee who lost the email had to be deleted and re-provisioned.
#
#   OPTIONS CONSIDERED. (a) Derive "never signed in" from the `sessions`
#   table (no session row ever). Rejected: it silently breaks the day a
#   session-purge job exists (see the append-only note in the sessions
#   design) and adds a join to every list query. (b) A `pending` value on
#   `UserStatus`. Rejected: pending is orthogonal to active/deactivated
#   (a deactivated invitee is still one who never signed in) and would add
#   states to a machine whose transitions are already audited. (c) A
#   nullable `first_login_at` column (chosen).
#
#   DECISION. `users.first_login_at`, null until the first successful
#   callback stamps it; never updated again. A migration backfills it from
#   each existing user's earliest session so no current user shows as
#   pending. Re-provisioning a deleted email resets it to null (a new
#   credential is a new invite). "Pending" is display-only:
#   `status == active && first_login_at == null`.
#
#   RESEND. `POST /api/users/{id}/resend-invite` re-triggers Auth0's
#   password-set email for the existing credential. It is a command, not an
#   edit, and changes no local state, so it writes no `UserStatusEvent`.
#   Bulk resend and automatic reminders are out of scope.
#
# [0.18.0] Users lifecycle is a three-state `status`; the contract now says so.
#
#   PROBLEM. The contract still described [0.4.0]'s design — a `deleted_at`
#   timestamp, `first_login_at`, and `POST .../restore` — while the shipped
#   API (`explicit account lifecycle management`) uses `status` and separate
#   deactivate / reactivate / delete transitions. Anyone building a client
#   from the document would call an endpoint that does not exist and read
#   fields that are not returned.
#
#   DECISION. Document what shipped. [0.4.0]'s "Deletion is a timestamp, not
#   a status enum" is superseded: pausing an account (reversible) and
#   deleting it (terminal) are different acts with different authority, and
#   a nullable timestamp could not express both. Email uniqueness is a
#   partial index over rows whose `status <> 'deleted'`, which is what lets
#   a deleted address be provisioned again (the row is reused, with a
#   `deleted → active` event). `UserStatusEvent` is the audit trail for
#   every transition.
#
#   DELETE AUTHORITY. [0.5.4] extended delete to the instructor delegation
#   chain. That is narrowed: delete is `root_admin` only. It is terminal and
#   removes the Auth0 credential, so it needs more than the reversible
#   deactivation an instructor already has over their own assistants (plus
#   unassigning them, [0.5.6]). Backed by
#   `test_delete_endpoint_is_refused_to_an_instructor`.
#
#   NOT MODELLED. "Invite sent, never signed in" is not stored: there is no
#   `first_login_at`. Provisioning binds the Auth0 `sub` up front, so the
#   callback matches on `sub` rather than on first-login email. A pending
#   state needs its own column and is left for a later entry.
#
# [0.17.0] Provisioning replaces a stale Auth0 credential instead of failing.
#
#   PROBLEM. `POST /api/users` always asked Auth0 to create a credential.
#   For an email that already had one in Auth0 but no live local row (a
#   row deleted while the Auth0 delete failed, an account made by hand in
#   the dashboard, or a developer's earlier seed), Auth0 answers `409`,
#   which surfaced as `502 "Could not create an Auth0 credential"` — an
#   admin could not provision that person at all, and had no Auth0 access
#   to clear it.
#
#   OPTIONS CONSIDERED. (a) Return `409` and ask the admin to clean up
#   Auth0 by hand. Rejected: admins have no Auth0 access by design. (b)
#   Adopt the existing credential (bind its `sub`, reuse `scripts.
#   provision_user`'s behaviour). Rejected: its password is known to
#   whoever set it — a previous holder of a recycled address, or whoever
#   the failed delete left it with — and that password would now open the
#   new account. Emailing a reset link does not invalidate it. (c) Replace
#   it (chosen).
#
#   DECISION. If Auth0's Database connection holds a credential for the
#   email (and, checked earlier, no live local row does), delete it, then
#   create and invite exactly as for a new email. The new credential has a
#   new `sub` and a random password nobody knows. If the delete fails,
#   nothing is created (`502`). If the local commit later fails, the
#   credential just created is removed, as before. Response unchanged.
#   `scripts.provision_user` still adopts, because the operator running it
#   is the tenant owner seeding their own root admin.
#
# [0.16.0] BatchProgress now returns the actual failure reasons, not just a count.
#
#   PROBLEM. `BatchRowFailure` (row_number, external_ref, reason) has existed
#   in this contract since [0.13.0], but no endpoint ever referenced it —
#   `BatchProgress.failed` was an integer count only. The backend faithfully
#   records why every row failed (pre-flight CSV validation, an SQS enqueue
#   error, cancellation, or exhausted DLQ retries) in plain, instructor-
#   actionable language ("answer_text is under 10 characters."), but none of
#   it ever reached the instructor. An instructor whose upload had bad rows
#   saw only "3 failed" with no way to find or fix them short of re-deriving
#   the CSV's own validation rules by trial and error.
#
#   OPTIONS CONSIDERED. (a) Treat `batch_row_failures` as audit-only, the
#   same posture as `UserStatusEvent`/`UserRoleEvent` — never surface it,
#   keep it for later investigation only. Rejected: those two tables record
#   administrative history nobody needs in the moment; a batch's own row
#   failures are direct, immediate feedback on the task the instructor just
#   ran, and the existing frontend (`BatchResultsTable`'s failure banner,
#   `serializeResultsCsv`'s failure lines) was already built expecting this
#   data, wired to a field the backend never populated. (b) A separate
#   `GET /api/batches/{id}/failures` endpoint. Rejected — `BatchProgress` is
#   already the one thing polled for a batch's state, and a batch's row
#   count ceiling (500) keeps the failure list small enough to return inline
#   without pagination.
#
#   DECISION. `BatchProgress.failures` is now a required array of
#   `BatchRowFailure`, oldest first, sourced from the same query that used
#   to only take `COUNT(*)`. `failed` is kept as a separate field (always
#   equal to `failures.length`) rather than removed, since existing callers
#   read it as a plain integer. No new endpoint, no new polling.
#
# [0.15.0] Batch cancellation now actively drains the queue too.
#
#   PROBLEM. [0.14.0] deliberately chose not to touch SQS on cancel, relying
#   on the Worker's one-at-a-time poll loop to eventually reach and skip a
#   cancelled batch's messages. In practice, a shared queue accumulates
#   leftover messages from every batch ever submitted (cancelled or not —
#   a cancelled batch's own un-reached rows never leave the queue under
#   [0.14.0], they just get converted to failures once reached). Repeated
#   test submissions during development produced a queue backlog in the
#   hundreds, and a *newly submitted, non-cancelled* batch got stuck showing
#   no progress for several minutes waiting behind it — not a bug in the
#   scoring path, but a real instructor-facing symptom ("it's stuck and
#   doesn't say why") that [0.14.0]'s design does nothing to prevent, and
#   cancelling more aggressively is the direct way to stop it from getting
#   worse with every cancelled run.
#
#   OPTIONS CONSIDERED. (a) A per-batch SQS queue, deleted wholesale on
#   cancel via the queue's own PurgeQueue. Rejected — dynamic queue
#   creation/teardown per batch is a real infra change (creation latency,
#   cleanup of finished queues, account queue limits) for a problem that
#   doesn't need it. (b) Leave [0.14.0] as-is and only reduce the backlog by
#   processing messages in larger SQS batches (10 at a time) generally.
#   Rejected on its own — helps throughput but does nothing to stop a
#   cancelled batch's messages from sitting in the queue at all, which is
#   the actual complaint.
#
#   DECISION. Cancel still sets `cancelled_at` first (unchanged from
#   [0.14.0], and still what the Worker's per-message check relies on as
#   the correctness backstop). It then actively drains: receive up to 10
#   messages at a time from the queue and delete the ones whose `batch_id`
#   matches. A message for a *different* batch is left completely alone —
#   not deleted, not touched — so it simply sits invisible for the queue's
#   normal VisibilityTimeout before becoming receivable again, same as any
#   other in-flight message. Bounded by a fixed iteration cap rather than
#   looping until the queue is provably empty — SQS's
#   `ApproximateNumberOfMessages` is, as the name says, approximate, and an
#   uncapped loop against a queue full of other instructors' messages would
#   turn a single cancel request into an unbounded scan. Anything left
#   behind when the cap is hit still gets skipped by the Worker's existing
#   per-message `cancelled_at` check — this is a best-effort optimization
#   layered on top of [0.14.0]'s correctness guarantee, not a replacement
#   for it. SQS still has no native "delete all messages matching X"
#   primitive, so this is a receive/inspect/delete-if-match loop, not a
#   real filtered purge.
#
#   CAUGHT DURING IMPLEMENTATION. The first version of this loop called
#   `ChangeMessageVisibility(VisibilityTimeout=0)` on a non-matching message
#   to put it back as visible immediately, reasoning that otherwise it
#   would sit invisible for up to 30s. That was wrong: releasing it this
#   way let the *same* drain loop's next iteration immediately receive it
#   again, and a handful of iterations of that was enough to trip the
#   queue's `maxReceiveCount: 3` redrive policy — SQS/LocalStack then
#   silently routed it to the DLQ as if it had failed processing 3 times,
#   even though nothing was ever wrong with it. Verified against real
#   LocalStack: cancelling one batch was exiling *other* batches' good rows
#   to the DLQ. Fixed by not touching non-matches at all — a message this
#   loop doesn't delete is simply left as-is.
#
# [0.14.0] Batch cancellation: a flag the Worker checks, not a queue purge.
#
#   SUPERSEDED by [0.15.0]: cancel now also drains the batch's own queued
#   messages. The Worker's `cancelled_at` check below remains the backstop.
#
#   PROBLEM. There was no way to stop a batch mid-run — noticed while
#   fixing the SPA not being able to find/resume an in-progress batch across
#   a refresh. A large upload (up to 500 rows) can take a while, and the
#   instructor has no way to back out of a bad upload (wrong file, wrong
#   strictness) without waiting it out.
#
#   OPTIONS CONSIDERED. (a) Delete/purge the batch's messages from SQS.
#   Rejected — SQS has no "delete all messages matching X" primitive; doing
#   this for real would mean receiving and re-hiding every message in the
#   queue to inspect it, which is both slow and racy against the Worker
#   already processing some of them. (b) A stored, actively-recomputed
#   "pending" counter the cancel endpoint could zero out. Rejected — batches'
#   own module comment already committed to progress being computed, not
#   stored, specifically to avoid a second write path drifting out of sync
#   (spec Decision 2/7); a cancel counter would reintroduce exactly that.
#
#   DECISION. `batches.cancelled_at`, set once and never cleared. The Worker
#   checks it per in-flight message, before calling the detector, and if
#   set records a `batch_row_failures` row ("Batch cancelled by instructor.")
#   instead of scoring. Already-completed rows are untouched. `pending`
#   drains to 0 within a few poll cycles as the Worker works through
#   whatever was still queued — not instant, but bounded by the same queue
#   depth a normal completion would take, and requires no new SQS
#   capability. `BatchProgress.cancelled` is derived
#   (`cancelled_at is not None`), matching the "computed, not stored twice"
#   rule the rest of the module already follows.
#
# [0.13.0] Batches module: real batches table, not "rows sharing an id".
#
#   PROBLEM. The pre-existing `checks.batch_id` comment ("There is no
#   batches table: a batch is these rows sharing an id") assumed a batch was
#   only ever a completed set of Check rows. The batches module needs
#   progress polling before any row is scored, and per-upload settings
#   (strictness, retain_answer, column mapping) that don't belong on
#   individual Check rows.
#
#   DECISION. Added `batches` (job lifecycle/settings) and
#   `batch_row_failures` (CSV-validation failures, same append-only shape as
#   user_status_events/user_role_events). `checks` rows stay write-once —
#   never created pending, only once a result exists. `batch_id`/
#   `batch_file_name` are removed as client-settable fields on
#   `CheckCreateRequest`; only the Worker sets a Check's `batch_id` now,
#   consistent with `actor_id` never being client-supplied. See
#   docs/superpowers/specs/2026-09-09-batches-module-design.md for the full
#   reasoning.
#
# [0.12.0] Implemented `PATCH /api/users/{id}/role`'s audit trail.
#
#   `user_role_events` (alembic 0009_user_role_events) mirrors
#   `user_status_events`'s shape exactly: id, user_id, actor_id, from_role,
#   to_role, created_at. No `reason` column - the endpoint's request body
#   never carried one, unlike the status transitions' optional free-text
#   note, so there was nothing to persist.
#
#   `change_user_role` (users_service.py) is root_admin-only per
#   `require_role` at the route, and separately rejects a target whose
#   *current* role is root_admin - the request schema (`UserRolePatchRequest`,
#   `Literal[instructor, teaching_assistant]`) already makes root_admin
#   impossible as the *new* role, so only the existing-role side needs a
#   runtime check. No row lock like `_transition`'s: unlike status, every
#   role transition between instructor/teaching_assistant is valid from every
#   other one, so there is no invariant a race could violate - the worst
#   case is a benign lost update between two admins editing the same row at
#   once.
#
# [0.11.0] Dropped the planned `audit` module; no separate audit store.
#
#   PROBLEM. The module TODO list carried `[ ] audit — audit log retrieval`,
#   and the checks module's own text (info.description's service-boundary
#   diagram, the `checks` tag description, `POST /api/checks`, and
#   `CheckCreateRequest.retain_answer`) described a per-check "audit
#   table"/"audit entry" written unconditionally alongside the checks row,
#   holding actor_id/timestamp/model_version/verdict. No such second table
#   was ever implemented, and on inspection it would have been pure
#   duplication, not a second source of truth: checks rows are already
#   immutable, never soft-deleted, and already carry every one of those
#   fields unconditionally — `retain_answer: false` only nulls `answer_text`,
#   nothing else. A written-but-never-built module description left the
#   contract claiming a store that does not exist and was never going to earn
#   its keep.
#
#   The same discussion surfaced a real gap this decision closes rather than
#   defers: `PATCH /api/users/{id}/role` (~L1108) promises it is audited
#   (`actor_id`, `old_role`, `new_role`, `timestamp`), but no event table for
#   it exists. `UserStatusEvent` already covers the equivalent for
#   deactivate/reactivate/delete. Folding role events into it (extra nullable
#   columns, or a discriminator + generic payload) was considered and
#   rejected: `UserStatusEnum`/`UserRoleEnum` don't share column shape, a
#   merged table would undermine the contract's own stated reason for giving
#   role changes a distinct endpoint ("always its own distinct, audited
#   action"), and a second ~10-line table mirroring `UserStatusEvent`'s shape
#   costs about the same as the discriminator plumbing anyway.
#
#   DECISION. No standalone `audit` module, now or later. Removed it from the
#   module TODO list and the "audit table"/"audit entry" text in the checks
#   module — checks rows are already self-auditing, per CheckResult's Tier 1
#   guarantee that actor_id/verdict/created_at/model_version are always
#   present. Per-domain append-only event tables are the pattern instead:
#   `UserStatusEvent` today, and a same-shaped `UserRoleEvent`
#   (actor_id/from_role/to_role/created_at) to be added when
#   `PATCH /api/users/{id}/role` is implemented. A combined "everything that
#   happened to this user" timeline, if ever needed, is a `UNION ALL` / view
#   across the two event tables at query time — not a reason to merge them
#   now. No wire-format or behaviour change; this only corrects what the
#   contract claimed existed. See
#   `docs/superpowers/specs/2026-09-05-batches-worker-detector-design.md`
#   Decision 2 for the full writeup this entry summarises.
#
# [0.10.0] Invite email copy is wrong, and reset is coming later - fix both
#          with one flag instead of two endpoints.
#
#   PROBLEM. [0.9.0]'s invite email is Auth0's stock Change Password copy
#   ("You have submitted a password change request!") - false for a brand
#   new account. The instinct to fix this by finding an Auth0 "temporary
#   password" primitive (Cognito-style) doesn't work: Auth0 has none for a
#   Database connection. Repurposing the password-change flow as the
#   invitation IS Auth0's own documented pattern for an invite-only Database
#   connection (auth0.com/docs/customize/email/send-email-invitations-for-
#   application-signup), not a workaround - so the fix is to do that pattern
#   properly, not to replace it.
#
#   DECISION. `invite_user`'s `POST /api/v2/users` call now also sets
#   `app_metadata: { pending_activation: true }`. The Change Password email
#   template (Auth0 dashboard, requires an external SMTP provider to
#   customize - built-in Auth0 email cannot use custom templates) branches
#   on that flag via Liquid to send invite copy instead of reset copy. A
#   dashboard-side Post-Login Action clears the flag on first sign-in. Both
#   dashboard steps are configuration, not code, and are not part of this
#   repo. `/dbconnections/change_password` - the same call `invite_user`
#   already makes - stays the one endpoint for both cases; a future
#   self-service "forgot password" link calls it directly from the
#   frontend (no token involved, so no BFF boundary crossed) and gets reset
#   copy for free because the flag is already cleared by then.
#
#   REJECTED. The Management API's `POST /api/v2/tickets/password-change`
#   (what [0.8.0] replaced) has `mark_email_as_verified`/`result_url`
#   options this app doesn't need, and doesn't send the email itself -
#   back to manual relay. Auth0 Organizations invitations are B2B
#   multi-tenant machinery (org membership, org switcher) for a flat
#   instructor/TA roster with no tenancy concept - wrong shape.
#
#   NOT DONE YET. The email template edit, SMTP provider, and Post-Login
#   Action are dashboard configuration only - no self-service reset feature
#   exists yet to need them beyond making the copy correct, so they aren't
#   built speculatively here.
#
# [0.9.0] Auth0 emails the invitee directly instead of returning a link
#         for the admin to relay by hand.
#
#   PROBLEM. [0.8.0]'s `activation_url` worked, but only by pushing a manual
#   step onto the admin: copy the one-time link out of the `POST /api/users`
#   response and send it to the invitee themselves (email, chat, whatever).
#   That's avoidable friction and an easy way to lose the link, since it is
#   never shown again after the create call.
#
#   DECISION. `invite_user` now calls the Authentication API's
#   `POST /dbconnections/change_password` (public, keyed on `AUTH0_CLIENT_ID`,
#   no bearer token) instead of `POST /api/v2/tickets/password-change`. Auth0
#   sends the invitee their own password-set email directly - there is no URL
#   left for this app to hand back. `UserProvisionResponse` is retired;
#   `POST /api/users` now returns a plain `User` like every other write.
#
#   CONSEQUENCE. The Management API user-creation call now also sets
#   `verify_email: false` (alongside the existing `email_verified: false`) -
#   without it, Auth0 separately auto-fires its own "Verify Your Account"
#   email on creation, which only marks the address verified and does
#   nothing for login. That stray email was a real symptom during testing:
#   an invitee received a "Verify Your Account" email but no way to set a
#   password, because the actual activation link was sitting unread in the
#   admin's Postman response.
#
# [0.8.0] Provisioning now also creates the Auth0 credential.
#
#   SUPERSEDED in part by [0.9.0]: the credential is still created here, but
#   Auth0 emails the invitee directly; `activation_url` is no longer returned.
#
#   PROBLEM. [0.7.0] closed self-service signup (Disable Sign Ups), which was
#   the right call for security but had an unnoticed side effect:
#   provisioning a `users` row used to be sufficient because the *other*
#   half - an Auth0 identity - got created automatically, for free, on the
#   invitee's own first login (whichever social IdP they already had an
#   account with created it). Disable Sign Ups removes that free half. A
#   `users` row with no matching Auth0 credential is a silent, permanent
#   lockout: the person is "provisioned" by every signal this app can show
#   an admin, and cannot sign in, ever, with no error pointing at why. Found
#   by hitting it directly - a correctly provisioned account had no way in.
#
#   DECISION. `create_user` (POST /api/users) and `scripts.provision_user`
#   both now create the Auth0-side Database-connection credential as part of
#   provisioning, using Auth0's own documented invitation pattern
#   (auth0.com/docs/customize/email/send-email-invitations-for-application-
#   signup): create the user via the Management API with a throwaway
#   password neither we nor the invitee ever see, then generate a
#   password-change ticket (a one-time link) via the same API. The invitee
#   opens the link and sets their own password - Auth0 never learns a
#   password we chose, and we never learn the one they choose.
#
#   ORDERING. The Auth0 call happens before the local `users` row is
#   committed, not after. A `users` row with no Auth0 credential is the
#   exact failure this decision exists to prevent, so create_user must not
#   produce that state on a partial failure - if Auth0 credential creation
#   fails, the request fails and nothing is saved locally. The reverse
#   ordering (commit first, create Auth0 credential second) would recreate
#   the same lockout on any Auth0-side failure, just one line later.
#
#   NEW CONFIG. `AUTH0_M2M_CLIENT_ID` / `AUTH0_M2M_CLIENT_SECRET` - a
#   separate Auth0 application (client_credentials grant, authorized for the
#   Management API, `create:users` scope at minimum) from the
#   `AUTH0_CLIENT_ID`/`AUTH0_CLIENT_SECRET` pair used for the login flow
#   itself. Required at startup, same "refuse to boot rather than run
#   half-broken" pattern as the other four AUTH0_* vars - without it,
#   provisioning is silently broken in exactly the way this decision exists
#   to prevent.
#
#   CONSEQUENCES.
#     - `UserProvisionResponse` (`User` + `activation_url`) is a new schema,
#       returned only from `POST /api/users`'s `201` - never persisted,
#       never returned again. The admin who provisions someone is the only
#       route the link has to reach them.
#     - New `502` response on `POST /api/users`: Auth0 Management API
#       failure. Distinct from `409` (local duplicate) - this is an
#       upstream failure, not a caller mistake.
#     - `scripts.provision_user` prints the same link to stdout instead of
#       returning it, since it has no HTTP response to put it in.
#     - Root admin seeding is unaffected in shape (still a `users` row with
#       `auth0_sub` NULL until first login) but must now also go through
#       this path or an equivalent manual Auth0 dashboard credential
#       creation - a bare `users` row is no longer sufficient for anyone,
#       root admin included.
#
# [0.7.0] Auth0 connection swapped from Microsoft social to Database
#         (email/password).
#
#   PROBLEM. The Microsoft social connection ([0.6.0]) reintroduced the same
#   class of problem it was supposed to sidestep: a federation hop with its
#   own failure surface. Concretely, hit during local integration testing:
#     - The redirect chain through the Microsoft hop interacts with the
#       frontend's CSP `form-action` directive in ways that are easy to
#       misconfigure and hard to debug (a stale Entra-era `form-action`
#       value silently blocked the post-login redirect with no console
#       error — the failure mode looked like a dead form, not a CSP block).
#     - Behavior was inconsistent between personal and work/school Microsoft
#       accounts, which is exactly the ambiguity Auth0 was meant to remove.
#   Neither problem is inherent to OIDC or to this app's architecture — both
#   are specific to routing through a second identity provider.
#
#   DECISION. Reconfigure the Auth0 application to exactly one connection: a
#   Database (email/password) connection, hosted entirely on Auth0's own
#   login page — no second IdP hop. Everything above the connection layer is
#   unchanged: OIDC Relying Party, no access/refresh token stored, BFF
#   pattern, opaque `__Host-` session cookie, invite-first provisioning
#   keyed on email, `users.auth0_sub` schema from [0.6.0] untouched (Auth0
#   assigns a `sub` claim — `auth0|...` — to Database-connection users the
#   same way it assigned one to Microsoft-federated users; the column's
#   nullable-until-first-login semantics don't change).
#
#   No backend code changes. `apps/api/app/auth/oidc.py` already registers
#   the client generically via `server_metadata_url` discovery and never
#   parsed a Microsoft-specific claim — the connection swap is entirely an
#   Auth0 dashboard change.
#
#   SELF-SERVICE SIGNUP — verified against Auth0's own docs before deciding,
#   because a Database connection changes the sign-up-surface question a
#   social connection doesn't have:
#     - **Disable Sign Ups** (Authentication > Database > connection
#       settings) is Auth0's own documented mechanism for an invite-only
#       Database connection (Auth0 Support: "Restrict Sign-Ups to Just
#       Invited Users"; multiple Auth0 Community threads confirm the same
#       pattern). Turning it on removes the sign-up option from Universal
#       Login entirely — credentials can only be created by us (dashboard or
#       Management API), never by a visitor.
#     - Auth0's own passwordless best-practices doc carries an explicit
#       caveat on the same toggle: "When Disable Sign Ups is enabled, your
#       application may become vulnerable to user enumeration attacks... If
#       you do enable it, Brute-force Protection may mitigate the threat...
#       but it does not fully protect your application"
#       (auth0.com/docs/authenticate/passwordless/best-practices). Read
#       literally this is a warning *against* enabling it, but the
#       Community/Support-documented invite-only pattern above enables it
#       anyway — the resolution is that Disable Sign Ups is still correct
#       (it is *more* restrictive than open sign-up, not less), but must not
#       be the only control.
#     - DECISION: enable Disable Sign Ups **and** enable Attack Protection
#       tenant-wide (Bot Detection, Suspicious IP Throttling, Brute-force
#       Protection — all free dashboard toggles, per Auth0's own Signup
#       Attack Playbook). This is defense in depth on top of the
#       backend-side gate that already exists independent of Auth0 config:
#       `resolve_user` only issues a session for a sub already tied to an
#       active `users` row — an Auth0 credential existing is necessary but
#       never sufficient to get in.
#
#   ALTERNATIVE CONSIDERED: keep the Microsoft social connection, chase the
#   redirect-chain bugs to ground instead of switching connection type.
#   Rejected — those bugs are inherent to the federation hop (a second
#   party's redirect/consent behavior, outside this app's control), not a
#   one-time misconfiguration; switching removes the whole bug class instead
#   of patching instances of it.
#
#   ALTERNATIVE CONSIDERED: a different social IdP (Google) instead of
#   Microsoft. Rejected — no SSO requirement exists (users are individually
#   invited by email regardless of provider; there is no institutional
#   Google/Microsoft tenant this app needs to trust), so swapping one
#   federation hop for another buys nothing and keeps the same class of risk.
#
#   CONSEQUENCES.
#     - `info.description` "Authentication model": "Microsoft social
#       connection" language replaced with "Database connection, Disable
#       Sign Ups enabled, Attack Protection enabled".
#     - `GET /api/auth/login` description: no longer mentions federating to
#       a third-party connection.
#     - `POST /api/auth/logout` "Residual behaviour" note (Microsoft session
#       persisting after logout) removed — there is no upstream federated
#       session to leave dangling. The "Two-step logout" rationale
#       (Auth0's own SSO session surviving a local session revoke) still
#       holds and is unchanged.
#     - Root admin provisioning: the `users` row is still seeded the same
#       way; the matching Auth0 credential is now created via the
#       Database connection (dashboard or Management API) instead of
#       relying on the admin's first Microsoft sign-in to mint one.
#
# [0.6.0] Identity provider swapped from Entra ID to Auth0.
#
#   SUPERSEDED in part by [0.7.0]: Auth0 stays, but the Microsoft social
#   connection was replaced by a Database (email/password) connection.
#
#   PROBLEM. The Entra ID integration required registering the app in the
#   university's own Entra tenant (app registration + admin consent). The
#   sponsor could not get that approval — a capstone project has no path to
#   university IT sign-off on this timeline. The blocker was specifically
#   the app-registration/tenant-whitelisting step, not the OIDC/BFF
#   architecture itself, and not the user population (allowlisted
#   instructors/TAs, admin pre-provisions by email, no self-service signup).
#
#   DECISION. Swap the identity broker to Auth0, configured with exactly one
#   connection: the Microsoft social connection. Instructors still sign in
#   with their Microsoft account; the app registration lives in Auth0's own
#   tenant instead of the university's, which removes the dependency on
#   university IT entirely. Everything else stands: OIDC Relying Party, no
#   access/refresh token stored, BFF pattern, opaque `__Host-` session
#   cookie, invite-first provisioning keyed on email.
#
#   ALTERNATIVE CONSIDERED: Firebase Auth. Rejected — Firebase's SDK is built
#   around handing an ID token to browser JS by design, which fights the
#   "token structurally unreadable to JS" property the BFF exists for.
#
#   ALTERNATIVE CONSIDERED: pivot away from BFF to JWT-in-browser storage,
#   prompted by a generic Auth0 SPA quickstart. Rejected after checking
#   Auth0's own token-storage guidance
#   (auth0.com/docs/secure/security-guidance/data-security/token-storage),
#   which recommends server-side/BFF handling as the *most* secure option
#   whenever a backend exists — the SPA quickstart guidance is the fallback
#   for backend-less apps, not a recommendation to abandon BFF here.
#
#   CONSEQUENCES.
#     - `users.entra_oid` -> `users.auth0_sub`; root_admin reseeded on a
#       hardcoded Auth0 `sub` instead of an Entra `oid`.
#     - The `login_hint`-claim-replay-at-logout mechanism (`users.logout_hint`,
#       `record_logout_hint`) is dropped, not ported. It existed to suppress
#       Entra's account-picker prompt on sign-out via its RP-Initiated Logout
#       (`end_session_endpoint`, `logout_hint` param). Auth0 does not
#       implement that OIDC mechanism for its own session — it exposes
#       `/v2/logout?client_id=...&returnTo=...` instead, which reads Auth0's
#       own session cookie and needs no per-user hint. Nothing is lost:
#       there was no equivalent to carry forward.
#     - The "force account chooser on second login after logout" behavior
#       (added in the login-hotfix that shipped `force_account_chooser`)
#       moves from Entra's `prompt=select_account` to Auth0's `prompt=login`
#       — same goal (a second login must not silently reuse a stale SSO
#       session), the closest primitive Auth0 actually exposes.
#     - `GET /api/detector` capability-flag pattern, `strictness` enum,
#       checks/detector module boundary, RBAC delegation chain, session
#       lifetime rules: all untouched. None of this was Entra-specific.
#
# [0.5.9] GET /api/detector's 503 removed.
#
#   PROBLEM. The response was documented as "Detector service unreachable",
#   but GET /api/detector's whole purpose per [0.5.1] below is to hand back
#   static server-declared config - requires_question_text, min/max answer
#   length, strictness levels, which Tier 3 modules to render. Nothing in
#   answering it touches the live detector; DETECTOR_CAPABILITIES is a plain
#   dict built from constants. There was no failure mode that could actually
#   produce this response.
#
#   Worse, the 503 as written would have reintroduced a pattern already
#   argued against for the sibling endpoint: GET /api/detector/status owns
#   detector reachability and is deliberately always 200, because a down
#   detector is a state to render (a status badge), not a failed request.
#   Wiring a live health check into GET /api/detector to produce this 503
#   would fail that judgement on the one endpoint fetched at SPA bootstrap
#   alongside session/user info - a transient detector blip at login would
#   fail the whole app load, for a payload that does not need the detector
#   to be up to answer correctly.
#
#   DECISION. Removed the 503. The response's own stated intent - "the SPA
#   should disable submission" - is already served by GET /api/detector/status,
#   which the SPA polls. No behaviour change on either endpoint; this only
#   corrects what GET /api/detector's contract claimed it could do.
#
# [0.5.8] CheckSummary widened: raw_score + strictness_applied +
#   batch_file_name added, answer_preview reverted to full answer_text.
#
#   PROBLEM. CheckSummary (0.5.0) was leaner than what the SPA's history
#   table actually renders. The table's Score column reads raw_score; the
#   per-batch strictness tag (built by grouping checks client-side on
#   batch_id — there is no separate batches resource, see [0.5.0] below) reads
#   detector.strictness_applied; the batch's displayed file name reads
#   batch_file_name. None of the three exist on CheckSummary as originally
#   specified. Because a check or batch is rendered from the full CheckResult
#   POST /api/checks returns at submission time, and only from CheckSummary on
#   every reload after that, the gap wouldn't show up in normal use — the row
#   would render correctly, then go blank (or fall back to a generic "Batch"
#   label) on exactly those fields the moment the page is refreshed or
#   revisited later. A regression that only appears a step removed from the
#   action that causes it.
#
#   DECISION. Add raw_score, strictness_applied, and batch_file_name to
#   CheckSummary. The first two are flattened out of detector the same way
#   model_version already is; batch_file_name rides alongside the existing
#   batch_id. All three are cheap, non-privacy-sensitive scalars — not a
#   reason to nest a partial DetectorInfo or invent a batches lookup.
#
#   Also reverted answer_preview back to full answer_text. The rationale for
#   excluding full answer text from a list response — payload size, not
#   shipping every stored student answer to the browser just to draw a table
#   — still holds in principle. But the history search box currently does a
#   full-text client-side substring match against answer_text, and
#   GET /api/checks has no server-side search parameter to fall back to.
#   Truncating to a ~120-character preview here would silently stop search
#   from matching anything past that point — a quiet regression, not a loud
#   one, and worse for it. Deferred rather than solved: when a server-side
#   search parameter lands on GET /api/checks, answer_text should come back
#   out of CheckSummary in favour of answer_preview or nothing.
#
# [0.5.6] `provisioned_by` is the supervision edge, and it is settable.
#
#   SUPERSEDED by [0.21.0]: supervision is the many-to-many `supervisions`
#   table; `provisioned_by` only records who created the account.
#
#   PROBLEM. The SPA held "who supervises whom" in a localStorage table of
#   instructor->assistant links, and every screen that asked the question read
#   it from there. The database's only supervision edge is `provisioned_by` on
#   `users`, which the API set to the caller's id and never accepted from the
#   body. The two never met, with three consequences, all confirmed by driving
#   the app:
#
#     1. A correctly provisioned assistant could not screen. The gate looked
#        them up in the link table, found nothing, and told them "You are not
#        assigned to an instructor yet" — the product's core feature, denied to
#        a properly onboarded user.
#     2. The roster called them "Unassigned", to the admin and to the very
#        instructor who supervises them, because their id was only ever in the
#        link table of the browser that created them.
#     3. When an admin created an assistant "under instructor A", the server
#        recorded the *admin* as the supervisor. The pick reached localStorage
#        and stopped there.
#
#   DECISION. One supervisor per assistant, carried by `provisioned_by`, owned
#   by the server. The link table is deleted, not synced.
#
#   The alternative was a real `supervision` table supporting many instructors
#   per assistant, which is what the UI had been built for ("Also supervised
#   by", per-link "Since <date>", multi-select assignment). Rejected for the
#   MVP: the column already carried the edge everywhere authorization looked
#   (`_can_view_user`, `_may_manage`, the instructor's `list_users` scope), so
#   one column was already the de facto model and a second store would have
#   given two answers to one question — the same failure being fixed here, one
#   layer down. The multi-supervisor UI was trimmed to match rather than the
#   schema grown to match it. Revisit if an assistant genuinely needs to be
#   shared, which is a scheduling question nobody has asked yet.
#
#   Overloading one column with "who created this" and "who supervises this" is
#   the acknowledged cost. It only bites for non-assistants, where the value is
#   descriptive and nothing gates on it; for an assistant the column means
#   supervisor, full stop. `NULL` therefore had to mean unassigned rather than
#   "created by a script", which is also what CLI-provisioned rows already
#   carried — so seeded accounts read as unassigned and cannot screen until
#   somebody places them. That is the correct answer for them.
#
#   CONSEQUENCE. `provisioned_by` rides on `GET /api/auth/me`. The SPA needs it
#   on every page load to decide whether to show the screening UI, a second
#   round trip would cost that on every navigation, and an assistant cannot
#   list users to obtain it any other way.
#
#   Unassigning revokes sessions (see the endpoint). Assigning is admin-only,
#   releasing-your-own is not — an instructor releasing an assistant can only
#   ever give access away, never take it, so it needs no admin.
#
# [0.5.5] GET /api/users (list) widened from root_admin-only to
#   instructor-delegated (own TAs only).
#
#   SUPERSEDED by [0.21.0] and [0.24.0]: an instructor sees the TAs they
#   currently supervise, not those they provisioned, and any other `role`
#   filter is `403`, not an empty page.
#
#   [0.4.0]'s original text explicitly rejected this: "an instructor
#   enumerating other instructors' accounts is a privilege-escalation-
#   adjacent surface... even though instructors have narrow delegation
#   authority over TA provisioning." That reasoning is still correct as far
#   as it goes — it's about instructors seeing *other instructors*. But it
#   conflated that with instructors seeing *their own provisioned TAs*,
#   which is a strictly narrower ask: an instructor can already list any one
#   of their own TAs individually via `GET /api/users/{id}` (object-level
#   visibility, [0.5.2]) and can already act on them via `POST /api/users`,
#   `DELETE /api/users/{id}`, and `POST /api/users/{id}/restore` ([0.5.4]).
#   Blocking the *list* view of exactly the same rows an instructor can
#   already see one-by-one and already has delegated authority over doesn't
#   add a real privacy boundary, it just forces an instructor-facing UI to
#   fan out N individual `GET /api/users/{id}` calls to reconstruct a list
#   the API could return directly. The original privilege-escalation concern
#   is preserved in full: instructors still cannot see other instructors,
#   root_admin rows, or TAs provisioned by someone else, at any granularity.
#
#   `role` filter is force-scoped rather than rejected for instructor
#   callers, consistent with the filter-vs-create asymmetry already
#   established for `actor_id` on `GET /api/checks` ([0.3.0] family) — a
#   `403` on an out-of-scope `role` value would confirm to the caller that
#   rows of that role/owner exist, which is exactly the enumeration oracle
#   the asymmetry rule exists to avoid.
#
# [0.5.4] DELETE /api/users/{id} and POST /api/users/{id}/restore widened
#   from root_admin-only to instructor delegation.
#
#   SUPERSEDED by [0.18.0]: accounts have a three-state `status`, with
#   deactivate/reactivate replacing `restore`, and deletion is root_admin-only.
#
#   Both endpoints originally inherited root_admin-only from the same
#   copy-paste lineage flagged in DECISION LOG [0.5.2] (see that entry for
#   the analogous GET /api/users/{id} history). In practice the
#   already-implemented soft_delete_user service enforced instructor
#   delegation over the instructor's own teaching_assistant rows from the
#   start — the root_admin-only text here was already stale against the
#   shipped code, not a deliberate restriction. Restore is documented as the
#   mirror of delete (see the module summary in the CHANGELOG), so the two
#   should not diverge in delegation scope: an instructor who can delete
#   their own TA can also undo that action. Widening both to the same
#   delegation chain as POST /api/users keeps create/delete/restore
#   internally consistent instead of restore/delete being stricter than
#   provisioning for no stated reason.
#
#   A `root_admin` target is rejected on restore regardless of actor. There
#   is exactly one `root_admin` row (seed-migration-only, per POST
#   /api/users's existing rule), and DELETE was never restricted from
#   targeting it — closing that gap here rather than leaving a
#   theoretically-reachable "restore the one root_admin" path unguarded.
#
#   POST, not PATCH: restore has no client-supplied representation to
#   partially apply — it's a state-transition command ("reactivate"), audited
#   as its own action the same way DELETE and POST /api/users are, not a
#   field edit like PATCH .../role's `{new_role}` body. There is no generic
#   PATCH /api/users/{id} in this contract for arbitrary field updates;
#   PATCH is reserved for the one endpoint that actually receives a partial
#   representation to apply.
#
# [0.5.3] In-app session resolution moves from middleware to Depends().
#
#   PROBLEM. `SessionAuthMiddleware` (a `BaseHTTPMiddleware` subclass) opened
#   its own `async_session()`, separate from the per-request session `get_db`
#   hands to route handlers, and closed it before `call_next(request)` ran.
#   The `User` object cached on `request.state.user` was therefore already
#   *detached* (SQLAlchemy's term for an object whose session has closed) by
#   the time any route handler saw it — touching an unloaded/lazy attribute
#   on it later raises `DetachedInstanceError`. Confirmed as a real seam, not
#   theoretical: `tests/routes/test_auth.py`'s `test_me_with_valid_session_*`
#   test has to `patch("auth.middleware.async_session", ...)` to point the
#   middleware's independent session at the test's session — the tests were
#   already compensating for the two sessions being unrelated.
#
#   Separately, the middleware ran unconditionally on every request —
#   `/health`, `/docs`, `/openapi.json`, 404s — paying a Postgres round trip
#   for a session lookup regardless of whether the route needed identity.
#
#   DECISION. Replace the middleware with a `Depends()` chain:
#   `get_current_user_id` (extracts identity — cookie locally, gateway
#   header once [0.5.3]'s gateway integration ships) -> `get_current_user`
#   (the only function that queries Postgres, on the SAME session
#   `get_db` gives the route handler) -> `require_role` (unchanged
#   role-rank logic, now reading its input from `Depends()` instead of
#   `request.state`). This fixes the detached-object risk by construction —
#   the `User` row and the route handler now share one session — and makes
#   the session lookup opt-in per route instead of unconditional.
#
#   To avoid trading a correctness bug for a security regression (losing
#   middleware's "every route is protected unless proven otherwise"
#   property), `require_role` is attached at the `APIRouter` level
#   (`dependencies=[Depends(require_role(min_role))]`) for every router
#   except `auth`'s intentionally-public `/login` and `/callback` routes,
#   rather than left as an opt-in per-endpoint dependency.
#
#   FORWARD-LOOKING — SUPERSEDED by [0.25.0]: trusting `X-PP-User-Id` shipped
#   as an authentication bypass and was removed; the cookie is checked on
#   every request, gateway or not. Original text kept for the record:
#   This is also the shape that lets the app stay correct
#   once `x-gateway-configuration`'s authorizer is real: `get_current_user_id`
#   is the only function whose implementation differs behind the gateway
#   (trust `X-PP-User-Id`, skip re-parsing the cookie) vs. local dev (no
#   gateway exists locally, so it still does the cookie lookup itself).
#   `get_current_user`, `require_role`, and every route stay identical either
#   way. See `x-gateway-configuration.context_propagation`.
#
#   ALTERNATIVE CONSIDERED: keep `BaseHTTPMiddleware` and have it borrow the
#   request's `get_db`-scoped session instead of opening its own. Rejected —
#   ASGI middleware runs outside FastAPI's dependency-injection system, so
#   there's no supported way for it to receive the same per-request session
#   `Depends(get_db)` produces without hand-rolling that plumbing. It also
#   wouldn't address the unconditional-per-request-cost issue.
#
# [0.5.2] GET /api/users/{id}: object-level visibility, not a `403` role gate.
#
#   The endpoint originally documented both `403` and `404`, inherited from
#   copy-pasting the response set used by the role-gated endpoints
#   (PATCH .../role, DELETE, POST /api/users). But this endpoint has no
#   function-level role gate — every provisioned user is allowed to *call*
#   it, since self-access is always permitted. So a denial here is never
#   "your role can't do this," it's always "this particular target isn't
#   visible to you" — exactly the object-level case the `NotFound` schema's
#   existence-hiding conflation exists for (see components/responses/NotFound).
#   Kept `403` reserved for endpoints with a real function-level gate
#   (root_admin-only writes); removed it here since no code path produces it.
#
#   Visibility rule (read-only; write/patch scoping is unchanged and still
#   root_admin-only pending explicit extension):
#     - root_admin            -> sees everyone, including other root_admins.
#     - any role               -> always sees their own record.
#     - instructor             -> sees other instructors and TAs, not root_admin.
#     - teaching_assistant     -> sees any instructor, and only TAs sharing
#                                  their own `provisioned_by` (siblings under
#                                  the same instructor); not root_admin, not
#                                  another instructor's TAs.
#   root_admin rows are invisible to non-admins across the board — treated
#   the same as any other out-of-scope target (404), not specially exposed
#   as "public" metadata.
# =============================================================================
#
# [0.5.1] `question_text` requiredness is a RUNTIME capability, not a schema
#   property.
#
#   Whether the detector scores on (question, answer) or on answer alone is
#   unknown and unknowable until fine-tuning is underway. Three ways to handle
#   an unknown of this shape:
#
#     (a) Guess now, revise later. Cost: a breaking contract revision, a
#         frontend release, and — worst — a change to the CSV format that
#         instructors have already been shown. External-facing formats are the
#         expensive thing to change, not JSON schemas.
#     (b) Make it required now, relax later. Relaxing is non-breaking, so this
#         is the safe direction. But it forces instructors to type a question
#         for every single-answer check even if it never affects the result —
#         paying a permanent UX cost to hedge a decision that may go the other
#         way.
#     (c) Keep the schema permanently permissive; express the requirement as a
#         server-declared flag the client reads at bootstrap. Chosen.
#
#   (c) costs one endpoint and one conditional in the SPA. In exchange the
#   answer becomes a config value: flipping it is a redeploy, not a revision.
#   GET /api/detector was going to be needed regardless — the SPA already has
#   to know max length, the strictness levels, and which Tier 3 modules to
#   render — so the marginal cost of carrying this flag on it is close to zero.
#
#   Generalises: anything about the served model that E2 might change belongs
#   on GET /api/detector, not in the schema. Hardcoded assumptions become
#   breaking revisions; declared capabilities become config.
#
#   `DetectorInfo.used_question_text` records what actually happened per check,
#   because results produced under different input compositions are not
#   comparable and the model_version alone does not distinguish them.
#
#   PREFERRED RESOLUTION: fine-tune with question dropout, so the model
#   tolerates both. That makes requires_question_text permanently false and
#   deletes the conditional from the SPA, the batch validator, and the CSV
#   format. One training-time decision beats a runtime branch carried forever.
#   Raised with the ML team; not yet answered.
#
# [0.5.0] Strictness is an enum; the client never sends a threshold.
#
#   Rejected the proposed `threshold: 0.50` float on three grounds:
#     1. Score scales are model-specific. A threshold stored client-side or in
#        a user preference silently changes meaning after every model swap —
#        and swapping the served model is an explicit project goal (E2).
#     2. The headline evaluation metric is TPR at a FIXED FPR, calibrated on
#        the Mohler validation split. A client-supplied threshold discards that
#        calibration, so the FPR reported in the evaluation report would no
#        longer describe the deployed system. The report and the product would
#        be making different claims.
#     3. Zero-shot detectors do not emit probabilities at all (Binoculars emits
#        a cross-perplexity ratio, inverted). A UI slider bound to a raw number
#        has no stable meaning across detector families.
#
#   Consequence: adapters normalise to [0,1] monotonic in AI-likelihood, and
#   the strictness -> threshold table is a server-side calibration artefact
#   versioned alongside the model (`DetectorInfo.calibration_version`).
#
# [0.5.0] `instructor_id` is never accepted from the client.
#
#   The proposed request body carried a client-supplied instructor identifier.
#   Attribution comes from the authorizer context. Any other arrangement lets
#   one instructor attribute a check to another, in a system whose output is
#   used to justify misconduct proceedings.
#
#   `additionalProperties: false` on CheckCreateRequest makes this a 400 rather
#   than a silent ignore. Contrast with the audit/history `actor_id` FILTER,
#   which is silently overridden — that override exists to avoid an existence
#   oracle. No such concern applies to a create body, and failing loudly
#   catches the client bug at integration time instead of in production.
#
#   The proposed value was also a hash (`hash_8f7d6a5`). Pseudonymisation at a
#   layer where the server holds the mapping is not a privacy control; it only
#   makes joins harder. Internal `users.id` UUID throughout.
#
# [0.5.0] `label` is a machine enum, and `uncertain` is one of its values.
#
#   Display copy in an API response ("Likely AI-generated") forces the SPA to
#   string-match, makes a copy change a breaking API change, and blocks i18n.
#
#   More importantly the proposed shape had no third state. The proposal
#   commits to an abstention band, and E3's reliability map exists precisely to
#   identify where the detector stops being trustworthy. A binary label cannot
#   express "the tool declines to call this one", so the product would be
#   forced to state a verdict in exactly the cases the research says it should
#   not. `verdict` + `abstain_reason` carries that.
#
# [0.5.0] `/history` folded into `GET /api/checks`.
#
#   The v0 endpoint list carried `/checks` and `/history` as separate modules.
#   History is a filtered, instructor-scoped, paginated list of checks — the
#   same resource under a second name, which would mean two schemas, two
#   scoping implementations, and two places for the object-level authorization
#   to be got wrong. Batch results are the same list filtered by `batch_id`.
#
# [0.5.0] Single checks are synchronous — conditionally.
#
#   Correct for a fine-tuned encoder classifier. NOT correct if a zero-shot
#   detector (Fast-DetectGPT, Binoculars) wins E2, since both need full LLM
#   forward passes. Recorded here so that outcome triggers a deliberate
#   migration to the existing 202+polling pattern rather than a surprise at
#   integration. `CheckResult` is unaffected by that migration by design —
#   only the delivery mechanism changes.
#
# [0.5.0] GPTZero is evaluation-only, never in the serving path.
#
#   It is a commercial third-party API. Calling it at request time transmits
#   student answers to an overseas processor on every check — a PDPA exposure
#   with no compensating benefit, since it is a benchmark reference and not a
#   deployment candidate. Recorded because "just wire it up temporarily for the
#   PoC" is the obvious shortcut and it is the wrong one.
#
# [0.5.0] DEFERRED: idempotency keys on POST /api/checks.
#
#   A double-click currently produces two rows and two model invocations. Real
#   but low-cost: inference is cheap, duplicates are visible in history, and
#   the frontend can disable the button. Revisit only if batch retry semantics
#   force it. Noted so it is a decision, not an oversight.
#
# [0.4.0] Deletion is a timestamp, not a status enum.
#
#   SUPERSEDED by [0.18.0]: `users` now has a three-state `status`.
#
#   Considered a `status: pending | active | deactivated` field on `users`.
#   Rejected in favour of the existing `deleted_at` + `first_login_at NULL`
#   combination already in the [0.3.0] data model — introducing a parallel
#   status field would duplicate information already derivable from two
#   columns that exist for other reasons, and gives two sources of truth that
#   could drift (e.g. status='active' but first_login_at somehow NULL).
#   `deleted_at IS NOT NULL` is deactivated; `first_login_at IS NULL` is
#   pending; neither is pending/active.
#
# [0.4.0] DELETE /api/users/{id} revokes ALL sessions, immediately, via an
#   internal call.
#
#   SUPERSEDED in part by [0.25.0]: revocation is immediate because the app
#   checks the session on every request, not because of a gateway's
#   `result_ttl_seconds`. There is no gateway yet.
#
#   sessions.revoke_all_for_user(user_id) is a cross-module call, not a REST
#   endpoint — mirrors resolve_or_reject's existing precedent of the two
#   modules calling each other in-process rather than over HTTP. Immediate
#   effect depends on result_ttl_seconds=0 on the gateway authorizer (already
#   required by [0.3.0] for the same reason).
#
# [0.4.0] OPEN — delegation authority for instructor -> teaching_assistant
#   provisioning.
#
#   RESOLVED by [0.21.0]: delegation is live. Instructors add teaching
#   assistants by email (`POST /api/users/teaching-assistants`), which creates
#   or links the account and the supervision.
#
#   POST /api/users encodes the full delegation chain from [0.3.0]'s
#   provisioning model, including instructor's authority to provision
#   teaching_assistant accounts. But teaching_assistant is scoped as an E5
#   extension in the proposal, with no application surface for TAs yet. This
#   was implemented as designed in [0.3.0] rather than narrowed unilaterally,
#   but needs explicit confirmation: is delegated provisioning meant to be
#   live now (ahead of any TA-facing feature), or should POST /api/users be
#   root_admin-only until E5 actually starts, with the delegation table
#   re-enabled at that point?
#
# [0.3.0] Authorization is enforced in-service, NOT at the API Gateway.
#
#   Authentication is enforced at the edge; authorization is not. The split is
#   by granularity: the dividing question is whether a decision requires data
#   the gateway does not have.
#
#     - Session validity depends only on the credential presented. Context-free
#       -> edge is the correct layer, and it keeps unauthenticated traffic away
#       from application code.
#     - Object-level visibility (instructors see only their own audit entries;
#       an instructor-supplied `actor_id` filter is silently overridden) cannot
#       be evaluated without domain data. The gateway has no idea which rows
#       belong to whom.
#
#   Because object-level authorization must live in the service regardless,
#   adding role checks at the gateway would SPLIT authorization rather than
#   centralise it. Costs of that split:
#
#     1. Adding a role (teaching_assistant is planned) requires lockstep edits
#        to Terraform and application code.
#     2. A FastAPI route deployed without a corresponding gateway policy
#        attachment is silently unprotected. Nothing fails; no test catches it,
#        because the test suite does not read Terraform state. The equivalent
#        application-level defect — a missing require_role dependency — IS
#        caught by route-enumeration tests at review time.
#     3. Two enforcement points means two places to get it wrong.
#
#   Maps to OWASP API Security Top 10: API1 (Broken Object Level
#   Authorization) is not addressable at the gateway; API5 (Broken Function
#   Level Authorization) is, but only by accepting the split above.
#
#   Gateway-level authorization IS correct for scope-based endpoint
#   authorization across many polyglot services with policy-as-code
#   infrastructure (OPA, Cedar) and a platform team. That is not this system.
#
#   Authorization remains centralised — in ONE users-module primitive
#   (`require_role`), one place to change. Centralisation in code, which is
#   what delivers consistency, rather than centralisation in topology, which
#   only helps when the decision needs no domain context.
#
# [0.3.0] Invite-first provisioning; no default role.
#   Authentication against Entra is necessary but not sufficient. Rejected:
#   `role NOT NULL DEFAULT 'instructor'`, which would grant instructor access
#   to every account in the SMU tenant that discovers the URL — unacceptable
#   for a tool that adjudicates academic integrity.
#
# [0.3.0] Tenant-scoped authority, not /common.
#   SUPERSEDED by [0.6.0]: there is no Entra tenant. Sign-in is Auth0's
#   invite-only Database connection, and login matches on `auth0_sub`.
#
#   Provisioning matches on email at first login. Under `/common`, a personal
#   Microsoft account with a colliding address could claim a provisioned slot
#   before the intended user's first login. Tenant-scoping closes this;
#   validating `tid` at step 4 is the defence in depth.
#
# [0.2.0] REMOVED: GET /api/auth/frontchannel-logout
#
#   Entra fires front-channel logout when a user signs out of another
#   application in the tenant. Specified in v0.1.0 as best-effort single
#   sign-out. Cut, for four reasons:
#
#     1. The threat of concern is account disable. Entra is reported not to
#        reliably invoke front-channel logout on account disable or on
#        administrative "revoke sessions" — it fires on user-initiated
#        sign-out. It does not address the threat it was included for.
#     2. That threat is already bounded by the 4-hour absolute cap and
#        administrative revocation.
#     3. It costs a permanently unauthenticated endpoint. The request arrives
#        cross-site from Entra's origin, so a SameSite=Strict cookie is not
#        attached and the endpoint cannot sit behind the gateway authorizer.
#        A permanent increase in attack surface for a partial mitigation of an
#        already-bounded risk is a bad trade.
#     4. Hidden-iframe delivery degrades under third-party cookie blocking.
#
#   SUPERSEDED by [0.6.0]: the column was dropped with Entra.
#   `sessions.entra_sid` is RETAINED — it costs nothing, enables correlation
#   with Entra sign-in logs during an investigation, and makes reinstating the
#   endpoint a ~20-line change if the sponsor asks for SSO behaviour.
#
# [0.2.0] REMOVED: `role` from the authorizer context. See [0.3.0] above.
#
# =============================================================================
# DATA MODEL REFERENCE (not part of the API surface)
# =============================================================================
# The tables are defined in apps/api/app/models/ (SQLAlchemy) and created by
# the Alembic migrations in apps/api/alembic/versions/. Read those, not a
# copy here: the copy that used to sit here still described the Entra-era
# columns (`external_id`, `tenant_id`, `logout_hint`, `entra_sid`) long
# after they were gone. See DECISION LOG [0.25.0].
#
# Invariants worth stating outside the code:
#   - `role` and `provisioned_by` are owned by the users module; the auth
#     module never writes or evaluates them.
#   - root_admin is seeded with the `scripts.provision_user` CLI, which
#     creates (or finds) the Auth0 credential and stores its `sub`, with
#     provisioned_by = NULL. No API route can create a root_admin.
#   - `sessions` stores only the SHA-256 hash of the cookie value.
#   - No table stores an ID token, access token, or refresh token.
# =============================================================================
