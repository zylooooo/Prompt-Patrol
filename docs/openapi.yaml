#          `403`. This reverses the explicit root_admin-only rationale from
#          [0.4.0]'s original listUsers text — see DECISION LOG [0.5.5] for
#          why. Pagination cursor is an opaque base64 encoding of the last
#          returned `id`, keyset-ordered by `id`.
